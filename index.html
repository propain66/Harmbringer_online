<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harmbringer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&display=swap">
<style>
  /* ---------------------------------------------------------------------------
     Style: medieval woodcut. Parchment panels, dark brown ink, thin frames.
     --------------------------------------------------------------------------- */
  :root {
    --parchment: #e9dfc4;
    --parchment-dark: #d8caa6;
    --ink: #2b2116;
    --ink-soft: #5a4a36;
    --bg: #5d5850;
    --undead: #5a2d82;
    --blood: #8a2f2f;
    --gold: #c9a227;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
    font-family: "IM Fell English", Georgia, "Times New Roman", serif; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  /* z-index makes this a stacking context: CSS2DRenderer sets z-index on every label,
     which must never rise above the UI panels and modals. */
  #labels { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
  .hidden { display: none !important; }

  .panel { background: var(--parchment); border: 1px solid var(--ink); box-shadow: 0 0 0 3px var(--parchment), 0 0 0 4px var(--ink), 0 6px 18px rgba(0,0,0,.45); }
  button { font-family: inherit; font-size: 15px; color: var(--ink); background: var(--parchment-dark);
    border: 1px solid var(--ink); padding: 4px 12px; cursor: pointer; }
  button:hover:not(:disabled) { background: #f4ecd6; }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--ink); color: var(--parchment); }
  button.primary:hover:not(:disabled) { background: #4a3a28; }
  h1, h2, h3 { margin: 0 0 8px; font-weight: normal; }
  h2 { font-size: 24px; border-bottom: 1px solid var(--ink); padding-bottom: 4px; }
  h3 { font-size: 17px; margin-top: 10px; }
  .small { font-size: 13px; color: var(--ink-soft); }
  .row { display: flex; justify-content: space-between; gap: 8px; }

  /* World HUD (reference: Heroes of Might and Magic). Right: sidebar with minimap, armies, actions and
     the details of the chosen army. Bottom: resources, threat and time. Place info floats beside the sidebar. */
  :root { --side: 300px; --bar: 42px; }
  #header { position: absolute; inset: 0; pointer-events: none; z-index: 7; }
  #header > * { pointer-events: auto; }
  #bottomBar { position: absolute; left: 0; right: var(--side); bottom: 0; height: var(--bar); display: flex; align-items: center; gap: 10px; padding: 0 10px;
    box-shadow: 0 -2px 10px rgba(0,0,0,.35); border-width: 2px 1px 0 0; }
  #bottomBar .spacer { flex: 1; }
  #resources { display: flex; gap: 2px; }
  #resources .chip { display: flex; align-items: center; gap: 3px; padding: 2px 7px; cursor: help; font-size: 16px; white-space: nowrap; border-right: 1px solid rgba(43,33,22,.2); }
  #resources .chip:hover { background: #f4ecd6; }
  #resources .chip b { font-weight: normal; color: var(--undead); }
  #resources .chip .lbl { display: none; }
  #resources .chip.full b { color: var(--blood); }
  #status { display: flex; gap: 8px; align-items: center; cursor: help; white-space: nowrap; }
  #dial svg { display: block; width: 32px; height: 32px; }
  #dayNo { font-size: 20px; } #clock { font-size: 14px; } #date { font-size: 12px; }
  #timeDelta { position: absolute; right: 10px; bottom: calc(var(--bar) + 8px); white-space: nowrap; font-size: 16px; padding: 3px 10px;
    background: var(--undead); color: #f4ecd6; opacity: 0; transition: opacity .5s; pointer-events: none; box-shadow: 0 2px 8px rgba(0,0,0,.4); }
  #timeDelta.on { opacity: 1; }
  #threatChip { display: flex; align-items: center; gap: 7px; font-size: 14px; height: 30px; white-space: nowrap; }
  #threatChip .mini { display: flex; gap: 2px; align-items: flex-end; height: 20px; background: linear-gradient(to top, rgba(0,0,0,.25) 1px, transparent 1px); }
  #threatChip .mini i { width: 4px; display: block; min-height: 2px; }
  #threatChip.warn { color: var(--blood); }
  #btnNews { height: 30px; position: relative; white-space: nowrap; }
  #btnNews .badge { display: inline-block; margin-left: 5px; min-width: 16px; padding: 0 4px; border-radius: 8px; background: var(--blood); color: #f4ecd6; font-size: 11px; line-height: 15px; }
  .newsDay { margin: 10px 0 2px; font-size: 13px; color: var(--ink-soft); border-bottom: 1px solid rgba(43,33,22,.25); }
  .newsItem { display: grid; grid-template-columns: 52px 20px 1fr; gap: 4px; font-size: 14px; padding: 2px 0; }
  .newsItem .h { color: var(--ink-soft); font-size: 12px; padding-top: 2px; } .newsItem.unread { font-weight: bold; }
  .newsFilter { display: flex; gap: 4px; margin-bottom: 6px; } .newsFilter button { font-size: 12px; padding: 1px 8px; } .newsFilter button.on { outline: 2px solid var(--gold); background: #f4ecd6; }
  #threatPop { position: absolute; bottom: calc(var(--bar) + 10px); width: 300px; padding: 10px 14px; }
  #threatPop .threat { display: grid; grid-template-columns: 1fr 44px; gap: 0 6px; font-size: 13px; margin: 3px 0; }
  #threatPop .threat .bar { grid-column: 1 / 3; }
  #threatPop .threat .bar.troops { height: 5px; margin-top: 2px; } #threatPop .threat .bar.troops div { background: var(--blood); }
  #threatPop .threat .small { grid-column: 1 / 3; font-size: 11px; }
  #threatPop { max-height: calc(100% - var(--bar) - 30px); overflow-y: auto; }
  #threats .threat.hot { color: var(--blood); }
  #menuPop { position: absolute; right: calc(var(--side) + 8px); display: flex; flex-direction: column; gap: 5px; padding: 8px; min-width: 170px; }
  #menuPop button { text-align: left; }
  .threat .bar { height: 6px; border: 1px solid var(--ink); background: #f4ecd6; margin-top: 1px; }
  .threat .bar div { height: 100%; }
  .threat.dead { opacity: .45; text-decoration: line-through; }
  kbd { display: inline-block; margin-left: 6px; padding: 0 4px; font: 11px/14px Consolas, monospace; border: 1px solid var(--ink-soft); border-bottom-width: 2px; color: var(--ink-soft); vertical-align: 1px; }
  button.primary kbd { color: var(--parchment); border-color: var(--parchment); }
  button.icon { width: 34px; padding: 4px 0; }
  #sidebar { position: absolute; right: 0; top: 0; bottom: 0; width: var(--side); z-index: 6; display: flex; flex-direction: column; gap: 6px; padding: 8px;
    background: var(--parchment); border-left: 2px solid var(--ink); box-shadow: -3px 0 12px rgba(0,0,0,.4); }
  #sidebar #minimap { position: relative; left: auto; bottom: auto; padding: 0; border: 1px solid var(--ink); }
  #sidebar #minimap canvas { width: 100%; height: auto; aspect-ratio: 340 / 200; }
  #worldButtons { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
  #worldButtons button { display: flex; flex-direction: column; align-items: center; padding: 3px 2px 2px; font-size: 12px; position: relative; line-height: 1.15; }
  #worldButtons button .ic { font-size: 19px; line-height: 1.1; }
  #worldButtons #btnGo { grid-column: 1 / 4; flex-direction: row; justify-content: center; font-size: 15px; padding: 5px; }
  #worldButtons .badge { position: absolute; right: 3px; top: 2px; min-width: 16px; padding: 0 4px; border-radius: 8px; background: var(--undead); color: #f4ecd6; font-size: 11px; line-height: 15px; }
  #worldButtons .badge.busy { background: #8a6a2a; }
  #armyPanel { flex: 1; min-height: 0; display: flex; flex-direction: column; border-top: 1px solid var(--ink); padding-top: 6px; }
  #armyPanel .armyRows { display: flex; flex-direction: column; gap: 3px; margin-bottom: 6px; }
  .armyRow { display: flex; align-items: center; gap: 6px; padding: 2px 4px; border: 1px solid rgba(0,0,0,.15); cursor: pointer; background: rgba(255,255,255,.2); }
  .armyRow.on { border-color: var(--gold); background: #f4ecd6; box-shadow: inset 0 0 0 1px var(--gold); }
  .armyRow .portrait { width: 34px; height: 34px; flex: 0 0 34px; }
  .armyRow .rTxt { flex: 1; min-width: 0; font-size: 12px; line-height: 1.25; } .armyRow .rTxt b { font-size: 13px; }
  .armyRow .rTxt div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #armyPanel .armyCards { max-height: none; overflow-y: auto; flex: 1; min-height: 0; align-content: start; }
  @media (max-width: 1180px) { #date, #clock .small { display: none; } }
  /* Info panel (right) */
  #info { position: absolute; top: 10px; right: calc(var(--side) + 10px); width: 320px; max-height: calc(100% - var(--bar) - 20px); overflow: auto;
    padding: 10px 14px 12px; z-index: 5; }
  #info .close { position: absolute; right: 6px; top: 6px; width: 26px; height: 26px; padding: 0; font-size: 16px; line-height: 1; }
  #info h2 { padding-right: 28px; margin-bottom: 2px; }
  #info .sub { font-size: 13px; color: var(--ink-soft); margin-bottom: 8px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  #info .sub .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; border: 1px solid var(--ink); }
  #info .facts { margin: 6px 0; } #info .key { font-size: 15px; }
  #info details { margin-top: 8px; font-size: 13px; } #info summary { cursor: pointer; color: var(--ink-soft); }
  #info .warnline { color: var(--blood); font-size: 13px; }
  #info table { width: 100%; border-collapse: collapse; font-size: 14px; }
  #info td { padding: 2px 0; vertical-align: top; }
  #info td:first-child { color: var(--ink-soft); width: 45%; }
  #info .buttons { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }

  /* Hint line (bottom) */
  #hint { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); padding: 3px 14px; font-size: 13px;
    white-space: nowrap; z-index: 5; }

  /* Minimap (world) */
  #minimap { position: absolute; left: 10px; bottom: 10px; padding: 4px; z-index: 5; }
  #minimap canvas { width: 340px; height: 200px; display: block; cursor: crosshair; }
  #minimap .zoom { position: absolute; right: 8px; top: 8px; display: flex; flex-direction: column; gap: 3px; }
  #minimap .zoom button { width: 26px; height: 26px; padding: 0; font-size: 17px; line-height: 1; }
  #minimap .zoomLabel { position: absolute; left: 8px; top: 8px; font-size: 12px; padding: 0 5px; background: rgba(233,223,196,.85); border: 1px solid var(--ink); }

  /* Battle UI */
  #initBar { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; padding: 6px 8px; z-index: 5; }
  .initSlot { width: 62px; font-size: 10px; text-align: center; padding: 2px; border: 1px solid transparent; position: relative; cursor: pointer; }
  .initSlot.current { width: 96px; font-size: 11px; border-color: var(--gold); background: #f4ecd6; }
  .initSlot .pic { width: 44px; height: 44px; margin: 0 auto 2px; background: #3a332a center/cover no-repeat; border: 2px solid; position: relative; }
  .initSlot.current .pic { width: 70px; height: 70px; }
  .initSlot.enemy .pic { clip-path: polygon(50% 0, 61% 12%, 79% 7%, 82% 25%, 100% 32%, 90% 50%, 100% 68%, 82% 75%, 79% 93%, 61% 88%, 50% 100%, 39% 88%, 21% 93%, 18% 75%, 0 68%, 10% 50%, 0 32%, 18% 25%, 21% 7%, 39% 12%); }
  .initSlot.player .pic { clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%); }
  .initRound { align-self: stretch; display: flex; flex-direction: column; justify-content: center; text-align: center; font-size: 10px; padding: 0 5px;
    border-left: 2px solid #5a2d82; border-right: 2px solid #5a2d82; background: rgba(90,45,130,.12); color: #3a1e52; }
  .initRound b { font-size: 16px; }
  #roundBanner { position: fixed; left: 50%; top: 38%; transform: translate(-50%, -50%); z-index: 32; pointer-events: none; font: 44px/1.1 "IM Fell English", Georgia, serif;
    color: #f2e6cf; text-shadow: 0 2px 12px #000, 0 0 4px #000; opacity: 0; transition: opacity .35s; text-align: center; }
  #roundBanner.on { opacity: 1; } #roundBanner .sub { font-size: 18px; }
  .initSlot .cnt { position: absolute; right: 2px; top: 2px; font-size: 10px; background: rgba(0,0,0,.65); color: #fff; padding: 0 3px; }
  .initSlot .st { font-size: 10px; height: 12px; line-height: 12px; }
  .initSlot .en { height: 3px; background: #2a2a50; margin-top: 1px; } .initSlot .en div { height: 100%; background: #7a9aff; }
  .initSlot .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hpbar { height: 5px; border: 1px solid var(--ink); background: #f4ecd6; }
  .hpbar div { height: 100%; background: var(--blood); }
  .hpbar.player div { background: var(--undead); }
  #roundInfo { position: absolute; top: 124px; left: 50%; transform: translateX(-50%); padding: 2px 12px; font-size: 13px; z-index: 5; }
  /* Battle console at the bottom (reference: Heroes III): chronicle in the middle, actions on the right,
     the unit card above it on the left. */
  #battleBar { position: absolute; left: 0; right: 0; bottom: 0; height: 64px; z-index: 5; box-shadow: 0 -2px 10px rgba(0,0,0,.35); }
  #unitCard { position: absolute; left: 10px; bottom: 74px; width: 280px; padding: 10px 12px; font-size: 14px; z-index: 5; }
  #unitCard table { width: 100%; font-size: 13px; }
  #hoverCard { position: absolute; left: 10px; width: 280px; padding: 10px 12px; font-size: 14px; z-index: 5; pointer-events: none; border-color: var(--gold); }
  #hoverCard .portrait { float: right; width: 64px; height: 64px; margin: 0 0 4px 8px; }
  #hoverCard .ucStats { display: flex; flex-wrap: wrap; gap: 2px 10px; font-size: 13px; margin: 6px 0 4px; clear: both; } #hoverCard .st { white-space: nowrap; }
  #hoverCard .ucRow { font-size: 12px; margin-top: 2px; } #hoverCard .ucRow > span:first-child { color: var(--ink-soft); display: inline-block; min-width: 72px; }
  #hoverCard .hcTag { font-size: 11px; color: var(--ink-soft); margin-bottom: 2px; }
  #unitCard .ucStats { display: flex; flex-wrap: wrap; gap: 2px 10px; font-size: 13px; margin: 6px 0 4px; clear: both; } #unitCard .st { white-space: nowrap; cursor: help; }
  #unitCard .ucRow { font-size: 12px; margin-top: 2px; } #unitCard .ucRow > span:first-child { color: var(--ink-soft); display: inline-block; min-width: 72px; }
  #battleLog { position: absolute; left: 10px; bottom: 5px; height: 54px; right: var(--logRight, 480px); padding: 2px 10px; overflow: auto; font-size: 13px; z-index: 6; cursor: pointer;
    background: #f4ecd6; border: 1px solid var(--ink-soft); }
  #battleLog.open { height: min(340px, calc(100% - 240px)); box-shadow: 0 -4px 14px rgba(0,0,0,.35); }
  #battleLog p { margin: 0 0 3px; }
  #battleLog .hit { color: var(--blood); }
  #battleLog .good { color: var(--undead); }
  #battleButtons { position: absolute; right: 10px; bottom: 0; height: 64px; display: flex; gap: 6px; z-index: 6; align-items: center; max-width: 60%; }
  #battleButtons #abilityBar { flex-wrap: nowrap; overflow-x: auto; }
  #battleButtons #abilityBar { margin: 0 6px 0 0; }
  #hint { display: none !important; }

  /* Modals */
  .modal { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(30,25,18,.55); z-index: 20; }
  .modal .panel { max-width: 560px; width: calc(100% - 32px); max-height: calc(100% - 40px); overflow: auto; padding: 20px 26px; }
  .modal p { line-height: 1.45; font-size: 17px; }
  .modal .panel { position: relative; }
  /* Resources stay visible at the top while the list scrolls (recruiting, building). */
  .stickyRes { position: sticky; top: -20px; z-index: 1; background: var(--parchment); margin: 0 -26px 8px; padding: 8px 26px; border-bottom: 1px solid rgba(43,33,22,.3); font-size: 17px; }
  .modalClose { position: sticky; top: -12px; float: right; margin: -8px -14px 0 8px; width: 30px; height: 30px; padding: 0; font-size: 18px; line-height: 1; z-index: 2; }
  .modal .buttons { display: flex; gap: 10px; justify-content: flex-end; margin-top: 14px; }
  #loading .bar { height: 12px; border: 1px solid var(--ink); background: #f4ecd6; margin-top: 10px; }
  #loading .bar div { height: 100%; width: 0; background: var(--undead); }
  .recruitRow { display: grid; grid-template-columns: 72px 1fr auto; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px dotted var(--ink-soft); }
  .portrait { width: 72px; height: 72px; object-fit: contain; border-radius: 4px; background: radial-gradient(circle at 50% 40%, #8c826f, #4a4337); }
  .portrait.none { display: block; }
  #unitCard .portrait { float: right; width: 64px; height: 64px; margin: 0 0 4px 8px; }
  .recruitRow.locked { opacity: .5; }
  .modal .panel.wide { max-width: 900px; }
  .recLayout { display: grid; grid-template-columns: 170px 1fr; gap: 14px; align-items: start; }
  .recSide { position: sticky; top: 36px; display: flex; flex-direction: column; gap: 3px; }
  .recSide h3 { margin: 4px 0 2px; font-size: 15px; } .recSide button { text-align: left; font-size: 13px; padding: 2px 8px; }
  .recSide button.on { outline: 2px solid var(--gold); background: #f4ecd6; }
  @media (max-width: 760px) { .recLayout { grid-template-columns: 1fr; } .recSide { position: static; flex-direction: row; flex-wrap: wrap; } }
  .buildRow { padding: 8px 0; border-bottom: 1px dotted var(--ink-soft); }
  .buildRow .bHead { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 2px; }
  .buildRow .bBtn { margin-left: auto; }
  .armyList { font-size: 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
  .armyCards { display: grid; grid-template-columns: 1fr; gap: 4px; max-height: 300px; overflow-y: auto; }
  .aCard { position: relative; display: flex; gap: 6px; align-items: center; padding: 3px; border: 1px solid rgba(0,0,0,.12); background: rgba(255,255,255,.25); }
  .aCard.lich { border-color: var(--gold); }
  .aCard .portrait { width: 42px; height: 42px; flex: 0 0 42px; }
  .aCnt { position: absolute; left: 30px; top: 30px; background: rgba(0,0,0,.7); color: #fff; font-size: 11px; padding: 0 4px; border-radius: 6px; }
  .aBody { flex: 1; min-width: 0; } .aName { font-size: 13px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .aName .lvl { font-weight: normal; font-size: 11px; background: #5a2d82; color: #fff; padding: 0 5px; border-radius: 6px; }
  .aStats { font-size: 11px; display: flex; flex-wrap: wrap; gap: 0 7px; } .aStats .st { white-space: nowrap; }

  /* Toast messages */
  #toast { position: absolute; top: 168px; left: 50%; transform: translateX(-50%); padding: 8px 18px; font-size: 17px; z-index: 15;
    transition: opacity .4s; text-align: center; max-width: 80%; }

  /* Debug overlay */
  #debugTools { position: absolute; left: 14px; top: 420px; padding: 6px 10px; font-size: 12px; z-index: 6; display: flex; gap: 4px; align-items: center; flex-wrap: wrap; max-width: 330px; }
  #debugTools input { width: 56px; } #debugTools button { font-size: 11px; padding: 1px 6px; }
  #debug { pointer-events: auto; cursor: help; position: absolute; left: 14px; top: 120px; padding: 6px 10px; font: 12px/1.45 Consolas, monospace; background: rgba(233,223,196,.92);
    border: 1px solid var(--ink); z-index: 6; white-space: pre; }

  /* 3D labels (CSS2DRenderer) */
  .nodeLabel { pointer-events: auto; cursor: pointer; font-size: 14px; color: var(--ink); background: rgba(233,223,196,.88);
    border: 1px solid var(--ink); padding: 0 6px; white-space: nowrap; transform: translateY(-14px); }
  .nodeLabel.village { font-size: 12px; padding: 0 4px; }
  .nodeLabel.unknown { color: #555; background: rgba(200,200,200,.7); }
  .nodeLabel.selected { outline: 2px solid var(--gold); }
  .nodeLabel[data-danger="low"] { border-left: 5px solid #4a9a3a; } .nodeLabel[data-danger="mid"] { border-left: 5px solid #d0a020; } .nodeLabel[data-danger="high"] { border-left: 5px solid #c0302a; }
  .recruitBtns { display: flex; flex-wrap: wrap; gap: 3px; align-items: center; justify-content: flex-end; max-width: 210px; }
  .recruitBtns button { padding: 2px 7px; } .recruitBtns input { width: 48px; } .recruitBtns .nowrap { white-space: nowrap; }
  .resIcon { vertical-align: -3px; margin-right: 2px; }
  .loot .cost { font-size: 16px; margin-right: 12px; } .loot .resIcon { width: 20px; height: 20px; }
  .losses { display: flex; flex-wrap: wrap; gap: 6px 14px; } .lossRow { display: flex; gap: 6px; align-items: center; min-width: 150px; }
  .lossRow .portrait { width: 40px; height: 40px; }
  .cost { white-space: nowrap; margin-right: 4px; } .cost.short { color: #b0302a; font-weight: bold; }
  .upgrades { margin-top: 3px; border-left: 3px solid #c9a227; padding-left: 6px; } .upg { font-size: 12px; margin: 2px 0; } .upg.own { opacity: .75; }
  .upg button { font-size: 11px; padding: 1px 6px; margin-left: 4px; }
  #abilityBar { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 4px; }
  #abilityBar:empty { display: none; }
  #abilityBar button { font-size: 12px; padding: 3px 7px; } #abilityBar button.active { outline: 2px solid #a050e0; background: #e6d6f2; }
  #narrator { position: fixed; left: 50%; bottom: 110px; transform: translateX(-50%); width: min(660px, calc(100vw - 32px)); z-index: 31; padding: 10px 16px;
    display: flex; gap: 12px; align-items: center; background: rgba(30,24,20,.92); color: #efe4c8; border: 1px solid #7a6a4a;
    opacity: 0; pointer-events: none; transition: opacity .6s; } #narrator.on { opacity: 1; pointer-events: auto; cursor: pointer; }

  static computeFloor(q, r, band) {

      const d = Math.hypot(q - hr.q, r - hr.r) / hr.radius;

    for (const e of mix) sum += e[1];

  async build(onProgress) {

    for (let i = 0; i < n; i++) meters[i] = (raw.charCodeAt(2 * i) | (raw.charCodeAt(2 * i + 1) << 8)) * HM.scale + HM.offset;
    const bands = DATA.floorRules.bands;
    const rowsPerChunk = 60;
    for (let r0 = 0; r0 < HEIGHT; r0 += rowsPerChunk) {

    const q0 = Math.min(WIDTH - 2, Math.floor(fq)), r0 = Math.min(HEIGHT - 2, Math.floor(fr)), a = fq - q0, b = fr - r0;

  groundAt(x, z) {

    return Math.max(this.surfaceAt(x, z), HEX.waterLevel);

  heightAt(q, r) { return inMap(q, r) ? this.height[r * WIDTH + q] : HEX.waterLevel; }
  metersAt(q, r) { return inMap(q, r) ? this.meters[r * WIDTH + q] : -60; }
  levelAt(q, r) { return Math.round(this.heightAt(q, r)); }
  floorKeyAt(q, r) { return inMap(q, r) ? FLOOR_KEYS[this.floor[r * WIDTH + q]] : 'DEEP_WATER'; }
}

// =============================================================================
// TileRenderer
// One InstancedMesh per floor type, all sharing one hex prism geometry. Only a
// window of (2*radius+1)^2 tiles around the camera pivot is filled. A slot table
// maps (mesh, instanceId) back to the tile index for picking.
// =============================================================================
class TileRenderer {
  constructor(scene, world) {
    this.world = world;
    this.radius = DATA.streaming.radius;
    this.capacity = (2 * this.radius + 1) ** 2;
    this.center = [-9999, -9999];
    this.locked = false;          // battle: window fixed on the node
    this.floorOverride = null;    // battle: function (q, r) -> floor index or -1
    this.dimOutside = null;       // battle: function (q, r) -> true when tile is outside the field
    this.drawn = 0;
    const geo = new THREE.CylinderGeometry(R * 0.98, R * 0.98, HEX.tileDepth, 6);
    geo.rotateY(Math.PI / 6);     // corners on +-X (flat-top)
    this.meshes = [];
    this.slots = [];
    const white = new THREE.Color(1, 1, 1);
    FLOOR_KEYS.forEach((key, fi) => {
      const mat = new THREE.MeshStandardMaterial({ color: DATA.floorTypes[key].color, roughness: 0.95, metalness: 0, flatShading: true });
      const mesh = new THREE.InstancedMesh(geo, mat, this.capacity);
      mesh.setColorAt(0, white);                     // allocates instanceColor
      mesh.count = 0;
      mesh.frustumCulled = false;                    // the window is always around the camera
      mesh.userData.floorIndex = fi;
      scene.add(mesh);
      this.meshes.push(mesh);
      this.slots.push(new Int32Array(this.capacity));
    });
  }
  // Called each frame with the pivot tile; rebuilds when it changed.
  update(q, r, force = false) {
    if (this.locked && !force) return;
    if (!force && q === this.center[0] && r === this.center[1]) return;
    this.center = [q, r];
    this.rebuild();
  }
  rebuild() {
    const [cq, cr] = this.center, rad = this.radius, world = this.world;
    const counts = new Int32Array(this.meshes.length);
    let drawn = 0;
    for (let r = cr - rad; r <= cr + rad; r++) {
      if (r < 0 || r >= HEIGHT) continue;            // never draw outside the map
      for (let q = cq - rad; q <= cq + rad; q++) {
        if (q < 0 || q >= WIDTH) continue;
        const ti = r * WIDTH + q;
        let fi = world.floor[ti];
        if (this.floorOverride) { const o = this.floorOverride(q, r); if (o >= 0) fi = o; }
        const mesh = this.meshes[fi], slot = counts[fi]++;
        this.slots[fi][slot] = ti;
        // Matrix = translation * rotationY(k * 60deg), written directly (column-major).
        let hy = world.height[ti];
        if (this.heightOverride) { const o = this.heightOverride(q, r); if (o !== null) hy = o; }
        const p = hexToWorld(q, r), y = hy - HEX.tileDepth / 2;
        const a = Math.floor(hash2(q, r, 2) * 6) * Math.PI / 3, c = Math.cos(a), s = Math.sin(a);
        const m = mesh.instanceMatrix.array, o = slot * 16;
        m[o] = c;  m[o+1] = 0; m[o+2] = -s; m[o+3] = 0;
        m[o+4] = 0; m[o+5] = 1; m[o+6] = 0; m[o+7] = 0;
        m[o+8] = s; m[o+9] = 0; m[o+10] = c; m[o+11] = 0;
        m[o+12] = p.x; m[o+13] = y; m[o+14] = p.z; m[o+15] = 1;
        // +-6 % brightness variation per tile, 50 % outside a battlefield.
        let b = 1 + (hash2(q, r, 3) * 2 - 1) * 0.06;
        if (this.dimOutside && this.dimOutside(q, r)) b *= 0.5;
        const col = mesh.instanceColor.array, oc = slot * 3;
        col[oc] = b; col[oc+1] = b; col[oc+2] = b;
        drawn++;
      }
    }
    this.meshes.forEach((mesh, fi) => {
      mesh.count = counts[fi];
      mesh.instanceMatrix.needsUpdate = true;
      mesh.instanceColor.needsUpdate = true;
      mesh.boundingSphere = null;                    // recomputed lazily for raycasting
    });
    this.drawn = drawn;
  }
  // Raycast against the tile meshes. Returns { q, r, point } or null.
  pick(raycaster) {
    const hits = raycaster.intersectObjects(this.meshes.filter(m => m.count > 0), false);
    if (!hits.length) return null;
    const h = hits[0], fi = h.object.userData.floorIndex;
    const ti = this.slots[fi][h.instanceId];
    return { q: ti % WIDTH, r: Math.floor(ti / WIDTH), point: h.point };
  }
}

// =============================================================================
// Blight (world map): the land around the barrow and around every conquered place dies.
// One byte per tile (0 = alive, 255 = dead). Each source grows with the days since its
// conquest; the barrow also grows with every conquered place. The terrain shader turns
// the ground into dry, grey earth, black bog and faint unholy veins; the vegetation
// turns grey, dies and finally falls over.
// =============================================================================
const BLIGHT = {
  barrow: { r0: 8, perPlace: 1.6, perDay: 0.12, max: 70, oldDays: 15 },   // oldDays: the barrow's own land is dead for ages
  place: { r0: 2, perDay: 0.35, maxBase: 4, maxPerSqrtSize: 2.6 },   // max radius = maxBase + sqrt(size) * maxPerSqrtSize
  barrowRate: 0.3,         // tiles per day used to estimate how long the barrow's land is dead already
  instantDays: 8,          // a conquered place starts as if dead for this many days already (the battle)
  fullDays: 30             // days after the front passed until a tile is fully dead (trees fall from about day 17)
};
const Blight = {
  data: null, tex: null, overlay: null, sig: '', version: 0,
  init() {
    if (this.data) return;
    this.data = new Uint8Array(WIDTH * HEIGHT);
    this.tex = new THREE.DataTexture(this.data, WIDTH, HEIGHT, THREE.RedFormat, THREE.UnsignedByteType);
    this.tex.magFilter = this.tex.minFilter = THREE.LinearFilter; this.tex.needsUpdate = true;
    const K = 4; this.overlay = document.createElement('canvas');
    this.overlay.width = Math.ceil(WIDTH / K); this.overlay.height = Math.ceil(HEIGHT / K);
  },
  at(q, r) { return this.data ? this.data[r * WIDTH + q] / 255 : 0; },
  sources() {
    const c = game.campaign, out = [];
    if (!c) return out;
    c.conqueredDay = c.conqueredDay || {};
    const owned = DATA.nodes.filter(n => Campaign.isConquered(n));
    for (const n of owned) if (c.conqueredDay[n.id] === undefined) c.conqueredDay[n.id] = 0;   // older saves
    const B = BLIGHT.barrow, P = BLIGHT.place;
    // R: current radius; rate: tiles per day the front moved; extra: days since the front stopped.
    out.push({ q: PHYLACTERY.q, r: PHYLACTERY.r, R: Math.min(B.max, B.r0 + B.perPlace * owned.length + B.perDay * c.dayCount), rate: BLIGHT.barrowRate, extra: B.oldDays });
    for (const n of owned) {
      const days = Math.max(0, c.dayCount - c.conqueredDay[n.id]);
      const max = P.maxBase + Math.sqrt(n.size || 4) * P.maxPerSqrtSize, R = Math.min(max, P.r0 + P.perDay * days);
      out.push({ q: n.q, r: n.r, R, rate: P.perDay, extra: BLIGHT.instantDays + Math.max(0, days - (max - P.r0) / P.perDay) });
    }
    return out;
  },
  // Recomputes when the day or the set of conquered places changed. Returns true on change.
  refresh() {
    const c = game.campaign; if (!c) return false;
    this.init();
    const src = this.sources(), sig = src.map(s => `${s.q},${s.r},${s.R.toFixed(1)}`).join(';');
    if (sig === this.sig) return false;
    this.sig = sig; this.version++;
    const d = this.data; d.fill(0);
    const ry = ROW_SPACING / COL_SPACING;                    // rows are a bit taller than columns
    for (const { q, r, R, rate, extra } of src) {
      const Rr = Math.ceil(R / ry) + 1;
      for (let y = Math.max(0, r - Rr); y <= Math.min(HEIGHT - 1, r + Rr); y++) {
        const dy = (y - r) * ry;
        for (let x = Math.max(0, Math.floor(q - R - 1)); x <= Math.min(WIDTH - 1, Math.ceil(q + R + 1)); x++) {
          const dist = Math.hypot(x - q, dy);
          if (dist >= R) continue;
          // Age of the blight on this tile in days -> 0..1 (the front itself is young and faint).
          const age = (R - dist) / rate + extra;
          const v = Math.round(255 * smoothstep01(Math.min(1, age / BLIGHT.fullDays)));
          const i = y * WIDTH + x; if (v > d[i]) d[i] = v;
        }
      }
    }
    this.tex.needsUpdate = true;
    // Minimap overlay at 1/4 resolution.
    const ov = this.overlay, ctx = ov.getContext('2d'), img = ctx.createImageData(ov.width, ov.height);
    for (let my = 0; my < ov.height; my++) for (let mx = 0; mx < ov.width; mx++) {
      const v = d[Math.min(HEIGHT - 1, my * 4 + 2) * WIDTH + Math.min(WIDTH - 1, mx * 4 + 2)];
      if (!v) continue;
      const o = (my * ov.width + mx) * 4; img.data[o] = 58; img.data[o + 1] = 52; img.data[o + 2] = 50; img.data[o + 3] = v * 0.8;
    }
    ctx.putImageData(img, 0, 0);
    return true;
  }
};

// =============================================================================
// TerrainRenderer (world map)
// Continuous landscape instead of hex prisms: one vertex per heightmap point in a
// window that follows the camera. Heights and floor types are read in the shaders
// from data textures; the fragment shader blends the ground textures of the 3x3
// neighbouring points with soft radial weights, so floor types fade into each other.
// Battles still use the hex TileRenderer.
// =============================================================================
const TERRAIN_HALF = 160;          // window = (2 * TERRAIN_HALF + 1)^2 vertices around the camera
const TERRAIN_UV_SCALE = 1 / 36;   // texture repeats every 36 world units (about 8 points)

// tinted towards the floor color so every floor type keeps its own look.
const GROUND_TEXTURE_FOR = {
  DEEP_WATER: 'Sand', SHALLOW_WATER: 'Mud', WATT: 'WetEarth', SAND: 'Sand', WET_EARTH: 'WetEarth', MUD: 'Mud', BOG: 'Bog', SWAMP: 'Swamp',
  GRASS_SHORT: 'GrassShort', GRASS_TALL: 'GrassTall', HEATHER: 'Heather', DRY_EARTH: 'DryEarth', GRAVEL: 'RawStone',
  RAW_STONE: 'RawStone', COBBLESTONE: 'RawStone', STONE_FLOOR: 'RawStone', WOOD_FLOOR: 'DryEarth',
  HOLY_GROUND: 'Sand', GRAVEYARD_GROUND: 'WetEarth', PAGAN_GROUND: 'Heather'

const NATIVE_TEXTURE = new Set(['SAND', 'WET_EARTH', 'MUD', 'BOG', 'SWAMP', 'GRASS_SHORT', 'GRASS_TALL', 'HEATHER', 'DRY_EARTH', 'RAW_STONE']);

// World position of heightmap point (q, r). Odd hex columns are shifted by half a row;
// the landscape uses the mean offset so the mesh stays a regular grid.
const terrainX = q => q * COL_SPACING;
const terrainZ = r => r * ROW_SPACING + INRADIUS / 2;

class TerrainRenderer {
  // Decodes the embedded textures (data URIs, readable under file://) into one texture array.
  static async loadTextures() {
    const G = window.HARMBRINGER_GROUND, S = G.size, n = G.textures.length;
    const data = new Uint8Array(S * S * 4 * n), avg = [];
    const canvas = document.createElement('canvas'); canvas.width = canvas.height = S;
    const ctx = canvas.getContext('2d', { willReadFrequently: true });

      const img = new Image(); img.src = G.textures[i].src; await img.decode();
      ctx.drawImage(img, 0, 0, S, S);

      data.set(px, i * S * S * 4);
      let r = 0, g = 0, b = 0;
      for (let k = 0; k < px.length; k += 4) { r += px[k]; g += px[k + 1]; b += px[k + 2]; }

  }

    const hTex = new THREE.DataTexture(world.smooth, WIDTH, HEIGHT, THREE.RedFormat, THREE.FloatType);
    hTex.magFilter = hTex.minFilter = THREE.NearestFilter; hTex.needsUpdate = true;
    const fTex = new THREE.DataTexture(world.floor, WIDTH, HEIGHT, THREE.RedFormat, THREE.UnsignedByteType);
    fTex.magFilter = fTex.minFilter = THREE.NearestFilter; fTex.needsUpdate = true;

      const li = ground.names.indexOf(GROUND_TEXTURE_FOR[key] || 'GrassShort');
      layer.push(li);
      if (NATIVE_TEXTURE.has(key)) { tint.push(new THREE.Vector3(1, 1, 1)); return; }
      const fc = new THREE.Color(DATA.floorTypes[key].color), a = ground.avg[li];   // fc is linear already

      layer: { value: layer }, tint: { value: tint },
      center: { value: new THREE.Vector2() }, mapSize: { value: new THREE.Vector2(WIDTH, HEIGHT) },
      spacing: { value: new THREE.Vector3(COL_SPACING, ROW_SPACING, INRADIUS / 2) },
      uvScale: { value: TERRAIN_UV_SCALE },
      sunDir: { value: new THREE.Vector3(0, 1, 0) }, sunColor: { value: new THREE.Color(0xffe2b8).multiplyScalar(1.9) },
      skyColor: { value: new THREE.Color(0xe8dcc0).multiplyScalar(1.1) }, groundColor: { value: new THREE.Color(0x3a3328).multiplyScalar(1.1) },

      fragmentShader: `
        precision highp sampler2DArray;

        uniform int layer[${FLOOR_KEYS.length}]; uniform vec3 tint[${FLOOR_KEYS.length}];
        uniform vec2 mapSize; uniform float uvScale;
        uniform vec3 sunDir, sunColor, skyColor, groundColor, fogColor; uniform float fogDensity;

          float bl = texture(bTex, (vTile + 0.5) / mapSize).r;
          float glow = 0.0;
          if (bl > 0.0) {
            float edge = bl + (vnoise(vTile * 0.18) - 0.5) * 0.45 + (vnoise(vTile * 0.9 + 3.1) - 0.5) * 0.12;
            float e = smoothstep(0.18, 0.5, edge);
            vec3 dry = pow(texture(groundTex, vec3(uv, float(deadLayer[0]))).rgb, vec3(2.2));
            vec3 bog = pow(texture(groundTex, vec3(uv * 1.3, float(deadLayer[1]))).rgb, vec3(2.2));
            vec3 mud = pow(texture(groundTex, vec3(uv * 0.8, float(deadLayer[2]))).rgb, vec3(2.2));
            float nb = vnoise(vTile * 0.07 + 40.0) * 0.7 + vnoise(vTile * 0.3 + 9.0) * 0.3;
            vec3 dead = mix(dry * vec3(0.75, 0.72, 0.7), mud * 0.7, smoothstep(0.4, 0.55, nb));
            dead = mix(dead, bog * vec3(0.32, 0.36, 0.3), smoothstep(0.6, 0.7, nb));
            float lum = dot(dead, vec3(0.3, 0.55, 0.15));
            dead = mix(vec3(lum), dead, 0.35);
            // The old ground shows through a little at the front.
            col = mix(col, dead, e * mix(0.75, 1.0, smoothstep(0.5, 0.9, bl)));
            float vein = 1.0 - abs(vnoise(vTile * 0.45 + 70.0) * 2.0 - 1.0);
            glow = smoothstep(0.9, 0.98, vein) * smoothstep(0.65, 0.95, edge);
          }
          vec3 nrm = normalize(vNormal);
          vec3 light = sunColor * max(dot(nrm, sunDir), 0.0) + mix(groundColor, skyColor, nrm.y * 0.5 + 0.5);
          col *= light;
          col += glow * vec3(0.05, 0.16, 0.04);
          // Outside the heightmap: fade to the background.
          vec2 out2 = max(-vTile, vTile - (mapSize - 1.0));
          col = mix(col, fogColor, clamp(max(out2.x, out2.y) / 8.0, 0.0, 1.0));
          float fog = 1.0 - exp(-fogDensity * fogDensity * vDepth * vDepth);
          gl_FragColor = vec4(mix(col, fogColor, fog), 1.0);
          #include <colorspace_fragment>
        }`
    });
    this.mesh = new THREE.Mesh(geo, mat);
    this.mesh.frustumCulled = false;
    scene.add(this.mesh);
  }
  set visible(on) { this.mesh.visible = on; }
  get visible() { return this.mesh.visible; }
  // Moves the window to the camera pivot (integer steps, so vertices never swim).
  update(pivot, sun, fog) {
    const q = Math.round(pivot.x / COL_SPACING), r = Math.round((pivot.z - INRADIUS / 2) / ROW_SPACING);
    this.uniforms.center.value.set(q, r);
    this.uniforms.sunDir.value.copy(sun.position).sub(sun.target.position).normalize();
    this.uniforms.fogDensity.value = fog.density;
  }
  // Ray march against the surface (CPU). Returns { q, r, point } of the hex tile below the hit.
  pick(raycaster) {
    const ray = raycaster.ray, o = ray.origin, d = ray.direction, w = this.world;
    const above = t => o.y + d.y * t - Math.max(w.surfaceAt(o.x + d.x * t, o.z + d.z * t), HEX.waterLevel);
    let t0 = 0, t1 = 0;
    const step = 1.5;
    for (let t = step; t < 4000; t += step) { if (above(t) < 0) { t0 = t - step; t1 = t; break; } }
    if (!t1) return null;
    for (let i = 0; i < 12; i++) { const m = (t0 + t1) / 2; if (above(m) > 0) t0 = m; else t1 = m; }
    const point = new THREE.Vector3(o.x + d.x * t1, o.y + d.y * t1, o.z + d.z * t1);
    const [q, r] = worldToHex(point.x, point.z);
    return inMap(q, r) ? { q, r, point } : null;
  }
}

// =============================================================================
// VegetationRenderer (world map)
// Simple low-poly objects (trees, bushes, rocks, grass, reeds) placed by floor type
// around the camera. One InstancedMesh per object kind. Placement is deterministic per
// tile; a few percent of the tiles borrow the floor type of a neighbour so objects also
// appear slightly outside their areas (natural, ragged edges).
// =============================================================================
// Blighted replacement per kind (see Blight); trees may also fall over ('log').
const DEAD_KIND = { pine: 'snag', leaf: 'snag', birch: 'snag', juniper: 'snag', bush: 'deadbush', heath: 'deadheath', grass: 'deadgrass', reed: 'deadgrass' };
const VEG_SPILL = 0.06;            // share of tiles that use a neighbour's floor type
const VEG_SPILL_RADIUS = 2;        // tiles
// Objects per tile (expected value) by floor type. Fractions are rolled per tile.
const VEG_RULES = {
  GRASS_TALL:   { pine: 0.9, leaf: 0.7, bush: 0.2 },
  HEATHER:      { heath: 0.6, juniper: 0.3, birch: 0.1, grass: 0.1 },
  BOG:          { reed: 0.7, birch: 0.08, pine: 0.05 },
  SWAMP:        { reed: 0.6, leaf: 0.2, bush: 0.15 },
  GRASS_SHORT:  { grass: 0.6, leaf: 0.05, bush: 0.07 },
  WET_EARTH:    { grass: 0.4, bush: 0.08, reed: 0.1 },
  MUD:          { reed: 0.25 },
  SAND:         { grass: 0.15 },
  DRY_EARTH:    { bush: 0.03, grass: 0.08 },
  GRAVEL:       { rock: 0.3, pine: 0.25, grass: 0.1 },
  RAW_STONE:    { rock: 0.6, pine: 0.3 },
  PAGAN_GROUND: { rock: 0.2, juniper: 0.2, heath: 0.2 },
  GRAVEYARD_GROUND: { bush: 0.1 }
};

// Merges [geometry, color] parts into one non-indexed geometry with vertex colors.
function mergeColored(parts) {
  const pos = [], col = [];
  for (const [g0, hex] of parts) {
    const g = g0.index ? g0.toNonIndexed() : g0, p = g.attributes.position.array, c = new THREE.Color(hex);
    for (let i = 0; i < p.length; i += 3) { pos.push(p[i], p[i + 1], p[i + 2]); col.push(c.r, c.g, c.b); }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.computeVertexNormals();
  return g;
}

class VegetationRenderer {
  constructor(scene, world) {
    this.world = world;
    this.center = [-9999, -9999];
    this.radius = 0;
    const T = (geo, x, y, z) => geo.translate(x, y, z);
    // Shapes are oversized on purpose: a few trees stand for a whole wood (one tile is ~250 m).
    const kinds = {
      pine:    mergeColored([[T(new THREE.CylinderGeometry(0.12, 0.16, 0.8, 5), 0, 0.4, 0), '#4a3524'],
                             [T(new THREE.ConeGeometry(0.9, 1.6, 7), 0, 1.4, 0), '#2f4a2c'], [T(new THREE.ConeGeometry(0.7, 1.3, 7), 0, 2.2, 0), '#34522f']]),
      leaf:    mergeColored([[T(new THREE.CylinderGeometry(0.14, 0.2, 1.0, 5), 0, 0.5, 0), '#4f3a26'],
                             [T(new THREE.IcosahedronGeometry(1.0, 0), 0, 1.7, 0), '#4d6b2e'], [T(new THREE.IcosahedronGeometry(0.7, 0), 0.45, 1.4, 0.2), '#56752f']]),
      birch:   mergeColored([[T(new THREE.CylinderGeometry(0.07, 0.1, 1.4, 5), 0, 0.7, 0), '#d9d4c6'],
                             [T(new THREE.IcosahedronGeometry(0.6, 0), 0, 1.7, 0), '#7f9a3e']]),
      juniper: mergeColored([[T(new THREE.ConeGeometry(0.35, 1.5, 6), 0, 0.75, 0), '#33472d']]),
      bush:    mergeColored([[T(new THREE.IcosahedronGeometry(0.55, 0).scale(1, 0.7, 1), 0, 0.3, 0), '#4f6532']]),
      // Heather tufts: low, matte mauve (Calluna in bloom).
      heath:   mergeColored([[T(new THREE.IcosahedronGeometry(0.5, 0).scale(1.2, 0.55, 1), 0, 0.22, 0), '#8a6478'],
                             [T(new THREE.IcosahedronGeometry(0.32, 0).scale(1.1, 0.6, 1), 0.38, 0.15, 0.15), '#7d5a6e']]),
      rock:    mergeColored([[T(new THREE.DodecahedronGeometry(0.6, 0).scale(1.2, 0.7, 1), 0, 0.2, 0), '#837d72']]),
      grass:   mergeColored([[T(new THREE.ConeGeometry(0.05, 0.5, 3), 0, 0.25, 0), '#7d8b47'], [T(new THREE.ConeGeometry(0.05, 0.42, 3).rotateZ(0.35), 0.12, 0.2, 0), '#879450'],
                             [T(new THREE.ConeGeometry(0.05, 0.45, 3).rotateX(-0.3), -0.05, 0.2, 0.12), '#76853f']]),
      reed:    mergeColored([[T(new THREE.CylinderGeometry(0.03, 0.03, 0.9, 3), 0, 0.45, 0), '#8a8a4a'], [T(new THREE.CylinderGeometry(0.03, 0.03, 0.75, 3).rotateZ(0.2), 0.1, 0.37, 0), '#7a7d42'],
                             [T(new THREE.CylinderGeometry(0.06, 0.06, 0.2, 4), 0, 0.95, 0), '#5a4028']]),
      // Blighted land: grey snags, fallen trunks, dead shrubs and grass, a few crooked grave stones.
      snag:    mergeColored([[T(new THREE.CylinderGeometry(0.08, 0.17, 2.3, 5), 0, 1.15, 0), '#77726b'],
                             [T(new THREE.CylinderGeometry(0.03, 0.06, 0.9, 4).rotateZ(0.9), 0.35, 1.6, 0), '#6d6862'],
                             [T(new THREE.CylinderGeometry(0.03, 0.05, 0.7, 4).rotateZ(-1.0), -0.3, 1.9, 0.05), '#6d6862'],
                             [T(new THREE.CylinderGeometry(0.02, 0.04, 0.6, 4).rotateX(0.9), 0, 1.3, -0.25), '#7d7871']]),
      log:     mergeColored([[T(new THREE.CylinderGeometry(0.13, 0.17, 2.2, 6).rotateZ(Math.PI / 2), 0.2, 0.15, 0), '#6f6a63'],
                             [T(new THREE.CylinderGeometry(0.05, 0.04, 0.6, 4).rotateZ(0.5), 0.6, 0.35, 0.05), '#66615b'],
                             [T(new THREE.DodecahedronGeometry(0.35, 0).scale(0.4, 1, 1), -0.95, 0.25, 0), '#5a544d'],
                             [T(new THREE.CylinderGeometry(0.15, 0.2, 0.3, 6), -1.1, 0.15, 0.6), '#77726b']]),
      deadbush: mergeColored([[T(new THREE.IcosahedronGeometry(0.5, 0).scale(1, 0.6, 1), 0, 0.25, 0), '#6a6158']]),
      deadheath: mergeColored([[T(new THREE.IcosahedronGeometry(0.5, 0).scale(1.2, 0.5, 1), 0, 0.2, 0), '#5e5552'],
                               [T(new THREE.IcosahedronGeometry(0.3, 0).scale(1.1, 0.5, 1), 0.38, 0.13, 0.15), '#544c4a']]),
      deadgrass: mergeColored([[T(new THREE.ConeGeometry(0.05, 0.4, 3).rotateZ(0.5), 0.05, 0.15, 0), '#8a8270'], [T(new THREE.ConeGeometry(0.05, 0.35, 3).rotateX(-0.7), -0.05, 0.12, 0.1), '#7d7563']]),
      gravestone: mergeColored([[T(new THREE.BoxGeometry(0.45, 0.7, 0.12).rotateZ(0.15), 0, 0.3, 0), '#5c5a5e'],
                                [T(new THREE.BoxGeometry(0.4, 0.55, 0.12).rotateZ(-0.25), 0.7, 0.22, 0.3), '#545256']])
    };
    // Size factor per kind (world units are ~55 m; figures stay readable from the default zoom).
    this.size = { pine: 2.2, leaf: 2.2, birch: 2.0, juniper: 1.6, bush: 1.4, heath: 1.5, rock: 1.6, grass: 2.2, reed: 2.0,
                  snag: 2.0, log: 2.0, deadbush: 1.4, deadheath: 1.5, deadgrass: 2.2, gravestone: 1.6 };
    const mat = new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.9 });
    this.capacity = 24000;
    this.meshes = {};
    for (const [k, geo] of Object.entries(kinds)) {
      const m = new THREE.InstancedMesh(geo, mat, this.capacity);
      m.count = 0; m.frustumCulled = false;
      m.setColorAt(0, new THREE.Color(1, 1, 1));
      scene.add(m);
      this.meshes[k] = m;
    }
    // Floor index -> rule entries [[kind, density], ...]
    this.rules = FLOOR_KEYS.map(k => Object.entries(VEG_RULES[k] || {}));
    // No vegetation right on the places.
    this.blocked = new Set();
    for (const n of DATA.nodes) for (let dq = -2; dq <= 2; dq++) for (let dr = -2; dr <= 2; dr++) this.blocked.add((n.r + dr) * WIDTH + n.q + dq);
  }
  set visible(on) { for (const m of Object.values(this.meshes)) m.visible = on; }
  // Rebuilds when the camera moved a few tiles or the zoom changed the radius noticeably.
  update(pivot, distance) {
    const q = Math.round(pivot.x / COL_SPACING), r = Math.round((pivot.z - INRADIUS / 2) / ROW_SPACING);
    const radius = Math.round(Math.min(70, Math.max(30, distance * 0.55)));
    if (Math.abs(q - this.center[0]) < 4 && Math.abs(r - this.center[1]) < 4 && Math.abs(radius - this.radius) < 8) return;
    this.center = [q, r]; this.radius = radius;
    this.rebuild();
  }
  // One object of `kind` on tile (q, r), randomized by `seed`.
  place(kind, q, r, seed, counts, m4, quat, pos, scl, up, col) {
    if (counts[kind] >= this.capacity) return;
    const w = this.world;
    const x = (q + (hash2(q, r, seed) - 0.5) * 1.1) * COL_SPACING;
    const z = (r + (hash2(q, r, seed + 1) - 0.5) * 1.1) * ROW_SPACING + INRADIUS / 2;
    const y = w.surfaceAt(x, z);
    if (y < HEX.waterLevel + 0.15) return;              // nothing in the water
    const s = this.size[kind] * (0.75 + hash2(q, r, seed + 2) * 0.5);
    quat.setFromAxisAngle(up, hash2(q, r, seed + 3) * Math.PI * 2);
    m4.compose(pos.set(x, y - 0.05 * s, z), quat, scl.set(s, s * (0.85 + hash2(q, r, seed + 2) * 0.3), s));
    const mesh = this.meshes[kind], k = counts[kind]++;
    mesh.setMatrixAt(k, m4);
    const b = 0.85 + hash2(q, r, seed + 5) * 0.3;
    mesh.setColorAt(k, col.setRGB(b, b * (0.95 + hash2(q, r, seed + 6) * 0.1), b));
  }
  rebuild() {
    const [cq, cr] = this.center, rad = this.radius, w = this.world;
    const counts = {}; for (const k in this.meshes) counts[k] = 0;
    const m4 = new THREE.Matrix4(), quat = new THREE.Quaternion(), pos = new THREE.Vector3(), scl = new THREE.Vector3(), up = new THREE.Vector3(0, 1, 0), col = new THREE.Color();
    for (let r = Math.max(0, cr - rad); r <= Math.min(HEIGHT - 1, cr + rad); r++) {
      for (let q = Math.max(0, cq - rad); q <= Math.min(WIDTH - 1, cq + rad); q++) {
        const dq = q - cq, dr = r - cr;
        if (dq * dq + dr * dr > rad * rad) continue;
        const ti = r * WIDTH + q;
        if (this.blocked.has(ti)) continue;
        // Spill: a few tiles take the floor type of a nearby tile.
        let fi = w.floor[ti];
        if (hash2(q, r, 11) < VEG_SPILL) {
          const nq = q + Math.round((hash2(q, r, 12) * 2 - 1) * VEG_SPILL_RADIUS), nr = r + Math.round((hash2(q, r, 13) * 2 - 1) * VEG_SPILL_RADIUS);
          if (inMap(nq, nr)) fi = w.floor[nr * WIDTH + nq];
        }
        let seed = 20;
        const bl = Blight.at(q, r);
        if (bl > 0.85 && hash2(q, r, 90) < (bl - 0.85) * 0.25) this.place('gravestone', q, r, 91, counts, m4, quat, pos, scl, up, col);
        for (const [kind, density] of this.rules[fi]) {
          // Expected `density` objects: integer part always, fractional part by chance.
          let n = Math.floor(density) + (hash2(q, r, seed++) < density % 1 ? 1 : 0);
          for (let i = 0; i < n; i++, seed += 4) {
            // Blight: grey and dead first, fallen later. The front is ragged per object.
            let k0 = kind;
            if (bl > 0 && bl > 0.12 + hash2(q, r, seed + 7) * 0.6) {
              k0 = DEAD_KIND[kind] || kind;
              if (k0 === 'snag' && hash2(q, r, seed + 8) < (bl - 0.55) * 1.6) k0 = 'log';
              if (k0 === 'deadgrass' && bl > 0.8 && hash2(q, r, seed + 9) < 0.5) continue;
            }
            const kind2 = k0;
            if (counts[kind2] >= this.capacity) break;
            this.place(kind2, q, r, seed, counts, m4, quat, pos, scl, up, col);
          }
        }
      }
    }
    for (const [k, m] of Object.entries(this.meshes)) {
      m.count = counts[k];
      m.instanceMatrix.needsUpdate = true;
      if (m.instanceColor) m.instanceColor.needsUpdate = true;
    }
    this.drawn = Object.values(counts).reduce((a, b) => a + b, 0);
  }
}

// Procedural normal map for the water plane (generated in JS, no image reading).
function makeWaterNormalMap() {
  const N = 128, data = new Uint8Array(N * N * 4);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const u = x / N * Math.PI * 2, v = y / N * Math.PI * 2;
    const dx = 0.35 * Math.cos(u * 3 + v) + 0.2 * Math.cos(u * 7 - v * 2) + 0.1 * Math.cos(u * 2 + v * 5);
    const dz = 0.35 * Math.cos(v * 3 - u) + 0.2 * Math.cos(v * 6 + u * 2) + 0.1 * Math.cos(v * 2 - u * 4);
    const len = Math.hypot(dx, 1, dz), i = (y * N + x) * 4;
    data[i] = (dx / len * 0.5 + 0.5) * 255; data[i+1] = (dz / len * 0.5 + 0.5) * 255; data[i+2] = (1 / len * 0.5 + 0.5) * 255; data[i+3] = 255;
  }
  const tex = new THREE.DataTexture(data, N, N, THREE.RGBAFormat);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.needsUpdate = true;
  return tex;
}

// =============================================================================
// CameraController
// Orbit camera around an invisible pivot on the terrain. WASD/arrows move the
// pivot relative to the view direction, Q/E and RMB rotate, the wheel zooms.
// =============================================================================
class CameraController {
  constructor(camera) {
    this.camera = camera;
    this.pivot = new THREE.Vector3();
    this.yaw = 0;                              // 0 = camera south of the pivot, looking north
    this.distance = CAM.startZoom;
    this.pitch = CAM.pitchDegrees * Math.PI / 180;
    this.bounds = null;                        // {minX, maxX, minZ, maxZ}
    this.follow = null;                        // optional THREE.Object3D to follow (travel)
    this.setMapBounds();
  }
  setMapBounds() {
    this.bounds = { minX: 0, maxX: (WIDTH - 1) * COL_SPACING, minZ: 0, maxZ: (HEIGHT - 1) * ROW_SPACING + INRADIUS };
  }
  setFieldBounds(q0, r0, size) {
    const a = hexToWorld(q0, r0), b = hexToWorld(q0 + size - 1, r0 + size - 1);
    this.bounds = { minX: a.x, maxX: b.x, minZ: a.z, maxZ: b.z + INRADIUS };
  }
  lookAtTile(q, r, snap = true) {
    const p = hexToWorld(q, r);
    this.pivot.x = p.x; this.pivot.z = p.z;
    if (snap) this.pivot.y = game.world.groundAt(p.x, p.z);
  }
  pivotTile() { return worldToHex(this.pivot.x, this.pivot.z); }
  update(dt, keys) {
    // Movement relative to the view direction, XZ only.
    let mx = 0, mz = 0;
    if (keys.has('KeyW') || keys.has('ArrowUp')) mz += 1;
    if (keys.has('KeyS') || keys.has('ArrowDown')) mz -= 1;
    if (keys.has('KeyA') || keys.has('ArrowLeft')) mx -= 1;
    if (keys.has('KeyD') || keys.has('ArrowRight')) mx += 1;
    if (keys.has('KeyQ')) this.yaw += CAM.rotateSpeed * dt;
    if (keys.has('KeyE')) this.yaw -= CAM.rotateSpeed * dt;
    if (this.follow) {
      this.pivot.x = this.follow.position.x; this.pivot.z = this.follow.position.z;
    } else if (mx || mz) {
      const speed = CAM.moveSpeed * (this.distance / CAM.minZoom) * dt;
      const fx = -Math.sin(this.yaw), fz = -Math.cos(this.yaw);   // forward
      const rx = Math.cos(this.yaw), rz = -Math.sin(this.yaw);    // right
      const len = Math.hypot(mx, mz);
      this.pivot.x += (fx * mz + rx * mx) / len * speed;
      this.pivot.z += (fz * mz + rz * mx) / len * speed;
    }
    // Keep the pivot inside the map (or the battlefield).
    const b = this.bounds;
    this.pivot.x = Math.min(b.maxX, Math.max(b.minX, this.pivot.x));
    this.pivot.z = Math.min(b.maxZ, Math.max(b.minZ, this.pivot.z));
    // Pivot height follows the terrain, damped; water level is the minimum.
    const targetY = game.world.groundAt(this.pivot.x, this.pivot.z);
    this.pivot.y += (targetY - this.pivot.y) * Math.min(1, CAM.heightSmoothing * dt);
    // Place the camera.
    const h = Math.cos(this.pitch) * this.distance;
    this.camera.position.set(
      this.pivot.x + Math.sin(this.yaw) * h,
      this.pivot.y + Math.sin(this.pitch) * this.distance,
      this.pivot.z + Math.cos(this.yaw) * h);
    // Do not dive into mountains with flat views.
    if (!game.battle) this.camera.position.y = Math.max(this.camera.position.y, game.world.groundAt(this.camera.position.x, this.camera.position.z) + 3);
    this.camera.lookAt(this.pivot);
  }
  zoom(deltaY) {
    this.distance *= Math.exp(deltaY * 0.0012);
    this.distance = Math.min(CAM.maxZoom, Math.max(CAM.minZoom, this.distance));
  }
}

// =============================================================================
// Scene setup (view only)
// =============================================================================
const BG_COLOR = 0x6e675c;   // muted sepia gray, also the fog color
function initScene(ground) {
  const v = game.view;
  const app = document.getElementById('app');
  v.renderer = new THREE.WebGLRenderer({ antialias: true });
  v.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  v.renderer.setSize(window.innerWidth, window.innerHeight);
  v.renderer.setClearColor(BG_COLOR);
  app.appendChild(v.renderer.domElement);
  v.labelRenderer = new CSS2DRenderer({ element: document.getElementById('labels') });
  v.labelRenderer.setSize(window.innerWidth, window.innerHeight);

  v.scene = new THREE.Scene();
  v.scene.background = new THREE.Color(BG_COLOR);
  v.scene.fog = new THREE.FogExp2(BG_COLOR, 0.008);
  v.camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.5, 20000);

  // Warm sun from the south-west plus a hemisphere fill light.
  v.sun = new THREE.DirectionalLight(0xffe2b8, 1.9);
  v.sun.position.set(-60, 90, 60);
  v.scene.add(v.sun, v.sun.target);
  v.hemi = new THREE.HemisphereLight(0xe8dcc0, 0x3a3328, 1.1); v.scene.add(v.hemi);

  // Water plane over the whole map.
  const w = WIDTH * COL_SPACING, h = HEIGHT * ROW_SPACING;
  v.waterNormal = makeWaterNormalMap();
  v.waterNormal.repeat.set(w / 40, h / 40);
  const water = new THREE.Mesh(new THREE.PlaneGeometry(w, h),
    new THREE.MeshStandardMaterial({ color: 0x1d4248, transparent: true, opacity: 0.7, roughness: 0.25, metalness: 0.15,
      normalMap: v.waterNormal, normalScale: new THREE.Vector2(0.6, 0.6) }));
  water.rotation.x = -Math.PI / 2;
  water.position.set(w / 2 - COL_SPACING / 2, HEX.waterLevel, h / 2 - ROW_SPACING / 2);
  v.scene.add(water);
  v.water = water;

  v.tiles = new TileRenderer(v.scene, game.world);
  v.terrain = new TerrainRenderer(v.scene, game.world, ground);
  v.vegetation = new VegetationRenderer(v.scene, game.world);
  v.cam = new CameraController(v.camera);
  v.raycaster = new THREE.Raycaster();
  v.worldRoot = new THREE.Group();      // node pillars and army figure
  v.battleRoot = new THREE.Group();     // battle-only objects
  v.scene.add(v.worldRoot, v.battleRoot);

  window.addEventListener('resize', () => {
    v.camera.aspect = window.innerWidth / window.innerHeight;
    v.camera.updateProjectionMatrix();
    if (typeof UI !== 'undefined' && UI.layoutInfo) UI.layoutInfo();
    v.renderer.setSize(window.innerWidth, window.innerHeight);
    v.labelRenderer.setSize(window.innerWidth, window.innerHeight);
  });
}

// Simple tween system: every animation is a promise resolved by the render loop.
const tweens = [];
function tween(duration, fn, fast = false) {
  return new Promise(resolve => tweens.push({ t: 0, duration, fn, resolve, fast }));
}
function updateTweens(dt) {
  for (let i = tweens.length - 1; i >= 0; i--) {
    const tw = tweens[i];
    tw.t += dt * (tw.fast && game.hurry ? 4 : 1);
    const k = Math.min(1, tw.t / tw.duration);
    tw.fn(k);
    if (k >= 1) { tweens.splice(i, 1); tw.resolve(); }
  }
}
const wait = s => tween(s, () => {});

// =============================================================================
// Campaign
// World-map state: places, travel, time, threat, resources. Pure data plus a few
// helpers; the view functions further below read from it.
// =============================================================================
const Campaign = {
  create() {
    const threat = {};
    ENEMY_FACTIONS.forEach(f => threat[f] = 0);
    return {
      dayCount: 0,
      resources: { ...ECON.startResources },
      army: ECON.startArmy.map(type => ({ type, hp: DATA.units[type].hp })),
      nodeId: PHYLACTERY.id,
      prevNodeId: null,
      owners: Object.fromEntries(DATA.nodes.map(n => [n.id, n.faction])),
      threat,
      battles: 0,
      inventory: [],          // artifact ids found
      equipped: [],           // up to DATA.artifactSlots artifact ids that are active
      hour: 8,                // time of day on the map (0..23); battles start at this time
      conqueredDay: {},       // node id -> day of conquest (dead land grows from there)
      raids: [],              // enemy war parties on the map (Raids)
      won: false,
      econVersion: 2          // 2 = bone amounts scaled x60
    };
  },
  // Julian calendar (correct for 1371): every 4th year is a leap year.
  dateOf(dayCount) {
    let { year, month, day } = MAP.startDate;
    const len = (y, m) => [31, (y % 4 === 0) ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31][m - 1];
    for (let i = 0; i < dayCount; i++) {
      day++;
      if (day > len(year, month)) { day = 1; month++; if (month > 12) { month = 1; year++; } }
    }
    return { year, month, day };
  },
  dateString(dayCount) { const d = this.dateOf(dayCount); return `${d.day}. ${MONTHS[d.month - 1]} ${d.year}`; },
  advanceDays(n) {
    const c = game.campaign;
    for (let i = 0; i < n; i++) {
      c.dayCount++;
      for (const f of ENEMY_FACTIONS) c.threat[f] -= c.threat[f] * THREAT.dailyDecay;
      for (const node of this.ownedSpecials()) this.addResources(DATA.specials[node.special].income || {});
      Raids.day();
      Base.day();
    }
  },
  owner(node) { return game.campaign.owners[node.id]; },
  isConquered(node) { return node.type !== 'PHYLACTERY' && this.owner(node) === 'UNDEAD'; },
  isEnemy(node) { return this.owner(node) !== 'UNDEAD'; },
  isLiving(faction) { return DATA.nodes.some(n => game.campaign.owners[n.id] === faction); },
  armyNode() { return NODE_BY_ID[game.campaign.nodeId]; },
  commandLimit() {
    const mythic = DATA.nodes.filter(n => n.type === 'MYTHIC' && this.isConquered(n)).length;
    return ECON.commandLimitBase + ECON.commandLimitPerMythicNode * mythic + (this.effects().commandLimit || 0) + Base.sum('command') + (game.campaign.debugCommand || 0) + this.leaderCommand();
  },
  // Sum of all active bonuses: equipped artifacts plus buffs of owned special places.
  effects() {
    const c = game.campaign, e = {};
    const add = eff => { for (const [k, v] of Object.entries(eff || {})) e[k] = (e[k] || 0) + v; };
    for (const id of c.equipped || []) if (DATA.artifacts[id]) add(DATA.artifacts[id].effect);
    for (const n of DATA.nodes) if (n.special && this.isConquered(n)) add(DATA.specials[n.special].buff);
    return e;
  },
  // Unconquered places along the road from -> to (within passRadius of the line), with their danger.
  roadPlaces(from, to) {
    const E = DATA.encounters, a = hexToWorld(from.q, from.r), b = hexToWorld(to.q, to.r);
    const dx = b.x - a.x, dz = b.z - a.z, len2 = dx * dx + dz * dz || 1, rad = E.passRadius * COL_SPACING;
    const out = [];
    for (const n of DATA.nodes) {
      if (n === from || n === to || !this.isEnemy(n) || n.type === 'PHYLACTERY') continue;
      const p = hexToWorld(n.q, n.r), t = Math.max(0, Math.min(1, ((p.x - a.x) * dx + (p.z - a.z) * dz) / len2));
      if (Math.hypot(a.x + dx * t - p.x, a.z + dz * t - p.z) > rad) continue;
      out.push({ node: n, t, danger: n.type === 'VILLAGE' ? E.danger.VILLAGE : E.danger[n.size] || 1 });
    }
    return out.sort((x, y) => x.t - y.t);
  },
  // Chance of at least one encounter on this journey (shown before travelling).
  travelRisk(from, to) {
    const E = DATA.encounters, days = this.travelDays(from, to), places = this.roadPlaces(from, to);
    let none = 1;
    for (let d = 1; d <= days; d++) {
      const danger = places.filter(p => p.t <= d / days).reduce((s, p) => s + p.danger, 0);
      none *= 1 - Math.min(E.maxChance, E.baseChance + E.chancePerDanger * danger);
    }
    return { chance: 1 - none, places };
  },
  // Rolls the journey day by day. Returns { at, node } for an encounter or null.
  rollEncounter(from, to, days) {
    const E = DATA.encounters, places = this.roadPlaces(from, to);
    for (let d = 1; d <= days; d++) {
      const at = d / days, passed = places.filter(p => p.t <= at);
      const danger = passed.reduce((s, p) => s + p.danger, 0);
      if (Math.random() >= Math.min(E.maxChance, E.baseChance + E.chancePerDanger * danger)) continue;
      const atk = Math.min(0.92, Math.max(0.08, at - 0.5 / days));          // somewhere on that day's stretch
      return { at: atk, node: this.encounterNode(from, to, atk, passed, danger) };
    }
    return null;
  },
  // A temporary place for the road battle. Enemies: unit types of the most dangerous place passed.
  encounterNode(from, to, at, passed, danger) {
    const E = DATA.encounters;
    // On the road, but never in the water (rivers, the Elbe estuary): the nearest land point along the way.
    const onLand = k => { const q = Math.round(from.q + (to.q - from.q) * k), r = Math.round(from.r + (to.r - from.r) * k), f = game.world.floorKeyAt(q, r);
      return inMap(q, r) && !DATA.floorTypes[f].water ? [q, r] : null; };
    let qr = onLand(at);
    for (let s = 0.02; !qr && s <= 0.6; s += 0.02) qr = onLand(Math.min(1, at + s)) || onLand(Math.max(0, at - s));
    const [q, r] = qr || [from.q, from.r];
    const src = passed.length ? passed.reduce((x, y) => (y.danger > x.danger ? y : x)).node : (this.isEnemy(to) ? to : null);
    const faction = src ? src.faction : 'GUELPHS';
    const types = Object.entries(src ? src.garrison : { bauer: 1 }).filter(([t]) => DATA.units[t].rank !== 'UNIQUE');
    const pool = types.length ? types : [['bauer', 1]];
    const total = Math.min(E.maxUnits, Math.round(E.unitsBase + E.unitsPerDanger * danger)), sum = pool.reduce((s, [, n]) => s + n, 0);
    const garrison = {};
    for (const [t, n] of pool) garrison[t] = Math.max(1, Math.round(total * n / sum));
    const name = src ? `Hinterhalt bei ${src.name}` : 'Überfall auf der Straße';
    return { id: 'encounter', name, q, r, type: 'ENCOUNTER', faction, size: E.size, garrison, encounter: true,
      desc: `${passed.length} unbesiegte Orte passiert.` };
  },
  // Special places the undead own (for income, buffs and the inventory screen).
  ownedSpecials() { return DATA.nodes.filter(n => n.special && this.isConquered(n)); },
  // Command load: only units that cost command. Leaders (negative points) raise the limit instead,
  // so they never push the load below zero (which drained the Lich's army bonus).
  commandUsed() { return game.campaign.army.reduce((s, u) => s + Math.max(0, DATA.units[u.type].commandPoints || 0), 0); },
  leaderCommand(army = game.campaign.army) { return army.reduce((s, u) => s + Math.max(0, -(DATA.units[u.type].commandPoints || 0)), 0); },
  isRevealed(node) { return this.revealedAt(node.q, node.r); },
  // The Lich's battle values (army bonus, conquests, artifacts) and his level (1 + conquered places).
  lichStats() {
    const B = ECON.lichArmyBonus, base = DATA.units.lich, cp = this.commandUsed(), fx = this.effects();
    const won = DATA.nodes.filter(n => this.isConquered(n)).length, um = Upgrades.mods('lich');
    return { level: 1 + won, hp: base.hp + Math.round(cp * B.hpPerCommand + won * (B.hpPerConquest || 0)) + (fx.lichHp || 0) + um.lichHp,
      damage: base.damage + Math.round(cp * B.damagePerCommand + won * (B.damagePerConquest || 0)) + (fx.lichDamage || 0) + um.lichDamage,
      shield: base.soulShield + Math.round(cp * B.shieldPerCommand + won * (B.shieldPerConquest || 0)) + (fx.lichShield || 0) + um.lichShield };
  },
  // Scouts in the army: hounds smell further, ghosts and death lights see through monastery veils.
  scoutRange() { const t = new Set(game.campaign.army.map(u => u.type)); return (t.has('leichenhund') ? 40 : 0) + (t.has('geist') || t.has('totenlicht') ? 60 : 0); },
  seesThroughVeil() { const t = new Set(game.campaign.army.map(u => u.type)); return t.has('geist') || t.has('totenlicht'); },
  // Rough strength for the danger color: HP plus weighted damage of every creature.
  strength(types) { return types.reduce((s, t) => { const u = DATA.units[t]; return s + u.hp + u.damage * 3 * Math.max(1, u.range > 1 ? 1.2 : 1); }, 0); },
  danger(node) {
    if (!this.isEnemy(node)) return null;
    if (node.type === 'CHRISTIAN' && !this.seesThroughVeil() && this.armyNode() !== node) return null;
    const own = this.strength(game.campaign.army.map(u => u.type)), foe = this.strength(this.garrisonFor(node));
    const k = foe / Math.max(1, own);
    return k < 0.5 ? 'low' : k < 1 ? 'mid' : 'high';
  },
  revealedAt(q, r) {
    const lich = this.armyNode();
    if (hexDistance(q, r, lich.q, lich.r) <= REVEAL_DISTANCE + this.scoutRange()) return true;
    if (Expeditions.armyNodes().some(a => hexDistance(q, r, a.q, a.r) <= REVEAL_DISTANCE)) return true;
    if (hexDistance(q, r, PHYLACTERY.q, PHYLACTERY.r) <= REVEAL_DISTANCE) return true;
    return DATA.nodes.some(n => this.isConquered(n) && hexDistance(q, r, n.q, n.r) <= REVEAL_DISTANCE);
  },
  // Travel speed follows the slowest marching unit (the Lich and commanders ride ahead and do not count):
  // factor (2 + move) / 5, so move 3 = normal speed, a ballista (1) = 60 %, a raven host (6) = 160 %.
  slowestMove() {
    const moves = game.campaign.army.map(a => DATA.units[a.type]).filter(u => u.type !== 'lich' && u.rank !== 'COMMANDER' && u.rank !== 'UNIQUE' && u.name !== DATA.units.lich.name).map(u => u.move);
    return moves.length ? Math.min(...moves) : 3;
  },
  tilesPerDay() { return ECON.travelTilesPerDay * (2 + this.slowestMove()) / 5 * (1 + (this.effects().travelPct || 0)); },
  travelDays(from, to) { return Math.max(1, Math.ceil(this.travelHours(from, to) / 24)); },
  // Travel in hours (marching around the clock); at least 2 hours.
  travelHours(from, to) { return Math.max(2, Math.round(hexDistance(from.q, from.r, to.q, to.r) / this.tilesPerDay() * 24)); },
  hour() { const c = game.campaign; return c.hour === undefined ? (c.hour = 8) : c.hour; },
  // Advance the clock; every midnight runs the daily world (raids, buildings, threat).
  advanceHours(h) {
    const c = game.campaign; this.hour();
    c.hour += h;
    while (c.hour >= 24) { c.hour -= 24; this.advanceDays(1); }
  },
  // Time of day index into TIMES for an hour: night 22-4, morning 4-10, day 10-16, evening 16-22.
  timeIndex(hour) { return hour >= 22 || hour < 4 ? 0 : hour < 10 ? 1 : hour < 16 ? 2 : 3; },
  clockString(dayCount, hour) { return `${this.dateString(dayCount)}, ${hour} Uhr (${TIMES[this.timeIndex(hour)].name})`; },
  // When and at what time of day the army would arrive.
  arrivalText(hours) {
    const c = game.campaign, total = this.hour() + hours, d = Math.floor(total / 24), h = total % 24;
    const dur = hours >= 24 ? `${Math.floor(hours / 24)} ${Math.floor(hours / 24) === 1 ? 'Tag' : 'Tage'}${hours % 24 ? ' ' + (hours % 24) + ' Std.' : ''}` : `${hours} Std.`;
    return `${dur} · Ankunft ${this.clockString(c.dayCount + d, h)}`;
  },
  // Garrison incl. threat reinforcements: +1 of the most common unit per full reinforcementPer %.
  garrisonFor(node) {
    const list = [];
    for (const [type, n] of Object.entries(node.garrison)) for (let i = 0; i < n; i++) list.push(type);
    if (!list.length) return list;
    const threat = game.campaign.threat[node.faction] || 0;
    const extra = Math.floor(threat / THREAT.reinforcementPer);
    let best = null, bestN = -1;
    for (const [type, n] of Object.entries(node.garrison)) if (n > bestN) { best = type; bestN = n; }
    for (let i = 0; i < extra * (THREAT.reinforcementUnits || 1); i++) list.push(best);
    // Ley-Bund: the pantheon seat grows with every living member.
    const pid = Pantheons.memberOf(node);
    if (pid && DATA.pantheons[pid].seat === node.id) for (let i = 0; i < (Pantheons.living(pid).length - 1) * LEY.seatBonusPerMember; i++) list.push(best);
    // Leaders who fell to the Lich never come back (bosses do not respawn).
    const c = game.campaign, once = (c.plundered || {})[node.id];
    let keep = once ? [] : list.filter(t => DATA.units[t].rank === 'UNIQUE');
    let rest = list.filter(t => DATA.units[t].rank !== 'UNIQUE');
    // A fallen pantheon leaves its factions weakened.
    if (Pantheons.fallenFaction(node.faction)) rest = rest.filter((t, i) => (i % 10) < LEY.fallenGarrison * 10);
    // A retaken place grows back to full strength over weeks or months.
    const share = this.recovery(node);
    if (share < 1) {
      const counts = {}; for (const t of rest) counts[t] = (counts[t] || 0) + 1;
      rest = Object.entries(counts).flatMap(([t, n]) => Array(Math.max(1, Math.ceil(n * share))).fill(t));
    }
    return [...keep, ...rest];
  },
  // Strength share of a retaken place: starts low and grows linearly until full (DATA.recovery).
  recoveryDays(node) { const R = DATA.recovery; return Math.round(R.baseDays + R.daysPerSize * (node.size || 16)); },
  recovery(node) {
    const c = game.campaign, day = (c.retaken || {})[node.id];
    if (!this.isEnemy(node)) return 1;
    let share = day === undefined ? 1 : Math.min(1, DATA.recovery.startShare + (1 - DATA.recovery.startShare) * (c.dayCount - day) / this.recoveryDays(node));
    // A place that sent out a war party is weaker until it has refilled its ranks.
    const w = (c.weakened || {})[node.id];
    if (w) share = Math.min(share, Math.min(1, w.share + (1 - w.share) * (c.dayCount - w.day) / (this.recoveryDays(node) * DATA.recovery.refillFactor)));
    return share;
  },
  // Threat rises when a node is attacked.
  registerAttack(node) {
    const c = game.campaign;
    for (const f of ENEMY_FACTIONS) {
      if (!this.isLiving(f)) continue;
      c.threat[f] = Math.min(100, c.threat[f] + (f !== node.faction ? THREAT.attackOtherFaction : node.type === 'VILLAGE' ? THREAT.attackOwnVillage : THREAT.attackOwnNode));
    }
  },
  healAtPhylactery() {
    if (game.campaign.nodeId !== PHYLACTERY.id) return;
    for (const u of game.campaign.army) u.hp = DATA.units[u.type].hp;
  },
  addResources(res) {
    for (const [k, v] of Object.entries(res)) game.campaign.resources[k] = (game.campaign.resources[k] || 0) + v;
    if (res.knowledge) Knowledge.discover();
  }
};

// =============================================================================
// Pantheons and ley lines (DATA.pantheons, DATA.ley)
// =============================================================================
const LEY = DATA.ley;
const Pantheons = {
  regionOf: {},           // node id -> pantheon id (nearest member within LEY.regionRadius)
  init() {
    const members = Object.entries(DATA.pantheons).flatMap(([id, p]) => p.members.map(m => [id, NODE_BY_ID[m]]));
    for (const n of DATA.nodes) {
      let best = null, bd = Infinity;
      for (const [id, m] of members) { const d = hexDistance(n.q, n.r, m.q, m.r); if (d < bd) { bd = d; best = id; } }
      if (best && bd <= LEY.regionRadius) this.regionOf[n.id] = best;
    }
  },
  living(pid) { return DATA.pantheons[pid].members.filter(m => !Campaign.isConquered(NODE_BY_ID[m])); },
  assimilated(pid) { return this.living(pid).length === 0; },
  regionAssimilated(node) { const pid = this.regionOf[node.id]; return !!pid && this.assimilated(pid); },
  // Factions whose pantheon has fallen (their places weaken, they send no parties).
  fallenFaction(f) { return Object.keys(DATA.pantheons).some(pid => DATA.pantheons[pid].factions.includes(f) && this.assimilated(pid)); },
  memberOf(node) { return Object.keys(DATA.pantheons).find(pid => DATA.pantheons[pid].members.includes(node.id)); },
  // Active ley nodes: the barrow and the seats of assimilated pantheons.
  leyNodes() { const c = game.campaign; return [PHYLACTERY, ...Object.keys(DATA.pantheons).filter(pid => this.assimilated(pid) && (c.portals || {})[DATA.pantheons[pid].seat]).map(pid => NODE_BY_ID[DATA.pantheons[pid].seat])]; },
  // An assimilated seat without a portal yet (the Lich must raise it there).
  portalPossible(node) {
    const pid = this.memberOf(node), c = game.campaign;
    return !!pid && DATA.pantheons[pid].seat === node.id && this.assimilated(pid) && !(c.portals || {})[node.id];
  },
  portalBlocker() { const c = game.campaign; return Object.entries(LEY.portalCost).find(([k, v]) => (c.resources[k] || 0) < v) ? 'Zu wenig Mittel' : null; },
  buildPortal(node) {
    const c = game.campaign;
    if (!this.portalPossible(node) || this.portalBlocker() || game.mode !== 'world') return;
    for (const [k, v] of Object.entries(LEY.portalCost)) c.resources[k] -= v;
    Campaign.advanceDays(LEY.portalDays);
    (c.portals = c.portals || {})[node.id] = true;
    UI.toast(`Portal in ${node.name} errichtet: Ley-Sprung möglich.`, 5, 'world');
    Narrator.say(`In ${node.name} reißt der Lich die Erde auf. Die Ley-Linie, die hier zutage tritt, gehorcht nun ihm.`);
    SaveGame.save(); WorldView.refresh(); UI.updateHeader(); UI.renderInfo();
  },
  isLeyNode(node) { return this.leyNodes().includes(node); },
  canJump() {
    const c = game.campaign;
    return Object.entries(LEY.jumpCost).every(([k, v]) => (c.resources[k] || 0) >= v);
  },
  async jump(target) {
    const c = game.campaign;
    if (game.mode !== 'world' || !this.canJump()) return;
    for (const [k, v] of Object.entries(LEY.jumpCost)) c.resources[k] -= v;
    c.prevNodeId = c.nodeId; c.nodeId = target.id; c.travel = null;
    Campaign.advanceDays(LEY.jumpDays);
    Campaign.healAtPhylactery();
    WorldView.placeArmy(); WorldView.refresh();
    game.view.cam.lookAtTile(target.q, target.r);
    UI.closeModal(); UI.selectNode(target.id); UI.updateHeader(); SaveGame.save();
    UI.toast(`Ley-Sprung nach ${target.name}.`);
  },
  openJump() {
    const here = Campaign.armyNode(), cost = Object.entries(LEY.jumpCost).map(([k, v]) => `${v} ${RESOURCE_NAMES[k]}`).join(', ');
    const rows = this.leyNodes().filter(n => n !== here).map(n => `<p><button data-ley="${n.id}" ${this.canJump() ? '' : 'disabled'}>${esc(n.name)}</button></p>`).join('');
    UI.modal(`<h2>Ley-Sprung</h2><p class="small">Von ${esc(here.name)} über die Ley-Linien zu einem anderen aktiven Ley-Knoten: ${LEY.jumpDays} Tag, ${cost}. Aktiv sind das Hügelgrab und die Sitze besiegter Pantheons.</p>
      ${rows || '<p class="small">Noch kein anderer Ley-Knoten aktiv. Besiege ein ganzes Pantheon, um seinen Sitz zu öffnen.</p>'}`, [{ label: 'Schließen', primary: true, action: () => {} }]);
    document.querySelectorAll('[data-ley]').forEach(b => b.onclick = () => this.jump(NODE_BY_ID[b.dataset.ley]));
  },
  infoRow(node) {
    const pid = this.regionOf[node.id]; if (!pid) return '';
    const P = DATA.pantheons[pid], live = this.living(pid), n = P.members.length;
    const state = live.length ? `${n - live.length} von ${n} Mitgliedern besiegt${node.id === P.seat ? ' · Heimvorteil am Sitz' : ''}` : `assimiliert – sicher vor Trupps${node.id === P.seat ? ((game.campaign.portals || {})[P.seat] ? ' · Portal steht' : ' · Portal fehlt noch') : ''}`;
    const extra = this.memberOf(node) ? (node.id === P.seat ? ' · <b>Sitz</b> (Ley-Knoten)' : ' · Mitglied') : '';
    return `<tr><td>Pantheon</td><td>${esc(P.name)}${extra}<br><span class="small">${state}</span></td></tr>`;
  }
};

// =============================================================================
// Raids: enemy war parties on the world map (DATA.raids). They march from their cities to
// a conquered place and take it back unless the Lich is near; then they wait and can be
// intercepted. A retaken place belongs to its old faction again (dead land shrinks).
// =============================================================================
const RAIDS = DATA.raids;
const Raids = {
  list() { const c = game.campaign; return c ? (c.raids = c.raids || []) : []; },
  get(id) { return this.list().find(p => p.id === id); },
  armyNear(q, r) { return Expeditions.armyNodes().some(a => hexDistance(Math.round(q), Math.round(r), a.q, a.r) <= RAIDS.safeRadius); },
  targeted() { return new Set(this.list().map(p => p.targetId)); },
  // Best target for a party at (q, r): the nearest conquered place within range that the army does not guard.
  pickTarget(q, r, taken, region = null, strength = 0) {
    let best = null, bd = Infinity;
    for (const n of DATA.nodes) {
      if (!Campaign.isConquered(n) || taken.has(n.id) || this.armyNear(n.q, n.r) || Pantheons.regionAssimilated(n) || Pantheons.memberOf(n)) continue;
      if (region && Pantheons.regionOf[n.id] !== region) continue;
      if (strength && Garrisons.strength(Garrisons.of(n)) > strength * 1.3) continue;     // too well guarded
      const d = hexDistance(Math.round(q), Math.round(r), n.q, n.r);
      if (d <= RAIDS.maxRange && d < bd) { best = n; bd = d; }
    }
    return best;
  },
  // One day: move, retake, spawn.
  day() {
    const c = game.campaign, list = this.list();
    if (c.dayCount < RAIDS.startDay) return;
    for (const p of [...list]) {
      if (p.id === c.intercepting) continue;
      let t = NODE_BY_ID[p.targetId];
      if (!t || !Campaign.isConquered(t)) {                     // target lost its point: look for another one
        const taken = this.targeted(); taken.delete(p.targetId);
        t = this.pickTarget(p.q, p.r, taken, p.region);
        if (!t) { if (c.weakened) delete c.weakened[p.originId]; this.remove(p.id); continue; }   // nothing to take: they go home
        p.targetId = t.id;
      }
      p.holding = this.armyNear(p.q, p.r) || this.armyNear(t.q, t.r);
      if (p.holding) continue;
      const dq = t.q - p.q, dr = t.r - p.r, dist = Math.hypot(dq, dr);
      if (dist <= RAIDS.tilesPerDay) { this.retake(p, t); continue; }
      p.q += dq / dist * RAIDS.tilesPerDay; p.r += dr / dist * RAIDS.tilesPerDay;
    }
    // Alliance: once a faction is at 90 % threat, the living stand together (more and stronger parties).
    const alliance = ENEMY_FACTIONS.some(f => c.threat[f] >= 90 && Campaign.isLiving(f));
