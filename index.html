    if (alliance && !c.alliance) UI.news('Bündnis: Hanse, Welfen und Kirche schließen sich gegen den Lich zusammen. Mehr Trupps ziehen aus.', 'world');
    if (!alliance && c.alliance) UI.news('Das Bündnis gegen den Lich zerfällt.', 'world');
    if (alliance && !c.alliance) Narrator.say('Die Glocken läuten von Lübeck bis Magdeburg. Hanse, Welfen und Kirche schließen ein Bündnis gegen den Lich: Mehr Trupps ziehen aus.');
    c.alliance = alliance;
    if (list.length >= RAIDS.maxParties + (alliance ? 2 : 0)) return;
    // Cooldowns: one new party per globalCooldown days on the whole map (half in an alliance).
    if (c.lastRaidDay !== undefined && c.dayCount - c.lastRaidDay < RAIDS.globalCooldown / (alliance ? 2 : 1)) return;
    c.raidFactionDay = c.raidFactionDay || {};
    const taken = this.targeted();
    for (const o of DATA.nodes) {
      if (list.length >= RAIDS.maxParties + (alliance ? 2 : 0)) break;
      // Cities and big monasteries strike anywhere; living pantheon members rebuild their own region.
      const pid = Pantheons.memberOf(o), city = RAIDS.originTypes.includes(o.type) && (o.size || 0) >= RAIDS.minOriginSize;
      if (!city && !pid) continue;
      if (Campaign.owner(o) !== o.faction || list.some(p => p.originId === o.id) || Pantheons.fallenFaction(o.faction)) continue;
      if (c.raidFactionDay[o.faction] !== undefined && c.dayCount - c.raidFactionDay[o.faction] < RAIDS.factionCooldown) continue;
      if (Campaign.recovery(o) < 1) continue;                    // only places at full strength send troops
      const chance = (pid ? RAIDS.mythicChance : RAIDS.chanceBase + RAIDS.chancePerThreat * (c.threat[o.faction] || 0)) * (alliance && !pid ? 2 : 1);
      if (Math.random() >= chance) continue;
      const t = this.pickTarget(o.q, o.r, taken, pid || null, Campaign.strength(Object.entries(o.garrison).filter(([u]) => DATA.units[u].rank !== 'UNIQUE').flatMap(([u, n]) => Array(Math.round(n * RAIDS.strength)).fill(u))));
      if (!t) continue;
      taken.add(t.id);
      const p = this.create(o, t); if (pid) p.region = pid;
      list.push(p);
      c.lastRaidDay = c.dayCount; c.raidFactionDay[o.faction] = c.dayCount;
      (c.weakened = c.weakened || {})[o.id] = { day: c.dayCount, share: 1 - RAIDS.strength };   // the troops are missing at home
      break;                                             // at most one new party per day
    }
  },
  create(o, t) {
    const garrison = {};
    const types = Object.entries(o.garrison).filter(([u]) => DATA.units[u].rank !== 'UNIQUE');
    const strength = RAIDS.strength * (game.campaign.alliance ? 1.5 : 1);
    for (const [u, n] of types) { const k = Math.round(n * strength); if (k > 0) garrison[u] = k; }
    let total = Object.values(garrison).reduce((a, b) => a + b, 0);
    if (total < RAIDS.minUnits && types.length) garrison[types[0][0]] = (garrison[types[0][0]] || 0) + RAIDS.minUnits - total;
    if (!Object.keys(garrison).length) garrison.bauer = RAIDS.minUnits;
    const c = game.campaign; c.raidCounter = (c.raidCounter || 0) + 1;
    UI.toast(`${DATA.factions[o.faction].name}: Ein Trupp zieht aus ${o.name} gegen ${t.name}.`, 5, 'world');
    Narrator.say('Die Lebenden wehren sich. Wo der Lich nicht ist, ziehen ihre Trupps aus und holen sich zurück, was er nahm.', 'firstRaid');
    return { id: 'raid' + c.raidCounter, faction: o.faction, originId: o.id, targetId: t.id, q: o.q, r: o.r, garrison };
  },
  retake(p, t) {
    const c = game.campaign;
    if (Garrisons.defend(t, p)) { this.remove(p.id); if (game.view && game.view.nodeViews) WorldView.refresh(); return; }
    const back = t.faction === p.faction || Campaign.isLiving(t.faction) ? t.faction : p.faction;
    c.owners[t.id] = back;
    if (c.conqueredDay) delete c.conqueredDay[t.id];
    (c.retaken = c.retaken || {})[t.id] = c.dayCount;      // the place grows back to full strength from here
    this.remove(p.id);
    UI.toast(`${t.name} ist verloren! Ein Trupp aus ${NODE_BY_ID[p.originId].name} hat den Ort zurückerobert.`, 6, 'world');
    if (game.view && game.view.nodeViews) WorldView.refresh();
  },
  remove(id) { const c = game.campaign; c.raids = this.list().filter(p => p.id !== id); },
  total(p) { return Object.values(p.garrison).reduce((a, b) => a + b, 0); },
  name(p) { return `Trupp aus ${NODE_BY_ID[p.originId].name}`; },
  // Pseudo node for the battle against a party.
  node(p) {
    return { id: 'raid', raidId: p.id, name: this.name(p), q: Math.round(p.q), r: Math.round(p.r), type: 'ENCOUNTER', faction: p.faction,
      size: RAIDS.size, garrison: p.garrison, encounter: true, desc: `Unterwegs nach ${NODE_BY_ID[p.targetId].name}.` };
  },
  // The army marches out from its place, fights the party and returns.
  async intercept(p) {
    const c = game.campaign, here = Campaign.armyNode();
    if (game.mode !== 'world') return;
    const days = this.interceptDays(p);
    c.intercepting = p.id;
    game.mode = 'travel';
    const a = hexToWorld(...neighbor(here.q, here.r, 2)), b = hexToWorld(Math.round(p.q), Math.round(p.r)), fig = game.view.army;
    game.view.cam.follow = fig;
    await tween(TRAVEL_SECONDS * 0.6, k => {
      const t = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      fig.position.set(a.x + (b.x - a.x) * t, 0, a.z + (b.z - a.z) * t);
      fig.position.y = game.world.groundAt(fig.position.x, fig.position.z);
    });
    game.view.cam.follow = null;
    Campaign.advanceDays(days);
    c.intercepting = null;
    c.travel = null;
    game.mode = 'world';
    UI.updateHeader();
    await Battle.start(this.node(p));
  },
  interceptDays(p) {
    const a = Campaign.armyNode();
    return Math.max(1, Math.ceil(hexDistance(a.q, a.r, Math.round(p.q), Math.round(p.r)) / Campaign.tilesPerDay()));
  },
  // World view: a banner with the leading unit's figure per visible party.
  syncView() {
    const v = game.view; if (!v || !v.worldRoot) return;
    v.raidViews = v.raidViews || {};
    const list = this.list(), alive = new Set();
    for (const p of list) {
      alive.add(p.id);
      let rv = v.raidViews[p.id];
      if (!rv) rv = v.raidViews[p.id] = this.createView(p);
      const w = hexToWorld(Math.round(p.q), Math.round(p.r));
      rv.group.position.set(w.x, Math.max(game.world.surfaceAt(w.x, w.z), HEX.waterLevel), w.z);
      const t = NODE_BY_ID[p.targetId], tw = hexToWorld(t.q, t.r);
      rv.group.rotation.y = Math.atan2(tw.x - w.x, tw.z - w.z);
      const show = Campaign.revealedAt(Math.round(p.q), Math.round(p.r)) && v.worldRoot.visible;
      rv.group.visible = show; rv.label.visible = show;
      rv.el.textContent = `⚔ ${this.name(p)}${p.holding ? ' (wartet)' : ''}`;
      rv.el.classList.toggle('selected', UI.selectedRaid === p.id);
    }
    for (const id of Object.keys(v.raidViews)) if (!alive.has(id)) { const rv = v.raidViews[id]; rv.group.removeFromParent(); rv.label.element.remove(); delete v.raidViews[id]; }
  },
  createView(p) {
    const v = game.view, group = new THREE.Group(), col = DATA.factions[p.faction].color;
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 11, 5), new THREE.MeshStandardMaterial({ color: 0x4a3a28 }));
    pole.position.set(-2.2, 5.5, 0);
    const flag = new THREE.Mesh(new THREE.BoxGeometry(0.15, 2.4, 3.2), new THREE.MeshStandardMaterial({ color: col, roughness: 0.8 }));
    flag.position.set(-2.2, 9.6, -1.6);
    group.add(pole, flag);
    const lead = Object.entries(p.garrison).sort((a, b) => b[1] - a[1])[0][0];
    Figures.load(lead).then(tpl => {
      const body = tpl ? tpl.clone(true) : new THREE.Mesh(new THREE.ConeGeometry(0.4, 1, 6).translate(0, 0.5, 0), new THREE.MeshStandardMaterial({ color: col }));
      body.scale.setScalar(7); group.add(body);
      const ped = new THREE.Mesh(new THREE.CylinderGeometry(3, 3.3, 0.6, 6), new THREE.MeshStandardMaterial({ color: col, roughness: 0.7 }));
      ped.position.y = 0.3; group.add(ped); body.position.y = 0.6;
    });
    const el = document.createElement('div');
    el.className = 'nodeLabel raidLabel';
    el.addEventListener('click', ev => { ev.stopPropagation(); if (game.mode === 'world') UI.selectRaid(p.id); });
    const label = new CSS2DObject(el); label.position.y = 13;
    group.add(label);
    v.worldRoot.add(group);
    return { group, label, el };
  }
};

// =============================================================================
// Garrisons: undead left behind at a conquered place defend it against war parties.
// They do not count against the Lich's command. A party that reaches a guarded place fights
// an automatic battle (both sides wear each other down; the defenders have the walls).
// =============================================================================
const Garrisons = {
  all() { const c = game.campaign; return c ? (c.garrisons = c.garrisons || {}) : {}; },
  of(node) { return this.all()[node.id] || []; },
  cap(node) { return node.type === 'VILLAGE' ? 8 : (node.size || 16) >= 64 ? 32 : (node.size || 16) >= 32 ? 20 : 12; },
  strength(list) { return Campaign.strength(list.map(u => u.type)); },
  canGarrison(node) { return node && node.type !== 'PHYLACTERY' && Campaign.isConquered(node) && Campaign.armyNode() === node; },
  openLeave(node) {
    const c = game.campaign, have = this.of(node), room = this.cap(node) - have.length;
    const counts = {}; for (const u of c.army) if (u.type !== 'lich') counts[u.type] = (counts[u.type] || 0) + 1;
    const rows = Object.entries(counts).map(([t, n]) => `<div class="recruitRow">${portraitHtml(t, DATA.units[t])}<div><b>${esc(DATA.units[t].name)}</b><br><span class="small">${n} in der Armee</span></div>
      <div class="recruitBtns"><input type="number" min="0" max="${n}" value="0" data-gar="${t}"> <button data-garmax="${t}" data-n="${n}">alle</button></div></div>`).join('');
    UI.modal(`<h2>${esc(node.name)} – Besatzung zurücklassen</h2><p class="small">Die Zurückgelassenen verteidigen den Ort, wenn ein Trupp der Lebenden kommt, und zählen nicht zum Kommando des Lichs. Platz: ${have.length} / ${this.cap(node)} (noch ${room}).</p>${rows || '<p>Keine Einheiten außer dem Lich.</p>'}`,
      [{ label: 'Zurücklassen', primary: true, action: () => this.leave(node) }, { label: 'Abbrechen', action: () => {} }]);
    document.querySelectorAll('[data-garmax]').forEach(b => b.onclick = () => { document.querySelector(`[data-gar="${b.dataset.garmax}"]`).value = b.dataset.n; });
  },
  leave(node) {
    const c = game.campaign, take = {};
    document.querySelectorAll('[data-gar]').forEach(i => { const n = Math.max(0, Math.floor(+i.value || 0)); if (n) take[i.dataset.gar] = n; });
    let room = this.cap(node) - this.of(node).length; const stay = [], rest = [];
    for (const u of c.army) { if (u.type !== 'lich' && take[u.type] > 0 && room > 0) { take[u.type]--; room--; stay.push(u); } else rest.push(u); }
    if (!stay.length) return;
    c.army = rest; this.all()[node.id] = [...this.of(node), ...stay];
    UI.toast(`${stay.length} Untote bleiben in ${node.name} zurück.`); SaveGame.save(); UI.updateHeader(); UI.renderInfo(); WorldView.refresh();
  },
  takeBack(node) {
    const c = game.campaign, g = this.of(node); if (!g.length) return;
    c.army.push(...g); delete this.all()[node.id];
    UI.toast(`Die Besatzung von ${node.name} schließt sich wieder an.`); SaveGame.save(); UI.updateHeader(); UI.renderInfo(); WorldView.refresh();
  },
  // Automatic battle at a guarded place. Returns true if the undead hold it.
  defend(node, party) {
    const g = this.of(node); if (!g.length) return false;
    const att = Object.entries(party.garrison).flatMap(([t, n]) => Array(n).fill(0).map(() => ({ type: t, hp: DATA.units[t].hp })));
    const def = g.map(u => ({ ...u }));
    const dmgOf = (list, target, mul) => list.reduce((s, u) => {
      const d = DATA.units[u.type], tgt = DATA.units[target.type];
      return s + d.damage * (DATA.powerDefense[d.power][tgt.defense] || 0) / 100 * mul;
    }, 0);
    const hit = (list, amount) => { let left = amount; list.sort((a, b) => a.hp - b.hp); while (left > 0 && list.length) { const u = list[0]; const d = Math.min(u.hp, left); u.hp -= d; left -= d; if (u.hp <= 0) list.shift(); } };
    for (let r = 0; r < 30 && att.length && def.length; r++) {
      hit(att, dmgOf(def, att[0], 1.25 * (0.8 + Math.random() * 0.4)));       // the defenders have the walls
      if (!att.length) break;
      hit(def, dmgOf(att, def[0], 0.8 + Math.random() * 0.4));
    }
    const lost = g.length - def.length;
    if (def.length) {
      this.all()[node.id] = def;
      Narrator.say(`Vor ${node.name} brach der Trupp aus ${NODE_BY_ID[party.originId].name} an der Besatzung der Toten. ${lost ? lost + ' Untote fielen, ' : ''}${def.length} halten den Ort.`);
      UI.toast(`${node.name} gehalten! Die Besatzung schlug den Trupp zurück (${lost} verloren).`, 6, 'world');
      return true;
    }
    delete this.all()[node.id];
    UI.toast(`${node.name}: Die Besatzung ist gefallen (${lost} Untote).`, 6, 'world');
    return false;
  },
  infoRow(node) {
    const g = this.of(node); if (!Campaign.isConquered(node) && !g.length) return '';
    const counts = {}; for (const u of g) counts[u.type] = (counts[u.type] || 0) + 1;
    return `<tr><td>Untote Besatzung</td><td>${g.length ? Object.entries(counts).map(([t, n]) => `${n}× ${esc(DATA.units[t].name)}`).join('<br>') : '<span class="small">keine – ein Trupp nimmt den Ort kampflos</span>'}<br><span class="small">Platz ${g.length} / ${this.cap(node)}</span></td></tr>`;
  }
};

// =============================================================================
// Recruitment (Hügelgrab / phylactery)
// =============================================================================
// Where the undead can recruit: the barrow (everything) and every conquered place except villages.
// Towns raise corpses and bones from their graveyards; spirits answer only at barrow or mythic places.
const RECRUIT_AT = {
  PHYLACTERY: null,                                                     // null = all units
  WORLDLY: ['ghul', 'zombie', 'leichenhund', 'skelett', 'bogner', 'schleuderer', 'knochenschuetze', 'todesritter', 'knochenballiste', 'fleischriese'],
  CHRISTIAN: ['zombie', 'skelett', 'bogner', 'schleuderer', 'knochenschuetze', 'gefallene_schwester', 'nekromant', 'fleischriese'],
  MYTHIC: ['ghul', 'leichenhund', 'geist', 'moorleiche', 'wasserleiche', 'totenlicht', 'grabdruidin', 'nekromant', 'totenjaeger', 'knochendrache']
};

// Knowledge: a unit is known once the Lich has enough knowledge and (for pantheon variants)
// the pantheon has fallen. Unknown units stay hidden; only the next threshold is shown.
const Knowledge = {
  known(type) {
    const u = DATA.units[type], c = game.campaign;
    if (u.side !== 'undead' || u.ancestor) return false;
    if (u.requiresPantheon && !Pantheons.assimilated(u.requiresPantheon)) return false;
    return (u.requiresKnowledge || 0) <= (c.resources.knowledge || 0);
  },
  // Next knowledge value that reveals something (only counting units whose pantheon has fallen).
  next() {
    const have = game.campaign.resources.knowledge || 0;
    const t = Object.values(DATA.units).filter(u => u.side === 'undead' && (u.requiresKnowledge || 0) > have && (!u.requiresPantheon || Pantheons.assimilated(u.requiresPantheon)))
      .map(u => u.requiresKnowledge);
    return t.length ? Math.min(...t) : null;
  },
  hiddenInPantheons() { return Object.values(DATA.units).some(u => u.side === 'undead' && u.requiresPantheon && !Pantheons.assimilated(u.requiresPantheon)); },
  hint() {
    const n = this.next(), have = game.campaign.resources.knowledge || 0;
    const parts = [];
    parts.push(n !== null ? `Nächste Erkenntnis bei <b>${n} Wissen</b> (noch ${n - have}).` : 'Mit deinem Wissen ist alles erkannt, was du erkennen kannst.');
    if (this.hiddenInPantheons()) parts.push('Weitere Geheimnisse ruhen bei Pantheons, die noch nicht gefallen sind.');
    return parts.join(' ');
  },
  // Announces newly known units (called whenever knowledge or pantheons change).
  discover() {
    const c = game.campaign; if (!c) return;
    if ((c.resources.knowledge || 0) > 0) Narrator.hint('Wissen bekommst du aus Klöstern und mythischen Orten. Es wird nicht verbraucht: Mit jeder Schwelle erkennt der Lich neue Untote. Welche, weiß er erst, wenn es so weit ist.', 'knowledge');
    c.known = c.known || Object.keys(DATA.units).filter(t => this.known(t));
    const fresh = Object.keys(DATA.units).filter(t => t !== 'lich' && this.known(t) && !c.known.includes(t));
    if (!fresh.length) return;
    c.known.push(...fresh);
    const names = fresh.map(t => DATA.units[t].name).join(', ');
    UI.toast(`Erkenntnis: ${names}. ${fresh.some(t => !Base.hasProducer(t)) ? 'Das passende Gebäude im Hügelgrab fehlt noch.' : 'Jetzt rekrutierbar.'}`, 7, 'world');
  }
};

// Upgrades (DATA.upgrades): bought once in a building, then permanent buffs for a unit group.
const Upgrades = {
  owned() { const c = game.campaign; return c ? (c.upgrades = c.upgrades || []) : []; },
  has(id) { return this.owned().includes(id); },
  inGroup(type, g) { const G = DATA.unitGroups[g]; return g === 'lich' ? type === 'lich' : G === '*' ? type !== 'lich' : (G || []).includes(type); },
  // Summed effects for a unit type.
  mods(type) {
    const m = { hpPct: 0, damagePct: 0, shield: 0, mr: 0, ini: 0, lichHp: 0, lichDamage: 0, lichShield: 0 };
    for (const u of DATA.upgrades) if (this.has(u.id) && this.inGroup(type, u.group)) for (const k in m) m[k] += u[k] || 0;
    return m;
  },
  blocker(u) {
    const c = game.campaign;
    if (this.has(u.id)) return 'Erworben';
    if (Base.level(u.building) < u.level) return `Benötigt ${DATA.baseBuildings[u.building].name} Stufe ${u.level}`;
    for (const [k, v] of Object.entries(u.cost)) if ((c.resources[k] || 0) < v) return `Zu wenig ${RESOURCE_NAMES[k]}`;
    return null;
  },
  buy(id) {
    const u = DATA.upgrades.find(x => x.id === id); if (!u || this.blocker(u)) return;
    for (const [k, v] of Object.entries(u.cost)) game.campaign.resources[k] -= v;
    this.owned().push(id); UI.toast(`${u.name}: ${u.text}`, 5); SaveGame.save(); UI.updateHeader(); Base.open();
  },
  html(k) {
    const list = DATA.upgrades.filter(u => u.building === k); if (!list.length) return '';
    return '<div class="upgrades">' + list.map(u => { const b = this.blocker(u), own = this.has(u.id);
      return `<div class="upg ${own ? 'own' : ''}"><b>${own ? '✔ ' : ''}${esc(u.name)}</b> <span class="small">${esc(u.text)}${own ? '' : ` · ${costHtml(u.cost, game.campaign.resources)}`}</span>
        ${own ? '' : `<button data-upg="${u.id}" ${b ? 'disabled' : ''} title="${b || 'Kaufen'}">Kaufen</button>${b ? `<span class="small"> ${esc(b)}</span>` : ''}`}</div>`; }).join('') + '</div>';
  }
};

// Buildings in the barrow (DATA.baseBuildings). One construction at a time, it continues while travelling.
const Base = {
  levels() {
    const c = game.campaign;
    if (!c.buildings) { c.buildings = {}; for (const [k, b] of Object.entries(DATA.baseBuildings)) c.buildings[k] = b.start || 0; }
    return c.buildings;
  },
  level(k) { return this.levels()[k] || 0; },
  built(k) { return DATA.baseBuildings[k].levels.slice(0, this.level(k)); },
  allBuilt() { return Object.keys(DATA.baseBuildings).flatMap(k => this.built(k)); },
  producer(type) {
    for (const [k, b] of Object.entries(DATA.baseBuildings)) { const i = b.levels.findIndex(l => (l.produces || []).includes(type)); if (i >= 0) return { k, level: i + 1 }; }
    return null;
  },
  hasProducer(type) { const p = this.producer(type); return !p || this.level(p.k) >= p.level; },
  sum(key) { return this.allBuilt().reduce((s, l) => s + (l[key] || 0), 0); },
  lichDeathDays() { const d = this.allBuilt().map(l => l.lichDeathDays).filter(Boolean); return d.length ? Math.min(...d) : ECON.lichDeathDays; },
  // Reason why the next level of k cannot be started, or null.
  blocker(k) {
    const c = game.campaign, B = DATA.baseBuildings[k], L = this.level(k), next = B.levels[L];
    if (!next) return 'Höchste Stufe';
    if (c.construction) return c.construction.k === k ? 'Im Bau' : 'Es wird schon gebaut';
    if (B.requiresNode && !Campaign.isConquered(NODE_BY_ID[B.requiresNode])) return `Erst ${NODE_BY_ID[B.requiresNode].name} erobern`;
    if (B.requiresPantheon && !Pantheons.assimilated(B.requiresPantheon)) return `Erst ${DATA.pantheons[B.requiresPantheon].name} stürzen`;
    for (const [rk, rl] of Object.entries(B.requiresBuilding || {})) if (this.level(rk) < rl) return `Benötigt ${DATA.baseBuildings[rk].name}`;
    for (const [r, v] of Object.entries(next.cost || {})) if ((c.resources[r] || 0) < v) return `Zu wenig ${RESOURCE_NAMES[r]}`;
    return null;
  },
  start(k) {
    if (this.blocker(k)) return;
    const c = game.campaign, next = DATA.baseBuildings[k].levels[this.level(k)];
    for (const [r, v] of Object.entries(next.cost || {})) c.resources[r] -= v;
    c.construction = { k, level: this.level(k) + 1, daysLeft: next.days || 1 };
    SaveGame.save(); UI.updateHeader(); this.open();
  },
  day() {
    const c = game.campaign, w = c.construction;
    if (!w) return;
    if (--w.daysLeft > 0) return;
    this.levels()[w.k] = w.level; c.construction = null;
    UI.toast(`Fertig: ${DATA.baseBuildings[w.k].name} Stufe ${w.level}.`, 5, 'world');
    Knowledge.discover();
  },
  producesText(l) {
    if (!l.produces) return '';
    return 'Erhebt: ' + l.produces.map(t => Knowledge.known(t) ? DATA.units[t].name : '???').join(', ');
  },
  open() {
    const c = game.campaign, fmtCost = o => costHtml(o, c.resources);
    const entries = Object.entries(DATA.baseBuildings);
    if (!DATA.baseBuildings[this.selected]) this.selected = 'phylactery';
    const sel = this.selected, B = DATA.baseBuildings[sel], L = this.level(sel), next = B.levels[L], block = this.blocker(sel);
    const art = k => window.HARMBRINGER_PAINT ? HARMBRINGER_PAINT.building(k) : (window.HARMBRINGER_UI_ART ? HARMBRINGER_UI_ART.building(k) : '⌂');
    const status = k => {
      const b = DATA.baseBuildings[k], lev = this.level(k), reason = this.blocker(k);
      if (lev >= b.levels.length) return ['max', 'Vollendet'];
      if (c.construction && c.construction.k === k) return ['busy', 'Im Bau'];
      if (reason && !reason.startsWith('Zu wenig') && reason !== 'Es wird schon gebaut') return ['locked', 'Gesperrt'];
      return ['ready', 'Ausbaubar'];
    };
    const buildingTiles = entries.map(([k,b]) => {
      const l = this.level(k), [state,label] = status(k);
      const need = l === 0 && state === 'locked' ? this.blocker(k) : '';
      return `<button class="buildingTile ${sel === k ? 'selected' : ''} ${state}" data-building="${k}" aria-pressed="${sel === k}">
        <span class="tileArtwork">${art(k)}</span><span class="tileCopy"><strong>${esc(b.name)}</strong><em>Stufe ${l} / ${b.levels.length}</em>
        <small class="tileStatus">${state === 'locked' ? '♙ ' : state === 'ready' ? '⬆ ' : ''}${label}</small>
        ${need ? `<small class="tileReason">${esc(need)}</small>` : ''}</span></button>`;
    }).join('');
    const current = B.levels.slice(0,L).map(l => [l.text, this.producesText(l)].filter(Boolean).join(' ')).join(' · ') || 'Noch nicht errichtet.';
    const upcoming = next ? [next.text, this.producesText(next)].filter(Boolean).join(' ') : 'Höchste Ausbaustufe erreicht.';
    const upgrades = DATA.upgrades.filter(u => u.building === sel).map((u,i) => {
      const owned = Upgrades.has(u.id), blocked = Upgrades.blocker(u);
      const available = !owned && !blocked;
      const symbol = ['✥','♜','✦','⚔','☾','♱','⛨','⚒','◈'][i%9];
      return `<button class="upgradeTile ${owned ? 'owned' : blocked ? 'locked' : 'available'}" data-upg="${u.id}" ${!available?'disabled':''}
        title="${esc(u.name)} — ${esc(u.text)}${owned ? ' (bereits erforscht)' : blocked ? ' · '+esc(blocked) : ' · Kosten: '+Object.entries(u.cost||{}).map(([r,n])=>n+' '+RESOURCE_NAMES[r]).join(', ')}">
        <span class="upgradeArt" aria-hidden="true">${symbol}</span><span class="upgradeName">${esc(u.name)}</span>
        <small>${owned?'✓ Erforscht':blocked ? esc(blocked) : 'Verbessern'}</small></button>`;
    }).join('');
    const progress = c.construction && c.construction.k===sel ? `<div class="constructionNotice">⌛ Im Bau · noch ${c.construction.daysLeft} Tage</div>` : '';
    UI.modal(`<div class="screenTitle"><span>⚒</span><h2>Hügelgrab – Bauen</h2><span>⚒</span></div>
      <div class="stickyRes">${resSummary(c.resources)}</div>
      <div class="buildScreen">
        <section class="buildingSelection" aria-label="Gebäudeübersicht"><h3>Gebäude des Hügelgrabs</h3><div class="buildingTileGrid">${buildingTiles}</div></section>
        <section class="buildingInspector" aria-label="Gebäudedetails"><div class="buildingHeroArt" data-building="${sel}">${art(sel)}</div>
          <h3>${esc(B.name)} <small>Stufe ${L} / ${B.levels.length}</small></h3>
          <div class="buildingFact"><b>Aktuell</b><span>${current}</span></div>
          <div class="buildingFact next"><b>${next ? 'Ausbau auf Stufe '+(L+1) : 'Vollendet'}</b><span>${upcoming}</span></div>
          ${next ? `<div class="buildingRequirements"><span>${fmtCost(next.cost)}</span><span>⌛ ${next.days} ${next.days===1?'Tag':'Tage'}</span></div>` : ''}
          ${progress}
          <div class="buildingCommand">${next ? `<button class="primary" data-build="${sel}" ${block?'disabled':''} title="${esc(block||'')}" >${L ? 'Auf Stufe '+(L+1)+' ausbauen' : 'Errichten'}</button>` : ''}
          ${block && next ? `<small class="buildBlocked">${esc(block)}</small>` : ''}</div>
          <h3 class="upgradesHeading">✦ Verbesserungen</h3>
          <div class="upgradeTileGrid">${upgrades || '<p class="small">Für dieses Gebäude gibt es keine besonderen Verbesserungen.</p>'}</div>
        </section>
      </div>
      <p class="screenFoot">Nur ein Bau gleichzeitig · Die Arbeiten gehen während der Reise weiter.</p>`,
      [{label:'Schließen',primary:true,action:()=>{UI.renderInfo();UI.updateHeader();}}]);
    $('modalBody').classList.add('wide','hb-build-modal');
    $('modalBody').querySelectorAll('[data-building]').forEach(b=>b.onclick=()=>{ this.selected=b.dataset.building; this.open();});
    $('modalBody').querySelectorAll('[data-build]').forEach(b=>b.onclick=()=>this.start(b.dataset.build));
    $('modalBody').querySelectorAll('[data-upg]').forEach(b=>b.onclick=()=>Upgrades.buy(b.dataset.upg));
  }

};
const Recruitment = {
  canRecruitAt(node) { return node && node.type in RECRUIT_AT && (node.type === 'PHYLACTERY' || Campaign.isConquered(node)); },
  candidates(node = this.site()) {
    const allow = RECRUIT_AT[node.type];
    return Object.entries(DATA.units).filter(([k, u]) => u.side === 'undead' && k !== 'lich' && (!allow || allow.includes(k)) && Knowledge.known(k));
  },
  // Returns null if recruitable, otherwise a German reason.
  // Where recruiting happens: where the army stands, or the barrow (debug: recruiting from afar).
  site() { return this.remote ? PHYLACTERY : Campaign.armyNode(); },
  blocker(type) {
    const u = DATA.units[type], c = game.campaign;
    const here = this.site();
    if (!this.canRecruitAt(here)) return 'Hier kann nicht rekrutiert werden';
    if (!this.candidates(here).some(([k]) => k === type)) return 'Nicht an diesem Ort';
    if (!Knowledge.known(type)) return 'Unbekannt';
    const pr = Base.producer(type);
    if (pr && Base.level(pr.k) < pr.level) return `Benötigt ${DATA.baseBuildings[pr.k].name} Stufe ${pr.level}`;
    if (u.requiresPantheon && !Base.level('knowledgeAltar')) return 'Benötigt Wissensaltar';
    for (const [k, v] of Object.entries(u.cost || {})) if ((c.resources[k] || 0) < v) return `Zu wenig ${RESOURCE_NAMES[k]}`;
    if (Campaign.commandUsed() + u.commandPoints > Campaign.commandLimit()) return 'Kommandolimit erreicht';
    return null;
  },
  // How many of `type` can be raised right now (resources and command).
  maxAffordable(type) {
    if (this.blocker(type)) return 0;
    const u = DATA.units[type], c = game.campaign;
    let n = Infinity;
    for (const [k, v] of Object.entries(u.cost || {})) if (v > 0) n = Math.min(n, Math.floor((c.resources[k] || 0) / v));
    if (u.commandPoints > 0) n = Math.min(n, Math.floor((Campaign.commandLimit() - Campaign.commandUsed()) / u.commandPoints));
    return n === Infinity ? 99 : Math.max(0, n);
  },
  recruitMany(type, count) {
    let done = 0;
    while (done < count && this.recruit(type)) done++;
    return done;
  },
  recruit(type) {
    if (this.blocker(type)) return false;
    const u = DATA.units[type], c = game.campaign;
    for (const [k, v] of Object.entries(u.cost || {})) c.resources[k] -= v;
    c.army.push({ type, hp: u.hp });
    SaveGame.save();
    return true;
  }
};

// =============================================================================
// SaveGame (localStorage, key harmbringer_save_v1). All access in try/catch.
// =============================================================================
const SAVE_KEY = 'harmbringer_save_v1';
const SaveGame = {
  save() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(game.campaign)); } catch (e) { /* storage unavailable */ }
  },
  load() {
    try { return this.parse(localStorage.getItem(SAVE_KEY)); } catch (e) { return null; }
  },
  // A save file may come from anywhere: strip markup from every string (no HTML or script can get into
  // the page), drop prototype keys, force numbers to be numbers and keep only units, places, factions
  // and artifacts the game knows. Values themselves (resources, army size) are not checked: it is a
  // single-player game, editing one's own save is allowed.
  sanitize(raw) {
    const clean = v => {
      if (typeof v === 'string') return v.replace(/[<>"&`]/g, '');
      if (typeof v === 'number') return Number.isFinite(v) ? v : 0;
      if (Array.isArray(v)) return v.map(clean);
      if (v && typeof v === 'object') { const o = {}; for (const [k, x] of Object.entries(v)) if (!['__proto__', 'constructor', 'prototype'].includes(k)) o[k.replace(/[<>"&`]/g, '')] = clean(x); return o; }
      return typeof v === 'boolean' || v === null ? v : undefined;
    };
    const c = clean(raw);
    if (!c || typeof c !== 'object') return null;
    const num = (v, min = 0) => { const n = Number(v); return Number.isFinite(n) ? Math.max(min, n) : min; };
    const army = a => (Array.isArray(a) ? a : []).filter(u => u && DATA.units[u.type] && DATA.units[u.type].side === 'undead')
      .map(u => ({ type: u.type, hp: Math.max(1, Math.min(num(u.hp, 1), DATA.units[u.type].hp * 10)) }));
    for (const k of ['dayCount', 'hour', 'battles', 'newsUnread', 'debugCommand', 'econVersion']) if (k in c) c[k] = num(c[k], k === 'debugCommand' ? -9999 : 0);
    for (const k of ['resources', 'threat']) if (c[k] && typeof c[k] === 'object') for (const r of Object.keys(c[k])) c[k][r] = num(c[k][r]);
    c.army = army(c.army);
    if (c.owners) for (const [id, f] of Object.entries(c.owners)) if (!NODE_BY_ID[id] || !DATA.factions[f]) delete c.owners[id];
    for (const k of ['garrisons', 'stranded']) if (c[k] && typeof c[k] === 'object') for (const id of Object.keys(c[k])) { if (!NODE_BY_ID[id]) delete c[k][id]; else c[k][id] = army(c[k][id]); }
    if (Array.isArray(c.expeditions)) c.expeditions = c.expeditions.filter(e => e && DATA.units[e.leader] && NODE_BY_ID[e.nodeId]).map(e => ({ ...e, army: army(e.army) }));
    for (const k of ['inventory', 'equipped']) if (k in c) c[k] = (Array.isArray(c[k]) ? c[k] : []).filter(id => DATA.artifacts[id]);
    if ('upgrades' in c) c.upgrades = (Array.isArray(c.upgrades) ? c.upgrades : []).filter(id => DATA.upgrades.some(u => u.id === id));
    if (c.buildings && typeof c.buildings === 'object') for (const k of Object.keys(c.buildings)) { if (!DATA.baseBuildings[k]) delete c.buildings[k]; else c.buildings[k] = Math.min(num(c.buildings[k]), DATA.baseBuildings[k].levels.length); }
    if (Array.isArray(c.raids)) c.raids = c.raids.filter(r => r && DATA.factions[r.faction] && NODE_BY_ID[r.targetId] && r.garrison && typeof r.garrison === 'object')
      .map(r => { for (const t of Object.keys(r.garrison)) if (!DATA.units[t]) delete r.garrison[t]; else r.garrison[t] = num(r.garrison[t]); return r; });
    if (Array.isArray(c.news)) c.news = c.news.slice(-400);
    if (c.construction && !(c.construction.k && DATA.baseBuildings[c.construction.k])) c.construction = null;
    if (c.order && !NODE_BY_ID[c.order]) c.order = null;
    if (c.march && !(Array.isArray(c.march.legs) && c.march.legs.every(l => l && NODE_BY_ID[l.fromId] && NODE_BY_ID[l.toId]))) c.march = null;
    return c;
  },
  // Turns a saved JSON string into a campaign (with migration of older saves), or null.
  parse(s) {
    try {
      if (!s) return null;
      const c = this.sanitize(JSON.parse(s));
      if (!c || !Array.isArray(c.army) || !c.owners || !NODE_BY_ID[c.nodeId]) return null;
      // Fill in fields that may be missing in older saves.
      const fresh = Campaign.create();
      // Saves from before the bone rescale (x60) get their bones converted once.
      if ((c.econVersion || 1) < 2 && c.resources) { c.resources.bones = (c.resources.bones || 0) * 60; c.econVersion = 2; }
      c.travel = null;                 // an interrupted journey is not resumed after reloading
      // Places whose faction changed in the data (e.g. mythic places split into own factions) follow the data,
      // unless the undead own them (enemy factions never take places from each other).
      for (const n of DATA.nodes) if (c.owners[n.id] && c.owners[n.id] !== 'UNDEAD' && c.owners[n.id] !== n.faction) c.owners[n.id] = n.faction;
      return { ...fresh, ...c, resources: { ...fresh.resources, ...c.resources }, threat: { ...fresh.threat, ...c.threat },
        owners: { ...fresh.owners, ...c.owners } };   // new places added since the save keep their default owner
    } catch (e) { return null; }
  },
  clear() { try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* ignore */ } },
  // ---- save slots and files -------------------------------------------------
  SLOTS: 5,
  slotKey(i) { return SAVE_KEY + '_slot' + i; },
  info(c) {
    if (!c) return null;
    const won = DATA.nodes.filter(n => n.type !== 'PHYLACTERY' && c.owners[n.id] === 'UNDEAD').length;
    return `${Campaign.dateString(c.dayCount)} · Tag ${c.dayCount} · ${won} Orte erobert · ${c.army.length} Untote`;
  },
  readSlot(i) { try { const raw = localStorage.getItem(this.slotKey(i)); if (!raw) return null; const w = JSON.parse(raw); return { at: w.at, name: w.name, c: this.parse(JSON.stringify(w.c)) }; } catch (e) { return null; } },
  writeSlot(i) {
    try { localStorage.setItem(this.slotKey(i), JSON.stringify({ at: new Date().toLocaleString('de-DE'), name: `Platz ${i + 1}`, c: game.campaign })); UI.toast(`Gespeichert in Platz ${i + 1}.`, 3.5, false); }
    catch (e) { UI.toast('Speichern nicht möglich (Browser-Speicher voll oder gesperrt).', 3.5, false); }
  },
  deleteSlot(i) { try { localStorage.removeItem(this.slotKey(i)); } catch (e) { /* ignore */ } },
  // Download the current campaign as a file (works under file:// too).
  exportFile() {
    const blob = new Blob([JSON.stringify({ game: 'Harmbringer', version: typeof BUILD !== 'undefined' ? BUILD.version : 0, savedAt: new Date().toISOString(), c: game.campaign })], { type: 'application/json' });
    const a = document.createElement('a'), c = game.campaign;
    a.href = URL.createObjectURL(blob); a.download = `harmbringer_tag${c.dayCount}.json`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  },
  importFile() {
    const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json';
    inp.onchange = async () => {
      const f = inp.files[0]; if (!f) return;
      try {
        const w = JSON.parse(await f.text()), c = this.parse(JSON.stringify(w.c || w));
        if (!c) throw new Error('bad');
        UI.closeModal(); if (game.battle) Battle.exit(); startGame(c); UI.toast(`Spielstand geladen: ${this.info(c)}`, 5, false);
      } catch (e) { UI.toast('Diese Datei ist kein Harmbringer-Spielstand.', 3.5, false); }
    };
    inp.click();
  },
  // Modal with autosave, slots, export and import.
  open(fromIntro = false) {
    const auto = this.load(), inGame = !fromIntro && game.campaign && (game.mode === 'world');
    const row = (label, info, btns) => `<div class="recruitRow"><div></div><div><b>${label}</b><br><span class="small">${info || 'leer'}</span></div><div class="recruitBtns">${btns}</div></div>`;
    let html = `<h2>Spielstände</h2><p class="small">Gespeichert wird automatisch nach Kämpfen, Reisen und Aktionen. Zusätzlich gibt es ${this.SLOTS} feste Plätze und die Sicherung als Datei (z. B. für einen anderen Browser oder Rechner).</p>`;
    html += row('Automatisch', auto ? esc(this.info(auto)) : null, auto && fromIntro ? `<button data-sv="loadauto">Laden</button>` : '');
    for (let i = 0; i < this.SLOTS; i++) {
      const sl = this.readSlot(i);
      html += row(`Platz ${i + 1}`, sl ? `${esc(sl.at)} · ${esc(this.info(sl.c))}` : null,
        `${inGame ? `<button data-sv="save" data-i="${i}">Speichern</button>` : ''}${sl ? `<button data-sv="load" data-i="${i}">Laden</button><button data-sv="del" data-i="${i}">Löschen</button>` : ''}`);
    }
    html += `<p>${inGame ? '<button data-sv="export">Als Datei sichern</button> ' : ''}<button data-sv="import">Datei laden</button></p>`;
    UI.modal(html, [{ label: 'Schließen', primary: true, action: () => { if (fromIntro) showIntro(); } }]);
    document.querySelectorAll('[data-sv]').forEach(b => b.onclick = () => {
      const i = +b.dataset.i, k = b.dataset.sv;
      if (k === 'save') { this.writeSlot(i); this.open(fromIntro); }
      else if (k === 'del') { this.deleteSlot(i); this.open(fromIntro); }
      else if (k === 'load') { const sl = this.readSlot(i); if (sl && sl.c) { UI.closeModal(); if (game.battle) Battle.exit(); startGame(sl.c); UI.toast(`Platz ${i + 1} geladen.`, 3.5, false); } else UI.toast('Dieser Stand passt nicht mehr zum Spiel.'); }
      else if (k === 'loadauto') { UI.closeModal(); startGame(auto); }
      else if (k === 'export') this.exportFile();
      else if (k === 'import') this.importFile();
    });
  }
};

// =============================================================================
// Settlements on the world map: small low-poly houses instead of light pillars, so the size
// of a place can be judged at a glance (village: a few houses, big city: walls, towers, church).
// Mythic places are stone circles and dolmens, monasteries a church with a cloister, the barrow a
// mound. A flag shows the owner; conquered places turn grey and dead.
// =============================================================================
const Settlements = {
  geo: {},
  // One merged, vertex-colored mesh per place (built lazily, cached by node id).
  build(node) {
    const T = (g, x, y, z) => g.translate(x, y, z), parts = [], w = game.world, c0 = hexToWorld(node.q, node.r);
    const gy = (x, z) => Math.max(w.groundAt(c0.x + x, c0.z + z), HEX.waterLevel) - Math.max(w.groundAt(c0.x, c0.z), HEX.waterLevel);
    const rnd = (k) => hash2(node.q, node.r, 300 + k);
    const ROOFS = ['#8a3a2a', '#7a4a30', '#9a5a3a', '#6a5a4a'], WALLS = ['#d8ccb0', '#c8b898', '#b8a888'];
    const house = (x, z, s, rot, k) => {
      const y = gy(x, z), body = new THREE.BoxGeometry(1.6 * s, 1.3 * s, 2.1 * s).rotateY(rot), roof = new THREE.ConeGeometry(1.45 * s, 1.1 * s, 4).rotateY(Math.PI / 4 + rot).scale(1, 1, 1.25);
      parts.push([T(body, x, y + 0.65 * s, z), WALLS[k % 3]], [T(roof, x, y + 1.3 * s + 0.55 * s, z), ROOFS[k % 4]]);
    };
    const tower = (x, z, h, col = '#a8a090', top = '#5a4a3a') => { const y = gy(x, z); parts.push([T(new THREE.BoxGeometry(1.4, h, 1.4), x, y + h / 2, z), col], [T(new THREE.ConeGeometry(1.15, 1.6, 4).rotateY(Math.PI / 4), x, y + h + 0.8, z), top]); };
    const church = (x, z, s = 1) => {
      const y = gy(x, z);
      parts.push([T(new THREE.BoxGeometry(2.2 * s, 2.0 * s, 4.2 * s), x, y + 1.0 * s, z), '#d8d0b8'], [T(new THREE.ConeGeometry(2.0 * s, 1.4 * s, 4).rotateY(Math.PI / 4).scale(1, 1, 1.9), x, y + 2.7 * s, z), '#5a5a62']);
      tower(x, z - 2.6 * s, 4.5 * s, '#d0c8b0', '#4a4a52');
      parts.push([T(new THREE.ConeGeometry(0.5 * s, 2.4 * s, 4).rotateY(Math.PI / 4), x, y + 4.5 * s + 2.4 * s, z - 2.6 * s), '#4a4a52']);
    };
    const wallRing = (r, n) => {
      for (let i = 0; i < n; i++) {
        const a0 = i / n * Math.PI * 2, a1 = (i + 1) / n * Math.PI * 2, x0 = Math.cos(a0) * r, z0 = Math.sin(a0) * r, x1 = Math.cos(a1) * r, z1 = Math.sin(a1) * r;
        const len = Math.hypot(x1 - x0, z1 - z0), mx = (x0 + x1) / 2, mz = (z0 + z1) / 2;
        parts.push([T(new THREE.BoxGeometry(len, 1.6, 0.5).rotateY(-Math.atan2(z1 - z0, x1 - x0)), mx, gy(mx, mz) + 0.8, mz), '#9a9284']);

  // All places in two meshes (alive / dead), rebuilt only when ownership changes; flags as one instanced mesh.
  sync() {

    const sig = dead.join(',');

      for (const g of geos) { pos.set(g.attributes.position.array, o * 3); nor.set(g.attributes.normal.array, o * 3); col.set(g.attributes.color.array, o * 3); o += g.attributes.position.count; }

      const n = DATA.nodes.length;

  },
  setFlag(node, color) {

  radius(node) { const s = node.size || 16; return node.type === 'VILLAGE' ? 6 : node.type === 'PHYLACTERY' ? 8 : s >= 64 ? 20 : s >= 32 ? 13 : 8; }
};

  // Village labels only near the camera pivot (or when selected); larger places always show.
  updateLabels() {

// Journey: the figure glides along the road, the camera follows. Every travel day may bring a
// random encounter (DATA.encounters); the battle happens on the road and the journey goes on afterwards.
async function startTravel(target, resume = null) {
  const c = game.campaign, from = Campaign.armyNode();
  if (target.id === from.id || (game.mode !== 'world' && !resume)) return;
  const days = Campaign.travelDays(from, target), hours = Campaign.travelHours(from, target);
  game.mode = 'travel';
  UI.renderInfo();
  const a = hexToWorld(...neighbor(from.q, from.r, 2)), b = hexToWorld(...neighbor(target.q, target.r, 2));
  const fig = game.view.army, cam = game.view.cam;
  // Where the encounter happens (fraction of the road), decided up front.
  const plan = resume ? null : Campaign.rollEncounter(from, target, days);
  const k0 = resume ? resume.at : 0, k1 = plan ? plan.at : 1;
  // Hours of this leg: up to the ambush, the rest of an interrupted journey, or the whole way.
  const hoursSoFar = plan ? Math.max(1, Math.round(hours * plan.at)) : 0;
  const legHours = plan ? hoursSoFar : resume ? (resume.hoursLeft ?? resume.daysLeft * 24) : hours;
  cam.follow = fig;
  // Constant march; the clock runs hour by hour (every midnight: raids move, buildings grow).
  let counted = 0;
  // The clock shows the whole journey, so an ambush halfway is not given away by the bar.
  const shownHours = resume ? legHours : hours;
  TravelClock.show(shownHours);
  await tween(Math.max(1.5, legHours / 24 * DAY_SECONDS), k => {
    const t = k0 + (k1 - k0) * k;
    fig.position.x = a.x + (b.x - a.x) * t;
    fig.position.z = a.z + (b.z - a.z) * t;
    fig.position.y = game.world.groundAt(fig.position.x, fig.position.z);
    const d = Math.min(legHours, Math.floor(k * legHours + 1e-6));
    if (d > counted) { Campaign.advanceHours(d - counted); counted = d; UI.updateHeader(); TravelClock.update(counted, shownHours); }
  }, true);
  if (counted < legHours) Campaign.advanceHours(legHours - counted);
  TravelClock.hide();
  UI.updateHeader();
  cam.follow = null;
  if (plan) {
    // Ambush on the road: the days so far have passed, then the battle. Victory continues the journey.
    c.travel = { targetId: target.id, at: plan.at, hoursLeft: Math.max(0, hours - hoursSoFar) };
    c.prevNodeId = from.id;
    UI.toast(`Hinterhalt! ${plan.node.name}.`, 3.5, 'battle');
    UI.updateHeader();
    game.mode = 'world';
    await Battle.start(plan.node);
    return;
  }
  c.prevNodeId = from.id;
  c.nodeId = target.id;
  c.travel = null;
  Campaign.healAtPhylactery();
  game.mode = 'world';
  WorldView.placeArmy();
  WorldView.refresh();
  UI.selectNode(target.id);
  UI.updateHeader();
  SaveGame.save();
  if (target.id === PHYLACTERY.id) UI.toast('Im Hügelgrab: Die Untoten sind geheilt.');
  if (Campaign.isEnemy(target)) Narrator.hint('Angekommen. Mit „Angreifen“ in der Ortsinfo beginnt der Kampf. Die Besatzung siehst du dort vorher.', 'arrive');
}
// =============================================================================
// Expeditions: commanders (necromancer, death knight) lead their own armies. Orders are given
// first (each army gets a target), then "Los" lets the time run for all of them at once.
// The Lich army is the campaign's main army (c.army, c.nodeId); expeditions live in
// c.expeditions = [{ id, leader, army: [{type, hp}], nodeId, prevNodeId, order }].
// =============================================================================
const COMMANDER_TYPES = ['nekromant', 'todesritter', ...Object.keys(DATA.units).filter(k => DATA.units[k].ancestor)];
// Commanders in battle: HP x3 plus 2 per conquered place, +10 soul shield.
const COMMANDER_BONUS = { hpFactor: 3, hpPerConquest: 2, shield: 10 };
const commanderHp = (type, won, baseHp = DATA.units[type].hp) => Math.round(baseHp * COMMANDER_BONUS.hpFactor + won * COMMANDER_BONUS.hpPerConquest);
const EXPEDITION = { commandLimit: 30, requiresBuilding: 'deadHall' };
const Expeditions = {
  list() { const c = game.campaign; return c ? (c.expeditions = c.expeditions || []) : []; },
  get(id) { return this.list().find(e => e.id === id); },
  name(e) { return `${DATA.units[e.leader].name}-Zug`; },
  command(army) { return army.reduce((s, u) => s + Math.max(0, DATA.units[u.type].commandPoints || 0), 0); },
  // All armies as { id, label, army, node } (Lich first).
  all() {
    const c = game.campaign;
    return [{ id: 'lich', label: 'Lich-Armee', army: c.army, node: Campaign.armyNode(), order: c.order || null },
      ...this.list().map(e => ({ id: e.id, label: this.name(e), army: e.army, node: NODE_BY_ID[e.nodeId], order: e.order || null, exp: e }))];
  },
  active() { const id = UI.activeArmy || 'lich'; return this.all().find(a => a.id === id) || this.all()[0]; },
  armyNodes() { return this.all().map(a => a.node); },
  slowest(army) {
    const m = army.map(a => DATA.units[a.type]).filter(u => u.name !== DATA.units.lich.name && u.rank !== 'COMMANDER' && u.rank !== 'UNIQUE' && !COMMANDER_TYPES.includes(Object.keys(DATA.units).find(k => DATA.units[k] === u))).map(u => u.move);
    return m.length ? Math.min(...m) : 3;
  },
  days(army, from, to) {
    const tpd = ECON.travelTilesPerDay * (2 + this.slowest(army)) / 5 * (1 + (Campaign.effects().travelPct || 0));
    return Math.max(1, Math.ceil(hexDistance(from.q, from.r, to.q, to.r) / tpd));
  },
  canCreate() {
    const c = game.campaign;
    const anc = c.army.some(u => DATA.units[u.type].ancestor);
    if (Base.level(EXPEDITION.requiresBuilding) < 1 && !anc) return 'Benötigt die Totenhalle (Ahnen führen auch ohne)';
    if (!c.army.some(u => COMMANDER_TYPES.includes(u.type))) return 'Kein Kommandeur in der Armee (Nekromant, Todesritter oder ein Ahne)';
    return null;
  },
  // Modal: choose a commander and the units that follow him.
  openCreate() {
    const c = game.campaign, block = this.canCreate();
    if (block) { UI.toast(block); return; }
    const counts = {}; for (const u of c.army) if (u.type !== 'lich') counts[u.type] = (counts[u.type] || 0) + 1;
    const leaders = COMMANDER_TYPES.filter(t => counts[t]);
    const rows = Object.entries(counts).map(([t, n]) => `<tr><td>${esc(DATA.units[t].name)}</td><td>${n}</td>
      <td><input type="number" min="0" max="${n}" value="0" data-exp="${t}" style="width:60px"></td><td class="small">${DATA.units[t].commandPoints} Kommando</td></tr>`).join('');
    UI.modal(`<h2>Expedition aufstellen</h2><p class="small">Ein Kommandeur führt einen eigenen Zug (bis ${EXPEDITION.commandLimit} Kommando). Gib dann allen Armeen Befehle und starte mit „Los“.</p>
      <p>Anführer: <select id="expLeader">${leaders.map(t => `<option value="${t}">${esc(DATA.units[t].name)}</option>`).join('')}</select></p>
      <table><tr><th>Einheit</th><th>Vorhanden</th><th>Mitgeben</th><th></th></tr>${rows}</table><p class="small" id="expInfo"></p>`,
      [{ label: 'Aufstellen', primary: true, action: () => this.create() }, { label: 'Abbrechen', action: () => {} }]);
  },
  create() {
    const c = game.campaign, leader = document.getElementById('expLeader').value;
    const take = {}; document.querySelectorAll('[data-exp]').forEach(i => { const n = Math.max(0, Math.floor(+i.value || 0)); if (n) take[i.dataset.exp] = n; });
    take[leader] = Math.max(1, take[leader] || 0);
    const army = [], rest = [];
    for (const u of c.army) { if (u.type !== 'lich' && take[u.type] > 0) { take[u.type]--; army.push(u); } else rest.push(u); }
    const cmd = this.command(army.filter((u, i) => !(u.type === leader && i === army.findIndex(x => x.type === leader))));
    if (cmd > EXPEDITION.commandLimit) { UI.toast(`Zu viel: ${cmd} von ${EXPEDITION.commandLimit} Kommando.`, 3.5, false); return; }
    c.army = rest;
    c.expCounter = (c.expCounter || 0) + 1;
    const e = { id: 'exp' + c.expCounter, leader, army, nodeId: c.nodeId, prevNodeId: c.prevNodeId, order: null };
    this.list().push(e);
    UI.activeArmy = e.id;
    SaveGame.save(); this.syncView(); UI.renderInfo(); UI.renderArmies();
    UI.toast(`${this.name(e)} aufgestellt (${army.length} Einheiten). Wähle ein Ziel und dann „Los“.`, 5);
  },
  merge(e) {
    const c = game.campaign;
    if (e.nodeId !== c.nodeId) return;
    c.army.push(...e.army); c.expeditions = this.list().filter(x => x !== e);
    UI.activeArmy = 'lich'; SaveGame.save(); this.syncView(); UI.renderInfo(); UI.renderArmies();
    UI.toast(`${this.name(e)} schließt sich dem Lich an.`);
  },
  setOrder(armyId, target) {
    const c = game.campaign;
    if (armyId === 'lich') c.order = target ? target.id : null;
    else { const e = this.get(armyId); if (e) e.order = target ? target.id : null; }
    UI.renderArmies(); UI.renderInfo(); this.syncView();
  },
  hasOrders() { return this.all().some(a => a.order); },
  // "Los": all armies with orders march at the same time, day by day. Each army may run into an
  // ambush on the way (rolled once per march); then everyone stops, the battle is fought and the
  // march goes on afterwards (c.march keeps the progress).
  async go(resume = false) {
    const c = game.campaign;
    if (game.mode !== 'world') return;
    if (!resume && c.march) resume = true;              // an interrupted march (e.g. after loading) goes on
    if (!resume) {
      if (!this.hasOrders()) return;
      const legs = this.all().filter(a => a.order && a.order !== a.node.id).map(a => {
        const to = NODE_BY_ID[a.order], days = this.days(a.army, a.node, to);
        const plan = Campaign.rollEncounter(a.node, to, days);
        return { id: a.id, fromId: a.node.id, toId: to.id, days, done: 0, ambush: plan ? { day: Math.max(1, Math.min(days, Math.round(days * plan.at))), at: plan.at, node: plan.node } : null };
      });
      for (const a of this.all()) if (a.order) { if (a.id === 'lich') c.order = null; else a.exp.order = null; }
      if (!legs.length) { UI.renderArmies(); return; }
      c.march = { day: 0, legs };
    }
    const M = c.march; if (!M) return;
    // Drop legs whose army no longer exists (a fallen expedition).
    M.legs = M.legs.filter(l => l.id === 'lich' || this.get(l.id));
    const open = M.legs.filter(l => l.done < l.days);
    if (!open.length) return this.arrive();
    const end = Math.max(...open.map(l => l.days));
    const nextAmbush = open.filter(l => l.ambush && !l.ambush.fired && l.ambush.day >= M.day).sort((x, y) => x.ambush.day - y.ambush.day)[0];
    const T = nextAmbush ? nextAmbush.ambush.day : end, D0 = M.day, steps = T - D0;
    game.mode = 'travel'; UI.renderInfo();
    const posOf = l => {
      const off = l.id === 'lich' ? 2 : 4, a = NODE_BY_ID[l.fromId], b = NODE_BY_ID[l.toId];
      return { p0: hexToWorld(...neighbor(a.q, a.r, off)), p1: hexToWorld(...neighbor(b.q, b.r, off)), fig: l.id === 'lich' ? game.view.army : (game.view.expViews[l.id] || {}).group };
    };
    const P = open.map(l => ({ l, ...posOf(l) }));
    let counted = 0;
    TravelClock.show(end, 'd'); TravelClock.update(D0, end);
    if (steps > 0) await tween(Math.max(1, steps * DAY_SECONDS), k => {
      const day = D0 + k * steps;
      for (const p of P) {
        if (!p.fig) continue;
        const t = Math.min(1, day / p.l.days);
        p.fig.position.x = p.p0.x + (p.p1.x - p.p0.x) * t; p.fig.position.z = p.p0.z + (p.p1.z - p.p0.z) * t;
        p.fig.position.y = game.world.groundAt(p.fig.position.x, p.fig.position.z);
      }
      const d = Math.min(steps, Math.floor(k * steps + 1e-6));
      while (counted < d) { counted++; Campaign.advanceDays(1); UI.updateHeader(); TravelClock.update(D0 + counted, end); }
    }, true);
    while (counted < steps) { counted++; Campaign.advanceDays(1); }
    TravelClock.hide();
    M.day = T;
    for (const l of M.legs) {
      const was = l.done; l.done = Math.min(l.days, T);
      if (l.done >= l.days && was < l.days) {
        if (l.id === 'lich') { c.prevNodeId = c.nodeId; c.nodeId = l.toId; }
        else { const e = this.get(l.id); if (e) { e.prevNodeId = e.nodeId; e.nodeId = l.toId; } }
      }
    }
    game.mode = 'world';
    if (nextAmbush && nextAmbush.done < nextAmbush.days) {
      nextAmbush.ambush.fired = true;
      const node = nextAmbush.ambush.node, who = nextAmbush.id === 'lich' ? 'Lich-Armee' : this.name(this.get(nextAmbush.id));
      UI.toast(`Hinterhalt gegen ${who}! ${node.name}.`, 5, 'battle');
      UI.updateHeader(); SaveGame.save();
      if (nextAmbush.id === 'lich') { c.prevNodeId = nextAmbush.fromId; await Battle.start(node); }
      else await Battle.start(node, this.get(nextAmbush.id));
      return;                                            // the battle's "Weiter" calls go(true)
    }
    return this.arrive();
  },
  arrive() {
    const c = game.campaign, legs = c.march ? c.march.legs : [];
    c.march = null;
    Campaign.healAtPhylactery();
    for (const e of this.list()) if (e.nodeId === PHYLACTERY.id) for (const u of e.army) u.hp = DATA.units[u.type].hp;
    game.mode = 'world';
    WorldView.placeArmy(); WorldView.refresh(); this.syncView();
    UI.updateHeader(); UI.renderArmies(); UI.renderInfo(); SaveGame.save();
    const arrived = legs.filter(l => Campaign.isEnemy(NODE_BY_ID[l.toId])).map(l => `${l.id === 'lich' ? 'Lich-Armee' : (this.get(l.id) ? this.name(this.get(l.id)) : '')} vor ${NODE_BY_ID[l.toId].name}`).filter(x => !x.startsWith(' '));
    UI.toast(arrived.length ? `Angekommen: ${arrived.join(', ')}. Angreifen über die Ortsinfo.` : 'Alle Armeen sind angekommen.', 6);
  },
  // World view: banner + commander figure per expedition.
  syncView() {
    const v = game.view; if (!v || !v.worldRoot) return;
    v.expViews = v.expViews || {};
    const alive = new Set();
    for (const e of this.list()) {
      alive.add(e.id);
      let ev = v.expViews[e.id];
      if (!ev) ev = v.expViews[e.id] = this.createView(e);
      if (game.mode !== 'travel') {
        const n = NODE_BY_ID[e.nodeId], w = hexToWorld(...neighbor(n.q, n.r, 4));
        ev.group.position.set(w.x, Math.max(game.world.surfaceAt(w.x, w.z), HEX.waterLevel), w.z);
      }
      ev.group.visible = v.worldRoot.visible; ev.label.visible = v.worldRoot.visible;
      ev.el.textContent = `☠ ${this.name(e)}${e.order ? ' → ' + NODE_BY_ID[e.order].name : ''}`;
      ev.el.classList.toggle('selected', UI.activeArmy === e.id);
    }
    for (const id of Object.keys(v.expViews)) if (!alive.has(id)) { const ev = v.expViews[id]; ev.group.removeFromParent(); ev.label.element.remove(); delete v.expViews[id]; }
  },
  createView(e) {
    const v = game.view, group = new THREE.Group(), col = DATA.factions.UNDEAD.color;
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 11, 5), new THREE.MeshStandardMaterial({ color: 0x2a2030 }));
    pole.position.set(-2.2, 5.5, 0);
    const flag = new THREE.Mesh(new THREE.BoxGeometry(0.15, 2.4, 3.2), new THREE.MeshStandardMaterial({ color: col, emissive: 0x2a0f45 }));
    flag.position.set(-2.2, 9.6, -1.6); group.add(pole, flag);
    Figures.load(e.leader).then(tpl => {
      const body = tpl ? tpl.clone(true) : new THREE.Mesh(new THREE.OctahedronGeometry(0.5), new THREE.MeshStandardMaterial({ color: col }));
      body.scale.setScalar(7); body.position.y = 0.6; group.add(body);
      const ped = new THREE.Mesh(new THREE.CylinderGeometry(3, 3.3, 0.6, 6), new THREE.MeshStandardMaterial({ color: col })); ped.position.y = 0.3; group.add(ped);
    });
    const el = document.createElement('div'); el.className = 'nodeLabel';
    el.addEventListener('click', ev => { ev.stopPropagation(); if (game.mode === 'world') { UI.activeArmy = e.id; UI.renderArmies(); UI.selectNode(e.nodeId); } });
    const label = new CSS2DObject(el); label.position.y = 13; group.add(label);
    v.worldRoot.add(group);
    return { group, label, el };
  }
};

const Narrator = {
  queue: [], busy: false,
  // Chronicler line.
  say(text, key) { this.push({ text, key }); },
  // First-steps hint (shown once per campaign; switch off in the hint itself by clicking twice).
  hint(text, key) { const c = game.campaign; if (c && c.hintsOff) return; this.push({ text, key: 'hint_' + key, hint: true }); },
  // Character line: type = unit id for portrait and name, side decides the frame color.
  speak(type, text, key, faction) { this.push({ text, key, type, faction }); },
  push(m) {
    const c = game.campaign;
    if (m.key && c) { c.told = c.told || []; if (c.told.includes(m.key)) return; c.told.push(m.key); }
    if (!m.hint && (!m.type || game.mode !== 'battle')) UI.news((m.type && DATA.units[m.type] ? DATA.units[m.type].name + ': ' : '') + String(m.text).replace(/<[^>]+>/g, ''), 'story');
    this.queue.push(m); if (!this.busy) this.next();
  },
  el() {
    let el = document.getElementById('narrator');

  },
  next() {
    const el = this.el(), m = this.queue.shift();

// Continues an interrupted journey after a won encounter.
function resumeTravel() {
  const c = game.campaign, t = c.travel && NODE_BY_ID[c.travel.targetId];
  if (!t) { c.travel = null; return; }
  const a = hexToWorld(...neighbor(Campaign.armyNode().q, Campaign.armyNode().r, 2)), b = hexToWorld(...neighbor(t.q, t.r, 2));
  game.view.army.position.set(a.x + (b.x - a.x) * c.travel.at, 0, a.z + (b.z - a.z) * c.travel.at);

// Minimap: full map drawn once from the precomputed floor colors (pixels are only
// written, never read), plus an overlay with places, army and view window.
const Minimap = {
  ZOOMS: [1, 2, 4, 8, 16],
  zoomIdx: 2,                  // start at 4x around the camera
  W: 340, H: 200,              // CSS size; the canvas uses twice the resolution
  init() {
    // Plain sRGB components 0..1 from the hex strings (THREE.Color would convert to linear).
    const hex = h => ({ r: parseInt(h.slice(1, 3), 16) / 255, g: parseInt(h.slice(3, 5), 16) / 255, b: parseInt(h.slice(5, 7), 16) / 255 });
    const cols = FLOOR_KEYS.map(k => hex(DATA.floorTypes[k].color));
    const floor = game.world.floor;
    // Full-resolution map (1 pixel = 1 tile) for close zoom levels; pixels are only written.
    const full = this.full = document.createElement('canvas');
    full.width = WIDTH; full.height = HEIGHT;
    const fctx = full.getContext('2d'), img = fctx.createImageData(WIDTH, HEIGHT);
    for (let i = 0; i < floor.length; i++) {
      const c = cols[floor[i]], o = i * 4;
      img.data[o] = c.r * 255; img.data[o+1] = c.g * 255; img.data[o+2] = c.b * 255; img.data[o+3] = 255;
    }
    fctx.putImageData(img, 0, 0);
    // Averaged 4x4 version for the overview (avoids noisy downscaling).
    const K = 4, MW = Math.ceil(WIDTH / K), MH = Math.ceil(HEIGHT / K);
    const small = this.small = document.createElement('canvas');
    small.width = MW; small.height = MH;
    const sctx = small.getContext('2d'), simg = sctx.createImageData(MW, MH);
    for (let my = 0; my < MH; my++) for (let mx = 0; mx < MW; mx++) {
      let r = 0, g = 0, b = 0, n = 0;
      for (let y = my * K; y < Math.min(HEIGHT, my * K + K); y++) for (let x = mx * K; x < Math.min(WIDTH, mx * K + K); x++) {
        const c = cols[floor[y * WIDTH + x]]; r += c.r; g += c.g; b += c.b; n++;
      }
      const o = (my * MW + mx) * 4;
      simg.data[o] = r / n * 255; simg.data[o+1] = g / n * 255; simg.data[o+2] = b / n * 255; simg.data[o+3] = 255;
    }
    sctx.putImageData(simg, 0, 0);
    const cv = this.canvas = document.getElementById('miniMap');
    cv.width = this.W * 2; cv.height = this.H * 2;
    this.ctx = cv.getContext('2d');
    cv.addEventListener('pointerdown', ev => {
      if (game.mode !== 'world') return;
      const rect = cv.getBoundingClientRect();
      const [q, r] = this.toTile((ev.clientX - rect.left) / rect.width * cv.width, (ev.clientY - rect.top) / rect.height * cv.height);
      game.view.cam.lookAtTile(Math.min(WIDTH - 1, Math.max(0, Math.round(q))), Math.min(HEIGHT - 1, Math.max(0, Math.round(r))));
      this.draw();
    });
    cv.addEventListener('wheel', ev => {
      ev.preventDefault();
      const rect = cv.getBoundingClientRect();
      this.zoom(ev.deltaY < 0 ? 1 : -1, [(ev.clientX - rect.left) / rect.width * cv.width, (ev.clientY - rect.top) / rect.height * cv.height]);
    }, { passive: false });
    document.getElementById('miniIn').onclick = () => this.zoom(1);
    document.getElementById('miniOut').onclick = () => this.zoom(-1);
    // Zoom mode: around the mouse position (the minimap keeps its own center) or around the camera.
    try { this.mode = localStorage.getItem('harmbringer_miniZoom') || 'camera'; } catch (e) { this.mode = 'camera'; }
    const mb = document.getElementById('miniMode');
    const label = () => { mb.textContent = this.mode === 'cursor' ? '⌖' : '◎'; mb.title = this.mode === 'cursor' ? 'Zoom auf die Mausposition (Klick: auf die Kamera)' : 'Zoom auf die Kamera (Klick: auf die Mausposition)'; };
    label();
    mb.onclick = () => { this.mode = this.mode === 'cursor' ? 'camera' : 'cursor'; this.center = null; try { localStorage.setItem('harmbringer_miniZoom', this.mode); } catch (e) {} label(); this.draw(); };
  },
  zoom(step, at = null) {
    // Cursor mode: the tile under the mouse stays under the mouse.
    const before = at && this.mode === 'cursor' ? this.toTile(at[0], at[1]) : null;
    if (this.mode === 'cursor' && !this.center) { const v = this.view(); this.center = [v.x0 + this.canvas.width * v.scale / 2, v.y0 + this.canvas.height * v.scale / 2]; }
    this.zoomIdx = Math.min(this.ZOOMS.length - 1, Math.max(0, this.zoomIdx + step));
    if (before) {
      const z = this.ZOOMS[this.zoomIdx], cw = this.canvas.width, ch = this.canvas.height, scale = Math.max(WIDTH / cw, HEIGHT / ch) / z;
      this.center = [before[0] - at[0] * scale + cw * scale / 2, before[1] - at[1] * scale + ch * scale / 2];
    }
    document.getElementById('miniZoom').textContent = this.ZOOMS[this.zoomIdx] + '×';
    this.draw();
  },
  // Visible window in tile coordinates, centered on the camera pivot and kept inside the map.
  view() {
    const z = this.ZOOMS[this.zoomIdx], cw = this.canvas.width, ch = this.canvas.height;
    // Tiles per canvas pixel: at 1x the whole map fits (letterboxed to the canvas aspect).
    const scale = Math.max(WIDTH / cw, HEIGHT / ch) / z;
    const vw = cw * scale, vh = ch * scale;
    const [pq, pr] = this.mode === 'cursor' && this.center ? this.center : game.view.cam.pivotTile();
    const x0 = vw >= WIDTH ? (WIDTH - vw) / 2 : Math.min(WIDTH - vw, Math.max(0, pq - vw / 2));
    const y0 = vh >= HEIGHT ? (HEIGHT - vh) / 2 : Math.min(HEIGHT - vh, Math.max(0, pr - vh / 2));
    return { x0, y0, scale, z };
  },
  toTile(px, py) { const v = this.view(); return [v.x0 + px * v.scale, v.y0 + py * v.scale]; },
  // Place symbols: circle = small (villages, small towns), square = medium, star = large cities;
  // the phylactery is a diamond. Within a shape the size grows with the garrison.
  initSymbols() {
    const shapeOf = n => n.type === 'PHYLACTERY' ? 'diamond' : n.size >= 64 ? 'star' : n.size >= 32 ? 'square' : 'circle';
    const RANGE = { circle: [3.5, 7], square: [5.5, 8.5], star: [10, 14], diamond: [8, 8] };
    const strength = n => Object.values(n.garrison || {}).reduce((a, b) => a + b, 0) + (n.type === 'VILLAGE' ? 0 : 8);
    const groups = {};
    for (const n of DATA.nodes) (groups[shapeOf(n)] = groups[shapeOf(n)] || []).push(n);
    this.symbols = {};
    for (const [shape, list] of Object.entries(groups)) {
      const vals = list.map(strength), lo = Math.min(...vals), hi = Math.max(...vals), [a, b] = RANGE[shape];
      for (const n of list) this.symbols[n.id] = { shape, size: a + (b - a) * (hi > lo ? (strength(n) - lo) / (hi - lo) : 0.5) };
    }
  },
  symbolPath(ctx, shape, x, y, r) {
    ctx.beginPath();
    if (shape === 'circle') ctx.arc(x, y, r, 0, Math.PI * 2);
    else if (shape === 'square') ctx.rect(x - r, y - r, 2 * r, 2 * r);
    else if (shape === 'diamond') { ctx.moveTo(x, y - r); ctx.lineTo(x + r, y); ctx.lineTo(x, y + r); ctx.lineTo(x - r, y); ctx.closePath(); }
    else for (let i = 0; i < 10; i++) {               // five-pointed star
      const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r;
      i ? ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr) : ctx.moveTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    }
    if (shape === 'star') ctx.closePath();
  },
  draw() {
    if (!this.symbols) this.initSymbols();
    const ctx = this.ctx, cv = this.canvas, v = this.view();
    const sx = q => (q - v.x0) / v.scale, sy = r => (r - v.y0) / v.scale;
    ctx.fillStyle = '#22364f'; ctx.fillRect(0, 0, cv.width, cv.height);
    // Base map: averaged overview when far out, crisp tiles when close.
    const useFull = v.z >= 4, src = useFull ? this.full : this.small, k = useFull ? 1 : 4;
    ctx.imageSmoothingEnabled = !useFull;
    ctx.drawImage(src, 0, 0, src.width, src.height, sx(0), sy(0), src.width * k / v.scale, src.height * k / v.scale);
    if (Blight.sig) { ctx.imageSmoothingEnabled = true; const o = Blight.overlay; ctx.drawImage(o, 0, 0, o.width, o.height, sx(0), sy(0), o.width * 4 / v.scale, o.height * 4 / v.scale); }
    // Ley lines between active ley nodes (barrow to every open seat).
    const ley = Pantheons.leyNodes();
    ctx.strokeStyle = 'rgba(170,110,230,0.85)'; ctx.lineWidth = 3;
    for (const n of ley.slice(1)) { ctx.beginPath(); ctx.moveTo(sx(PHYLACTERY.q), sy(PHYLACTERY.r)); ctx.lineTo(sx(n.q), sy(n.r)); ctx.stroke(); }
    // Expeditions and orders: violet dots, dashed lines to the ordered target.
    for (const a of Expeditions.all()) {
      const x = sx(a.node.q + (a.id === 'lich' ? 0 : 3)), y = sy(a.node.r + (a.id === 'lich' ? 0 : 3));
      if (a.order) { const t = NODE_BY_ID[a.order]; ctx.strokeStyle = '#b07ae0'; ctx.lineWidth = 3; ctx.setLineDash([10, 6]); ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(sx(t.q), sy(t.r)); ctx.stroke(); ctx.setLineDash([]); }
    }

    for (const p of Raids.list()) {
