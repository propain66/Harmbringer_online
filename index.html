    const c = game.campaign, extra = c.debugCommand || 0;
    el.innerHTML = `<b>Debug</b> Kommandolimit ${Campaign.commandLimit()} (Zusatz <input type="number" id="dbgCmd" value="${extra}">)
      <button data-dc="-10">−10</button><button data-dc="10">+10</button><button data-dc="100">+100</button><button data-dc="set">Setzen</button><button data-dc="0">Zurück</button>
      <div style="flex-basis:100%"></div><b>Ressourcen</b>
      ${[['corpses', 100], ['bones', 1000], ['souls', 20], ['knowledge', 5]].map(([k, v]) => `<button data-dres="${k}" data-v="${v}" title="+${v} ${RESOURCE_NAMES[k]}">${resIcon(k)}+${v}</button>`).join('')}
      <button data-dres="all" title="Von allem viel">Alles ×10</button>
      <div style="flex-basis:100%"></div><button id="dbgRecruit" title="Rekrutieren wie im Hügelgrab, egal wo die Armee steht">Rekrutieren aus der Ferne</button>`;
    el.querySelectorAll('[data-dres]').forEach(b => b.onclick = () => {

      else { r[b.dataset.dres] = (r[b.dataset.dres] || 0) + +b.dataset.v; if (b.dataset.dres === 'knowledge') Knowledge.discover(); }
      SaveGame.save(); UI.updateHeader(); UI.renderInfo(); this.tools(true);

    $('dbgRecruit').onclick = () => { if (game.mode !== 'world') return; Recruitment.remote = true; UI.openRecruit(); };
    const apply = v => { c.debugCommand = v; SaveGame.save(); UI.updateHeader(); UI.renderInfo(); this.tools(true); };
    el.querySelectorAll('[data-dc]').forEach(b => b.onclick = () => {

    });
  },
  // In battle: edit the values of the unit whose turn it is, and a kill tool (button, then click a unit).
  battleTools(el) {
    const b = game.battle, u = b.current; this.toolsUnit = u;
    const F = [['hp', 'LP (vorderste)'], ['damage', 'Schaden'], ['move', 'Bewegung'], ['range', 'Reichweite'], ['initiative', 'Initiative'], ['energy', 'Energie']];
    el.innerHTML = `<b>Debug Kampf</b> ${u ? esc(u.def.name) : '—'}<div style="flex-basis:100%"></div>
      ${u ? F.map(([k, n]) => `<label style="display:flex;gap:3px;align-items:center">${n}<input type="number" data-st="${k}" value="${k === 'hp' ? topHp(u) : k === 'energy' ? (u.energy || 0) : u.def[k]}"></label>`).join('') : ''}
      ${u ? '<button id="dbgApply">Übernehmen</button><button data-dq="range">Reichweite 30</button><button data-dq="move">Bewegung 20</button>' : ''}
      <div style="flex-basis:100%"></div><button id="dbgKill" class="${b.debugKill ? 'primary' : ''}" title="Danach auf eine Einheit klicken">${b.debugKill ? 'Klick auf eine Einheit …' : 'Einheit töten'}</button>
      <button id="dbgWin" title="Alle Gegner fallen">Sieg</button>
      <button id="dbgLos" class="${b.debugNoLos ? 'primary' : ''}" title="Eigene Angriffe ignorieren Wände und Sichtlinie">Durch Wände ${b.debugNoLos ? 'an' : 'aus'}</button>`;
    $('dbgLos').onclick = () => { b.debugNoLos = !b.debugNoLos; if (b.current && b.current.side === 'player' && !b.busy) Battle.computeOptions(); this.battleTools(el); };
    const apply = vals => {
      if (!u || !u.alive) return;
      const d = { ...u.def };
      for (const [k, v] of Object.entries(vals)) {
        if (k === 'hp') { const n = stackCount(u); d.hp = Math.max(d.hp, v); u.hp = (n - 1) * d.hp + Math.max(1, v); u.maxHp = Math.max(u.maxHp, n * d.hp); }
        else if (k === 'energy') { d.energy = Math.max(d.energy || 0, v); u.energy = v; }
        else d[k] = v;
      }
      u.def = d; BattleView.updateHp(u);
      if (u.side === 'player' && b.current === u && !b.busy) Battle.computeOptions(); else UI.updateBattle();
      this.battleTools(el);
    };
    if ($('dbgApply')) $('dbgApply').onclick = () => { const v = {}; el.querySelectorAll('[data-st]').forEach(i => v[i.dataset.st] = Math.max(0, Math.floor(+i.value || 0))); apply(v); };
    el.querySelectorAll('[data-dq]').forEach(x => x.onclick = () => apply(x.dataset.dq === "range" ? { range: 30 } : { move: 20 }));
    $('dbgKill').onclick = () => { b.debugKill = !b.debugKill; this.battleTools(el); };
    $('dbgWin').onclick = () => { for (const e of Battle.alive('enemy')) Battle.applyDamage(e, e.hp + (e.shield || 0) + 1, b.units.find(x => x.side === 'player' && x.alive), 'BLUNT'); };
  },
  update() {
    if (!game.debug) return;
    if (game.battle && $('debugTools') && !$('debugTools').classList.contains('hidden') && this.toolsUnit !== game.battle.current) this.tools(true);
    if (!game.battle && this.toolsUnit) { this.toolsUnit = null; this.tools(true); }
    const cam = game.view.cam, [q, r] = cam.pivotTile(), w = game.world;
    const dbg = $('debug');
    if (!dbg.title && typeof BUILD !== 'undefined') dbg.title = `Version ${BUILD.version} (${BUILD.date})\nLetzte Änderungen:\n` + BUILD.changes.map(c => `• ${c.date}  ${c.text}`).join('\n');
    dbg.textContent =
      `Version    ${typeof BUILD !== 'undefined' ? BUILD.version + ' · ' + BUILD.date : '?'}  (Maus hier: Änderungen)\n` +
      `FPS        ${game.fps.toFixed(0)}\n` +
      `Pivot      (${q}, ${r})\n` +
      `Meter      ${w.metersAt(q, r).toFixed(1)} m\n` +
      `Spielhöhe  ${w.heightAt(q, r).toFixed(3)} (Stufe ${w.levelAt(q, r)})\n` +
      `Bodentyp   ${game.battle && game.battle.field.get(q, r) ? game.battle.field.get(q, r).floor : w.floorKeyAt(q, r)}\n` +
      `Tiles      ${game.view.tiles.drawn}\n` +
      `Objekte    ${game.view.vegetation.drawn || 0}\n` +
      `Zoom       ${cam.distance.toFixed(0)}\n` +
      `Modus      ${game.mode}\n` +
      `Ort        ${this.nodeLine()}`;
  }
};

// =============================================================================
// Main loop and start-up
// =============================================================================
let lastTime = performance.now(), fpsAcc = 0, fpsFrames = 0, miniAcc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, (now - lastTime) / 1000);
  lastTime = now;
  fpsAcc += dt; fpsFrames++;
  if (fpsAcc >= 0.5) { game.fps = fpsFrames / fpsAcc; fpsAcc = 0; fpsFrames = 0; }
  const v = game.view;
  let keys = (game.mode === 'world' || game.mode === 'battle' || game.mode === 'travel' || game.mode === 'end') ? game.input.keys : new Set();
  // Mouse at the screen edge moves the camera (only over the 3D view, not while rotating).
  const inp = game.input, E = 10;
  if (inp.overCanvas && !inp.rmb && document.hasFocus() && (game.mode === 'world' || game.mode === 'battle') && $('modal').classList.contains('hidden')) {
    const edge = new Set(keys);
    if (inp.mx <= E) edge.add('KeyA'); if (inp.mx >= innerWidth - 1 - E) edge.add('KeyD');
    if (inp.my <= E) edge.add('KeyW'); if (inp.my >= innerHeight - 1 - E) edge.add('KeyS');
    if (edge.size !== keys.size) keys = edge;
  }
  v.cam.update(dt, keys);
  // World map: landscape mesh. Battle: hex tiles (the battlefield is an instanced hex area).
  const inBattle = !!game.battle;
  v.terrain.visible = !inBattle;
  v.vegetation.visible = !inBattle;
  for (const m of v.tiles.meshes) m.visible = inBattle;
  if (inBattle) {
    const [pq, pr] = v.cam.pivotTile(); v.tiles.update(pq, pr);
    BattleView.animate(now);
    // Token mode: K cycles auto / on / off; auto switches on when zoomed far out.
    const tok = game.tokenMode === 'on' || ((game.tokenMode || 'auto') === 'auto' && v.cam.distance > TOKEN_ZOOM);
    if (tok !== game.tokensShown) {
      game.tokensShown = tok; document.body.classList.toggle('tokens', tok);
      for (const u of game.battle.units) if (u.view && u.alive) { u.view.body.visible = !tok; if (u.view.token) u.view.token.visible = tok; }
    }
  } else if (game.tokensShown) { game.tokensShown = false; document.body.classList.remove('tokens'); }
  updateTweens(dt);
  // Fog: dense enough that the edge of the tile window disappears.
  v.scene.fog.density = 1.35 / (v.cam.distance + 160);
  v.sun.position.set(v.cam.pivot.x - 60, v.cam.pivot.y + 90, v.cam.pivot.z + 60);
  v.sun.target.position.copy(v.cam.pivot);
  if (!inBattle) {
    if (Blight.refresh()) v.vegetation.center = [-9999, -9999];
    v.terrain.update(v.cam.pivot, v.sun, v.scene.fog); v.vegetation.update(v.cam.pivot, v.cam.distance);
  }
  v.waterNormal.offset.x = now * 0.00002; v.waterNormal.offset.y = now * 0.000013;
  if (v.armyBody && game.mode !== 'battle') { v.armyBody.rotation.y = now * 0.0008; v.armyBody.position.y = 4.2 + Math.sin(now * 0.002) * 0.4; }
  if (game.battle && BattleView.ring && game.battle.current && game.battle.current.alive) {
    BattleView.ring.position.copy(game.battle.current.view.group.position).add(new THREE.Vector3(0, 0.45, 0));
  }
  miniAcc += dt;
  if (miniAcc > 0.1 && (game.mode === 'world' || game.mode === 'travel')) { miniAcc = 0; Raids.syncView(); Expeditions.syncView(); Minimap.draw(); WorldView.updateLabels(); }
  Debug.update();
  v.renderer.render(v.scene, v.camera);
  v.labelRenderer.render(v.scene, v.camera);
}

function newGame() {
  SaveGame.clear();
  if (game.battle) Battle.exit();
  game.campaign = Campaign.create();
  game.mode = 'world'; UI.selectedRaid = null; UI.activeArmy = 'lich';
  UI.closeModal();
  WorldView.placeArmy();
  game.view.cam.lookAtTile(PHYLACTERY.q, PHYLACTERY.r);
  game.view.cam.distance = CAM.startZoom;
  game.view.cam.yaw = 0;
  UI.enterWorld();
  UI.selectNode(PHYLACTERY.id);
  SaveGame.save();
}

function showIntro() {
  const saved = SaveGame.load();
  game.mode = 'intro';
  const buttons = [];
  if (saved) buttons.push({ label: 'Fortsetzen', action: () => startGame(saved) });
  buttons.push({ label: 'Spielstände …', action: () => setTimeout(() => SaveGame.open(true), 0) });
  buttons.push({ label: 'Erwachen', primary: true, action: () => { SaveGame.clear(); startGame(Campaign.create()); setTimeout(() => { Narrator.speak('lich', LICH_LINES.awaken, 'awaken');
    Narrator.hint('Klicke auf der Karte ein nahes Dorf an, zum Beispiel Undeloh, und wähle „Hierher ziehen“. Die Farbe links am Ortsnamen zeigt die Gefahr: grün, gelb, rot.', 'start');
    Narrator.hint('Kamera: W/A/S/D oder Maus an den Rand, rechte Maustaste drehen, Mausrad zoomen. H springt zum Hügelgrab, F3 zeigt das Debug-Fenster.', 'camera'); }, 1200); } });
  UI.modal(`<h2>Harmbringer</h2>
    <p>Mai 1371. Unter dem Wilseder Berg, in einem Hügelgrab aus der Bronzezeit, öffnet ein Toter die Augen.
    Jahrhunderte lang hat der Lich geschlafen, nun ruft ihn der Hunger der Ley-Linien.</p>
    <p>Über die Heide ziehen Bauern, Mönche und Hansekaufleute, und keiner von ihnen ahnt, was sich unter ihren Füßen regt.
    Erhebe die Toten, nimm Dorf um Dorf und Kloster um Kloster, bis der Brocken dir gehört.</p>
    ${saved ? `<p class="small">Gespeicherter Stand: ${Campaign.dateString(saved.dayCount)}, ${saved.army.length} Untote.</p>` : ''}`, buttons);
}

function startGame(campaign) {
  game.campaign = campaign;
  game.mode = 'world';
  const n = Campaign.armyNode();
  WorldView.placeArmy();
  game.view.cam.lookAtTile(n.q, n.r);
  UI.enterWorld();
  UI.selectNode(n.id);
  SaveGame.save();
}

async function boot() {
  const bar = $('loadingBar'), text = $('loadingText');
  game.world = new WorldData();
  Pantheons.init();
  Sfx.init();
  const t0 = performance.now();
  text.textContent = `Berechne Höhen und Bodentypen für ${(WIDTH * HEIGHT).toLocaleString('de-DE')} Felder …`;
  await game.world.build(p => { bar.style.width = (p * 100).toFixed(0) + '%'; });
  game.loadMs = performance.now() - t0;
  text.textContent = 'Errichte die Welt …';
  await new Promise(r => setTimeout(r, 0));
  text.textContent = 'Lade Bodentexturen …';
  const ground = await TerrainRenderer.loadTextures();
  initScene(ground);
  game.campaign = Campaign.create();      // placeholder until the intro choice
  WorldView.init();
  Minimap.init();
  initInput();
  game.view.cam.lookAtTile(PHYLACTERY.q, PHYLACTERY.r);
  UI.show('loading', false);
  requestAnimationFrame(frame);
  showIntro();
}

// Exposed for console testing only (the acceptance checks in PROMPT 14).
game.api = { hexToWorld, hexDistance, neighbor, worldToHex, Combat, Campaign, Battle, Recruitment, SaveGame, startTravel, UI, NODE_BY_ID, Pathfinding, Stealth, EnemyAI, Minimap };
boot().catch(err => {
  console.error(err);
  // A data file that arrived incomplete (network hiccup, GitHub Pages cache) is the usual cause: say which one.
  const missing = [!window.HARMBRINGER_GROUND && 'data/ground_textures.js', !window.HARMBRINGER_PORTRAITS && 'data/portraits.js'].filter(Boolean);
  $('loadingText').innerHTML = `<b>Fehler beim Laden:</b> ${esc(err.message)}<br><span class="small">${esc((err.stack || '').split('\n')[1] || '')}</span><br><br>`
    + (missing.length ? `Nicht vollständig geladen: <b>${missing.join(', ')}</b>. Meist hilft einfach neu laden.<br><br>` : 'Meist hilft einfach neu laden (Strg + F5).<br><br>')
    + '<button onclick="location.reload()">Neu laden</button>';
});
</script>
