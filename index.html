      html += `
<h3>Beute</h3><p class="loot">${Object.entries(loot).filter(([, v]) => v > 0).map(([k, v]) => `<span class="cost">${resIcon(k, 20)}<b>${v}</b> ${RESOURCE_NAMES[k]}</span>`).join(' ') || 'nichts'}</p>${Object.values(recycled).some(v => v > 0) ? `<p class="small">Davon aus den eigenen Gefallenen zurückgewonnen: ${costHtml(recycled)}</p>` : ''}
        <p class="small">Die Überlebenden sammeln neue Kraft: +${Math.round(healShare * 100)} % ihrer Lebenspunkte (${healed} LP insgesamt).</p>${found}${ancestorText}${pantheonText}`;
      // Show the end screen only once (the campaign may go on afterwards).
      if (node.finale && !c.won) { c.won = true; endNow = true; }
      if (b.leaderFallen) {
        // Survivors (a further quarter lost without their master) wait at the battlefield to be picked up.
        const army = this.survivors(RETREAT_LOSS), at = node.encounter
          ? DATA.nodes.slice().sort((x, y) => hexDistance(x.q, x.r, node.q, node.r) - hexDistance(y.q, y.r, node.q, node.r))[0] : node;
        if (army.length) Stranded.add(at, army);
        html += `<h3>Verwaist</h3><p>${b.expedition ? esc(DATA.units[b.leader].name) : 'Der Lich'} fiel im Kampf. ${army.length ? `${army.length} Untote haben überlebt (ein Viertel mehr zerfiel ohne ihren Herrn) und warten bei <b>${esc(at.name)}</b>, bis der Lich sie abholt.` : 'Keiner seiner Diener blieb übrig.'}</p>`;
        if (b.expedition) c.army = [];
        else {
          const deathDays = Base.lichDeathDays();
          c.travel = null; c.army = [{ type: 'lich', hp: DATA.units.lich.hp }]; c.nodeId = PHYLACTERY.id; c.prevNodeId = null;
          Campaign.advanceDays(deathDays);
          html += `<p class="small">${deathDays} ${deathDays === 1 ? 'Tag' : 'Tage'} später erwacht der Lich im Hügelgrab.</p>`;
        }
        UI.news(`Verwaiste Untote (${army.length}) warten bei ${at.name}.`, 'world');
      }
    } else if (result === 'withdraw') {
      // Everybody leaves the field as they are (no healing, no loot); the army stays at the place.
      c.army = this.survivors(0);
      html = `<h2>Abzug</h2><p>Die Armee zieht geordnet von ${esc(node.name)} ab. Der Ort bleibt in Feindeshand.</p>`;
    } else if (result === 'defeat' && b.expedition) {
      c.army = [];
      html = `<h2>${esc(Expeditions.name(b.expedition))} vernichtet</h2><p>Der Kommandeur ist gefallen, sein Zug zerfällt. Der Lich verliert diese Diener.</p>`;
    } else if (b.expedition) {
      c.army = this.survivors(RETREAT_LOSS);
      html = `<h2>Rückzug</h2><p>${esc(Expeditions.name(b.expedition))} zieht sich zurück und bleibt vor ${esc(node.name)} stehen. Ein Viertel der Truppen bleibt auf dem Feld (die Nachhut), der Kommandeur entkommt. Keine Beute.</p>`;
    } else if (result === 'defeat') {
      c.travel = null;
      c.army = [{ type: 'lich', hp: DATA.units.lich.hp }];
      c.nodeId = PHYLACTERY.id; c.prevNodeId = null;
      const deathDays = Base.lichDeathDays();
      Campaign.advanceDays(deathDays);
      html = `<h2>Der Lich fällt</h2><p>Die Armee zerfällt zu Staub. ${deathDays} ${deathDays === 1 ? 'Tag' : 'Tage'} später erwacht der Lich erneut im Hügelgrab am Wilseder Berg.</p>`;
    } else {
      // Retreat: the army gets away, a quarter of every stack stays behind as rearguard.
      c.travel = null;
      c.army = this.survivors(RETREAT_LOSS);
      html = `<h2>Rückzug</h2><p>Die Armee löst sich vom Feind und bleibt ${node.encounter ? 'am Weg' : 'vor ' + esc(node.name)} stehen. Ein Viertel der Truppen fällt als Nachhut, Lich und Kommandeure entkommen. Keine Beute.</p>`;
    }
    if (c.march && result !== 'victory' && result !== 'withdraw') c.march.legs = c.march.legs.filter(l => l.id !== (b.expedition ? b.expedition.id : 'lich'));
    if (b.expedition) {
      // Write the result back to the expedition and restore the Lich army.
      const e = b.expedition, sv = this.saved;
      e.army = c.army;
      if ((result === 'victory' || result === 'withdraw') && !node.encounter) e.nodeId = node.id;
      c.army = sv.army; c.nodeId = sv.nodeId; c.prevNodeId = sv.prevNodeId; c.travel = sv.travel;
      if (!e.army.length) { c.expeditions = Expeditions.list().filter(x => x !== e); if (UI.activeArmy === e.id) UI.activeArmy = 'lich'; }
      this.saved = null;
    }
    // Losses with portraits (own stacks; summoned ones do not count). After a defeat or retreat all stay behind.
    const losses = [];
    for (const u of b.units) {
      if (u.side !== 'player' || u.summoned || u.type === 'lich') continue;   // the Lich always returns
      const left = !u.alive || result === 'defeat' ? 0 : b.kept && b.kept.has(u) ? b.kept.get(u) : stackCount(u);
      if (u.startCount - left > 0) losses.push({ type: u.type, n: u.startCount - left, of: u.startCount });
    }
    html += `<h3>Verluste</h3>${losses.length ? `<div class="losses">${losses.map(l => `<div class="lossRow" title="${esc(DATA.units[l.type].name)}: ${l.n} von ${l.of} verloren">${portraitHtml(l.type, DATA.units[l.type])}<span><b>−${l.n}</b> ${esc(DATA.units[l.type].name)}<br><span class="small">${l.of - l.n} von ${l.of} übrig</span></span></div>`).join('')}</div>` : '<p class="small">Keine – alle Untoten haben den Kampf überstanden.</p>'}`;
    Campaign.advanceHours(hours);
    html += `<p class="small">Der Kampf dauerte ${b.round} ${b.round === 1 ? 'Runde' : 'Runden'} (etwa ${hours} Stunden). Jetzt: ${Campaign.clockString(c.dayCount, Campaign.hour())}.</p>`;
    Campaign.healAtPhylactery();
    SaveGame.save();
    setTimeout(() => {
      UI.modal(html, [{ label: 'Weiter', primary: true, action: () => { this.exit(); if (endNow) UI.showEnd(); else if (c.travel) resumeTravel(); else if (c.march) Expeditions.go(true); } }]);
    }, 700);
  },
  // Back to the world map.
  exit() {
    const tr = game.view.tiles;
    const root = game.view.battleRoot;
    while (root.children.length) removeWithLabels(root.children[0]);
    game.battle = null;
    Weather.reset();
    tr.floorOverride = null; tr.heightOverride = null; tr.dimOutside = null; tr.locked = false;
    game.view.cam.setMapBounds();
    const n = Campaign.armyNode();
    game.view.cam.lookAtTile(n.q, n.r);
    game.view.cam.distance = CAM.startZoom;
    tr.update(n.q, n.r, true);
    WorldView.setVisible(true);
    WorldView.placeArmy();
    WorldView.refresh();
    game.mode = 'world';
    UI.enterWorld();
    UI.selectNode(n.id);
  }
};

// =============================================================================
// EnemyAI (PROMPT 8.5)
// =============================================================================
// =============================================================================
// Abilities and status effects in battle (DATA.abilities from DT_Abilities).
// Every stack has energy (def.energy, +1 per own turn), cooldowns in own turns and statuses
// that last a number of the stack's own turns. Values scale with the stack size.
// =============================================================================
const STATUS_NAMES = { LEADERLESS: 'Führerlos', POISONED: 'Vergiftet', BURNING: 'Brennt', BLEEDING: 'Blutet', STUNNED: 'Betäubt', SLOWED: 'Verlangsamt', HASTED: 'Beschleunigt',
  SHIELDED: 'Geschützt', ENHANCED: 'Gestärkt', CURSED: 'Verflucht', REGENERATION: 'Regeneration', MARKED: 'Gezeichnet', CONFUSED: 'Verwirrt' };
const STATUS_TIPS = { LEADERLESS: 'ohne Anführer: −2 Initiative, kein Konter, verliert 2 LP je Kreatur pro Zug', POISONED: 'verliert LP zu Zugbeginn', BURNING: 'verliert LP zu Zugbeginn', BLEEDING: 'verliert LP zu Zugbeginn', STUNNED: 'setzt den nächsten Zug aus',
  SLOWED: '−2 Bewegung', HASTED: '+2 Bewegung', SHIELDED: 'Seelenschild erhöht', ENHANCED: '+25 % Schaden', CURSED: '−25 % Schaden',
  REGENERATION: 'heilt zu Zugbeginn', MARKED: 'erleidet +25 % Schaden', CONFUSED: '−50 % Schaden' };
const DOT = new Set(['POISONED', 'BURNING', 'BLEEDING', 'LEADERLESS']);
// Ground the terrain abilities leave behind (for `duration` rounds).
const TERRAIN_FLOOR = { SisterConsecrate: 'HOLY_GROUND', DruidessEarthBind: 'MUD', HeathQueenThorns: 'MUD' };
const POWER_COLORS = { PIERCE: 0xd8d8d0, BLUNT: 0x9a8a6a, REND: 0xb03020, SIEGE: 0x6a5a40, FIRE: 0xff7a20, POISON: 0x7ac030,
  ARCANE: 0xa060ff, SOUL: 0x7aff9a, HOLY: 0xffe080, CHAOS: 0xff3060, HEAL: 0x60ff80 };
const STATUS_ICONS = { POISONED: '☣', BURNING: '♨', BLEEDING: '✚', STUNNED: '✶', SLOWED: '⇣', HASTED: '⇡', SHIELDED: '⛨', ENHANCED: '▲',
  CURSED: '▼', REGENERATION: '♥', MARKED: '◎', CONFUSED: '?', LEADERLESS: '⚑' };
const SUMMON_TYPE = { NecroRaiseDead: 'zombie', WodeWildHunt: 'schwarzer_hund', WispFalseLight: 'irrlicht' };

function moveOf(u) {
  const s = u.status || {};
  return Math.max(1, u.def.move + (s.HASTED ? 2 : 0) - (s.SLOWED ? 2 : 0));
}

const Abilities = {
  init(u) { u.energy = u.def.energy || 0; u.cd = {}; u.status = {}; u.reassembled = false; },
  list(u, trigger) { return (u.def.abilities || []).map(id => [id, DATA.abilities[id]]).filter(([, a]) => a && (!trigger || a.trigger === trigger)); },
  addStatus(u, st, duration, value = 0, quiet = false) {
    if (!u.alive || st === 'NONE') return;
    if (st === 'SHIELDED') { u.shield = (u.shield || 0) + value; if (!quiet) BattleView.floatText(u, `Schild +${value}`, true); BattleView.updateHp(u); return; }
    const old = u.status[st];
    u.status[st] = { turns: Math.max(duration || 1, old ? old.turns : 0), value: Math.max(value, old ? old.value : 0) };
    BattleView.updateHp(u);
    if (!quiet) BattleView.floatText(u, STATUS_NAMES[st], !['POISONED', 'BURNING', 'BLEEDING', 'STUNNED', 'SLOWED', 'CURSED', 'MARKED', 'CONFUSED'].includes(st));
  },
  // Damage multiplier from statuses (attacker deals, target takes).
  damageMul(att, tgt) {
    let m = att && game.battle ? Weather.damageMul(game.battle, att) : 1; const a = att && att.status || {}, t = tgt && tgt.status || {};
    if (a.ENHANCED) m *= 1.25; if (a.CURSED) m *= 0.75; if (a.CONFUSED) m *= 0.5; if (t.MARKED) m *= 1.25;
    return m;
  },
  floorOk(u, a) { return !a.floors.length || a.floors.includes(game.battle.field.get(u.q, u.r).floor); },
  // Start of a stack's turn. Returns true when the turn is lost (stunned or died).
  turnStart(u) {
    const b = game.battle, n = () => Math.max(1, stackCount(u));
    u.energy = Math.min(u.def.energy || 0, (u.energy || 0) + 1);
    for (const k in u.cd) if (u.cd[k] > 0) u.cd[k]--;
    // Damage and healing over time.
    for (const st of DOT) if (u.status[st]) {
      const v = u.status[st].value;
      Battle.log(`${u.def.name}: ${STATUS_NAMES[st].toLowerCase()} (−${v}).`, u.side === 'player' ? 'hit' : 'good');
      Battle.applyDamage(u, st === 'LEADERLESS' ? 2 * Math.max(1, stackCount(u)) : v, null, st === 'POISONED' ? 'POISON' : st === 'BURNING' ? 'FIRE' : 'REND');
      if (!u.alive || b.over) return true;
    }
    if (u.status.REGENERATION) this.heal(u, u.status.REGENERATION.value, 'Regeneration');
    // Auras of adjacent enemies (will-o'-wisps confuse).
    for (const e of Battle.alive(u.side === 'player' ? 'enemy' : 'player'))
      for (const [, a] of this.list(e, 'PASSIVE'))
        if (a.status === 'CONFUSED' && hexDistance(e.q, e.r, u.q, u.r) <= Math.max(1, a.area)) this.addStatus(u, 'CONFUSED', 1);
    // Own triggers at turn start.
    for (const [id, a] of this.list(u, 'ON_TURN_START')) {
      if (!this.floorOk(u, a)) continue;
      if (id === 'PeasantMob' || id === 'HoundPack') {
        if (Battle.alive(u.side).some(o => o !== u && hexDistance(o.q, o.r, u.q, u.r) === 1)) this.addStatus(u, 'ENHANCED', 1, 0, true);
        continue;
      }
      if (a.effect === 'HEAL') { this.heal(u, a.value * n(), a.name); continue; }
      if (a.effect === 'APPLY_STATUS') this.addStatus(u, a.status, a.duration, a.value * n(), true);
    }
    if (u.status.STUNNED) { Battle.log(`${u.def.name} ist betäubt und setzt aus.`, u.side === 'player' ? 'hit' : 'good'); BattleView.floatText(u, 'betäubt'); return true; }
    return false;
  },
  turnEnd(u) {
    for (const st of Object.keys(u.status || {})) if (--u.status[st].turns <= 0) delete u.status[st];
    if (u.view && u.alive) BattleView.updateHp(u);
  },
  heal(u, amount, why) {
    const cap = stackCount(u) * u.def.hp;
    const h = Math.max(0, Math.min(Math.round(amount), cap - u.hp));
    if (!h) return 0;
    u.hp += h; BattleView.updateHp(u); BattleView.floatText(u, '+' + h, true);
    Battle.log(`${u.def.name} heilt (+${h}${why ? ', ' + why : ''}).`, u.side === 'player' ? 'good' : 'hit');
    return h;
  },
  // After a hit: poison bites and treasure curses.
  afterHit(att, tgt, dmg) {
    if (!dmg) return;
    if (tgt.alive) for (const [, a] of this.list(att, 'ON_DAMAGE_DEALT'))
      if (a.effect === 'APPLY_STATUS') { this.addStatus(tgt, a.status, a.duration, Math.max(1, Math.round(a.value * stackCount(att) * 0.5))); Battle.log(`${tgt.def.name} ist ${STATUS_NAMES[a.status].toLowerCase()} (${a.name}).`); }
    if (att.alive) for (const [, a] of this.list(tgt, 'ON_DAMAGE_TAKEN'))
      if (a.effect === 'APPLY_STATUS') { this.addStatus(att, a.status, a.duration); Battle.log(`${att.def.name} ist ${STATUS_NAMES[a.status].toLowerCase()} (${a.name}).`); }
  },
  // A stack would die: skeletons reassemble once (not after a blunt or holy death).
  beforeDeath(u, power) {
    if (u.reassembled || !this.list(u, 'ON_DEATH').some(([id]) => id === 'SkeletonReassemble') || power === 'BLUNT' || power === 'HOLY') return false;
    u.reassembled = true;
    const k = Math.max(1, Math.ceil(u.startCount / 4));
    u.hp = (k - 1) * u.def.hp + DATA.abilities.SkeletonReassemble.value;
    BattleView.updateHp(u); BattleView.floatText(u, 'setzt sich neu zusammen', true);
    Battle.log(`${k}× ${u.def.name} setzen sich wieder zusammen.`, u.side === 'player' ? 'good' : 'hit');
    return true;
  },
  afterDeath(u) {
    // Summoned creatures never summon again on death (a false light would otherwise rise forever).
    if (u.summoned) return;
    for (const [id] of this.list(u, 'ON_DEATH')) if (id === 'WispFalseLight') this.summon(u, id, game.battle.field.get(u.q, u.r), Math.max(1, Math.ceil(u.startCount / 4)));
  },
  // ---- active abilities ---------------------------------------------------
  blocker(u, id) {
    const a = DATA.abilities[id];
    if (u.hasAttacked) return 'Schon gehandelt';
    if ((u.cd[id] || 0) > 0) return `Abklingzeit ${u.cd[id]}`;
    if ((u.energy || 0) < a.energy) return `Energie ${u.energy}/${a.energy}`;
    if (a.corpse && !this.corpseTiles(u, a).length) return 'Keine Leiche in Reichweite';
    if (a.target !== 'SELF' && a.target !== 'ALL_ALLIES' && a.target !== 'ALL_ENEMIES' && !this.validTiles(u, id).length) return 'Kein Ziel';
    return null;
  },
  actives(u) { return this.list(u, 'ACTIVE').filter(([id]) => id !== 'LichRetreat'); },
  corpseTiles(u, a) {
    const b = game.battle, f = b.field;
    return [...(b.corpses || new Map()).entries()].filter(([, c]) => c > 0).map(([i]) => f.tiles[i]).filter(t => t && hexDistance(u.q, u.r, t.q, t.r) <= Math.max(1, a.range));
  },
  validTiles(u, id) {
    const a = DATA.abilities[id], b = game.battle, f = b.field, from = f.get(u.q, u.r);
    if (a.corpse) return this.corpseTiles(u, a);
    const inRange = t => { const d = hexDistance(from.q, from.r, t.q, t.r); return d >= (a.target === 'ALLY' ? 0 : 1) && d <= Math.max(1, a.range) && (d <= 1 || Combat.lineOfSight(f, from, t).clear); };
    if (a.target === 'ENEMY') return Battle.alive(u.side === 'player' ? 'enemy' : 'player').map(e => f.get(e.q, e.r)).filter(inRange);
    if (a.target === 'ALLY') return Battle.alive(u.side).map(e => f.get(e.q, e.r)).filter(inRange);
    if (a.target === 'GROUND') return f.tiles.filter(t => t && inRange(t) && (a.effect !== 'SUMMON' || (!t.unit && f.walkable(t))));
    return [from];
  },
  // Units hit by ability a cast by u at tile t.
  affected(u, a, t) {
    const b = game.battle, f = b.field;
    const foes = Battle.alive(u.side === 'player' ? 'enemy' : 'player'), friends = Battle.alive(u.side);
    const pool = ['ENEMY', 'ALL_ENEMIES'].includes(a.target) || (a.target === 'GROUND' && a.effect !== 'HEAL') ? foes : friends;
    if (a.target === 'SELF' && a.pattern === 'SINGLE_POINT') return [u];
    const c = ['SELF', 'ALL_ALLIES', 'ALL_ENEMIES'].includes(a.target) ? f.get(u.q, u.r) : t;
    if (a.pattern === 'SINGLE_POINT') return pool.filter(x => x.q === c.q && x.r === c.r);
    if (a.pattern === 'LINE') {
      const line = hexLine(u.q, u.r, c.q, c.r).slice(1, 1 + Math.max(1, a.area) + hexDistance(u.q, u.r, c.q, c.r));
      return pool.filter(x => line.some(([q, r]) => q === x.q && r === x.r));
    }
    if (a.pattern === 'CONE') return pool.filter(x => hexDistance(x.q, x.r, c.q, c.r) <= a.area && hexDistance(x.q, x.r, u.q, u.r) <= Math.max(1, a.range) + 1);
    return pool.filter(x => hexDistance(x.q, x.r, c.q, c.r) <= Math.max(1, a.area));   // RADIUS / RING
  },
  async use(u, id, t) {
    const b = game.battle, f = b.field, a = DATA.abilities[id], n = Math.max(1, stackCount(u));
    if (this.blocker(u, id)) return false;
    u.energy -= a.energy; u.cd[id] = a.cooldown + 1;      // +1: the cooldown counts from the next own turn
    u.hasAttacked = true;
    Battle.log(`${u.def.name}: ${a.name}.`, u.side === 'player' ? 'good' : 'hit');
    BattleView.floatText(u, a.name, true); Sfx.ability(); BattleView.castFlash(u, a.power);
    if (t && t !== f.get(u.q, u.r)) { const p = hexToWorld(t.q, t.r); BattleView.face(u, p.x, p.z); }
    await wait(0.25);
    if (a.effect === 'SUMMON') { this.summon(u, id, t, Math.max(1, a.value * (id === 'WodeWildHunt' ? 4 : 1) * (id === 'NecroRaiseDead' ? Math.min(4 * n, b.corpses.get(f.index(t)) || 1) : 1))); return true; }
    if (id === 'GhoulCorpseEater') { this.heal(u, a.value * n, a.name); b.corpses.set(f.index(t), Math.max(0, (b.corpses.get(f.index(t)) || 1) - n)); BattleView.syncCorpses(); return true; }
    if (a.effect === 'MODIFY_TERRAIN' && TERRAIN_FLOOR[id]) this.changeGround(t || f.get(u.q, u.r), Math.max(1, a.area), TERRAIN_FLOOR[id], Math.max(1, a.duration));
    const targets = this.affected(u, a, t);
    for (const x of targets) {
      if (!x.alive || b.over) continue;
      if (a.effect === 'DAMAGE' || (a.effect === 'MODIFY_TERRAIN' && a.value > 0 && a.power !== 'HEAL')) {
        const tt = f.get(x.q, x.r), from = f.get(u.q, u.r);
        const base = id === 'LichSoulDrain' ? Math.max(a.value, Math.round(u.def.damage * 1.5)) : a.value * n;   // the drain grows with the Lich
        const dmg = Math.round(Combat.damage({ power: a.power, damage: base }, x.def, from.level, tt.level, false) * this.damageMul(u, x));
        Battle.log(`${a.name} trifft ${x.def.name}: ${dmg} Schaden.`, u.side === 'player' ? 'good' : 'hit');
        Battle.applyDamage(x, dmg, u, a.power);
        if (id === 'LichSoulDrain') this.heal(u, dmg, a.name);
        if (x.alive && a.status !== 'NONE') this.addStatus(x, a.status, a.duration);
      } else if (a.effect === 'HEAL') this.heal(x, a.value * n, a.name);
      else if (a.effect === 'APPLY_STATUS' || a.effect === 'STUN') this.addStatus(x, a.effect === 'STUN' ? 'STUNNED' : a.status, a.duration, a.status === 'SHIELDED' ? a.value * n : Math.max(1, Math.round(a.value * n * 0.5)));
      else if (a.effect === 'MODIFY_TERRAIN' && x.def.flying) Battle.log(`${x.def.name} fliegt darüber hinweg.`);
      else if (a.effect === 'MODIFY_TERRAIN') this.addStatus(x, a.status !== 'NONE' ? a.status : (a.power === 'HOLY' ? 'BURNING' : 'SLOWED'), Math.max(1, a.duration), Math.max(1, a.value * n));
      else if (a.effect === 'TELEPORT') Battle.retreat();
    }
    if (!targets.length) Battle.log('… ohne Wirkung.');
    return true;
  },
  changeGround(center, radius, floor, rounds) {
    const b = game.battle, f = b.field, tiles = [];
    for (const t of f.tilesWithin(center.q, center.r, radius)) {
      if (f.isWater(t) || t.building !== null || DATA.floorTypes[t.floor].moveCost === null) continue;
      tiles.push({ t, old: t.floor }); t.floor = floor;
    }
    if (!tiles.length) return;
    (b.terrainMods = b.terrainMods || []).push({ tiles, rounds });
    game.view.tiles.rebuild();
    Battle.log(`Der Boden wird zu ${DATA.floorTypes[floor].name} (${rounds} ${rounds === 1 ? 'Runde' : 'Runden'}).`);
  },
  // Called every round: terrain changes wear off.
  roundEnd() {
    const b = game.battle; if (!b.terrainMods || !b.terrainMods.length) return;
    let changed = false;
    for (const m of b.terrainMods) if (--m.rounds <= 0) { for (const { t, old } of m.tiles) t.floor = old; changed = true; }
    b.terrainMods = b.terrainMods.filter(m => m.rounds > 0);
    if (changed) { game.view.tiles.rebuild(); Battle.log('Der Boden wird wieder, wie er war.'); }
  },
  summon(u, id, t, count) {
    const b = game.battle, f = b.field, type = SUMMON_TYPE[id];
    if (!type || !DATA.units[type]) return;
    let tile = t && !t.unit && f.walkable(t) ? t : null;
    if (!tile) tile = f.tilesWithin(t ? t.q : u.q, t ? t.r : u.r, 2).find(x => !x.unit && f.walkable(x) && !f.isWater(x));
    if (!tile) { Battle.log('Kein Platz für die Gerufenen.'); return; }
    const s = Battle.makeStack(type, u.side, u.faction, Array(count).fill(DATA.units[type].hp));
    Abilities.init(s);
    s.summoned = true;
    s.nextTick = (b.lastTick || 0) + turnTicks(s.def);
    b.units.push(s); Battle.putUnit(s, tile);
    BattleView.createUnit(s); game.tokensShown = null;
    if (t && b.corpses) b.corpses.delete(f.index(t));
    BattleView.syncCorpses();
    Battle.log(`${count}× ${s.def.name} ${count > 1 ? 'erheben sich' : 'erhebt sich'}.`, u.side === 'player' ? 'good' : 'hit');
    UI.updateBattle();
  },
  // ---- enemy use ------------------------------------------------------------
  async aiUse(u) {
    const b = game.battle;
    let best = null;
    const foes = Battle.alive(u.side === 'player' ? 'enemy' : 'player');
    const near = foes.some(e => hexDistance(e.q, e.r, u.q, u.r) <= 5);
    for (const [id, a] of this.actives(u)) {
      if (this.blocker(u, id)) continue;
      for (const t of this.validTiles(u, id)) {
        const hit = a.effect === 'SUMMON' ? [] : this.affected(u, a, t);
        let score = 0;
        if (a.effect === 'DAMAGE') score = hit.reduce((s, x) => s + a.value * stackCount(u) + (x.type === 'lich' ? 10 : 0), 0) * 0.8;
        else if (a.effect === 'HEAL') score = hit.reduce((s, x) => s + Math.min(a.value * stackCount(u), stackCount(x) * x.def.hp - x.hp), 0);
        else if (a.effect === 'SUMMON') score = near ? 25 : 0;
        else if (['ALLY', 'ALL_ALLIES', 'SELF'].includes(a.target)) score = near ? hit.filter(x => !(x.status || {})[a.status]).length * 12 : 0;
        else score = hit.filter(x => !(x.status || {})[a.status]).length * 14;
        if (score > (best ? best.score : 10)) best = { id, t, score };
        if (['SELF', 'ALL_ALLIES', 'ALL_ENEMIES'].includes(a.target)) break;
      }
    }
    if (!best) return false;
    // Compare with a normal attack from here.
    const f = b.field, here = f.get(u.q, u.r);
    const normal = Math.max(0, ...foes.filter(p => Combat.canAttack(f, u, here, p).ok).map(p => Combat.expected(f, u, here, p, false)));
    if (DATA.abilities[best.id].effect === 'DAMAGE' && best.score < normal) return false;
    await this.use(u, best.id, best.t);
    return true;
  },
  statusHtml(u) {
    if (u.view) BattleView.updateHp(u);
    const s = Object.entries(u.status || {});
    return s.length ? s.map(([k, v]) => `<span title="${STATUS_TIPS[k]}">${STATUS_NAMES[k]} (${v.turns})</span>`).join(', ') : '';
  }
};

const EnemyAI = {
  async takeTurn(u) {
    const b = game.battle, f = b.field;
    const here = f.get(u.q, u.r);
    const isBallista = u.type === 'balliste';
    const canMove = !isBallista || u.idleTurns >= 2;
    const reach = Pathfinding.reachable(f, u);
    const spots = canMove ? reach.tiles : [here];
    await wait(0.2);
    if (game.battle !== b) return;
    // Suspicious defenders only investigate; alarmed ones shout on their first turn.
    if (u.alert === 'suspicious') { await Alarm.investigate(u); return; }
    if (u.alert === 'alarmed' && !u.shouted) Alarm.shout(u);
    // 0. Abilities (spells, buffs, summons) from where the unit stands.
    if (await Abilities.aiUse(u)) return;

    // 1. Priests heal the wounded ally with the largest deficit.
    if (u.def.power === 'HEAL') {
      let best = null;
      for (const t of spots) for (const a of this.allies(u)) {
        if (a === u || topHp(a) >= a.def.hp) continue;
        if (!Combat.canAttack(f, u, t, a).ok) continue;
        const score = (a.def.hp - topHp(a)) * 10 - hexDistance(t.q, t.r, here.q, here.r) * 0.5;
        if (!best || score > best.score) best = { t, a, score };
      }
      if (best) { await this.execute(u, reach, best.t, best.a); return; }
    }
    // 2. Score every reachable tile by its best attack.
    let best = null;
    for (const t of spots) {
      for (const p of Battle.alive(u.side === 'player' ? 'enemy' : 'player')) {
        const chk = Combat.canAttack(f, u, t, p);
        if (!chk.ok) continue;
        const dmg = Combat.expected(f, u, t, p, chk.cover);
        let score = dmg + (dmg >= p.hp ? 30 : 0) + (p.type === 'lich' || p.def.rank === 'UNIQUE' ? 15 : 0) - 0.5 * hexDistance(t.q, t.r, here.q, here.r);
        if (u.def.range > 1) {
          if (chk.dist >= chk.range) score += 3;                       // stay at maximum range
          if (Combat.lineOfSight(f, f.get(p.q, p.r), t).cover) score += 3;  // in cover against the target
          if (chk.dist === 1) score -= 4;
        }
        if (!best || score > best.score) best = { t, p, score };
      }
    }
    if (best) { u.idleTurns = 0; await this.execute(u, reach, best.t, best.p); return; }
    // 3. No attack: walk toward the nearest undead unit.
    u.idleTurns++;
    if (!canMove && !(isBallista && u.idleTurns >= 2)) return;
    const dest = this.approach(u, reach);
    if (dest && dest !== here) await Battle.moveAlong(u, Pathfinding.path(f, reach, dest));
  },
  allies(u) { return Battle.alive(u.side); },
  async execute(u, reach, tile, target) {
    const b = game.battle, f = b.field;
    if (tile !== f.get(u.q, u.r)) {
      await Battle.moveAlong(u, Pathfinding.path(f, reach, tile));
      await wait(AI_PAUSE);
    }
    if (game.battle === b && !b.over) await Battle.performAttack(u, target);
  },
  // Furthest tile along the shortest path to the nearest undead that the unit can reach this turn.
  approach(u, reach) {
    const f = game.battle.field;
    const targets = Battle.alive(u.side === 'player' ? 'enemy' : 'player');
    // Goals: free tiles from which an attack is actually possible (not merely adjacent,
    // which would include tiles behind a wall, e.g. inside a house next to the target).
    const goalsOf = search => {
      let best = null, bestCost = Infinity;
      for (const [i, c] of search.cost) {
        const t = f.tiles[i];
        if ((t.unit && t.unit !== u) || c >= bestCost) continue;
        if (targets.some(p => Combat.canAttack(f, u, t, p).ok)) { best = t; bestCost = c; }
      }
      return best;
    };
    // First try with units blocking; if allies block the only way out (a door), plan through
    // them and walk up to the first occupied tile, so the unit queues behind its ally.
    for (const ignoreUnits of [false, true]) {
      const full = Pathfinding.search(f, u, 9999, ignoreUnits);
      const goal = goalsOf(full);
      if (!goal) continue;
      const path = Pathfinding.path(f, full, goal);
      let dest = null, cost = 0;
      for (let i = 0; i < path.length; i++) {
        const t = path[i];
        if (i > 0) {
          const d = directionTo(path[i - 1].q, path[i - 1].r, t.q, t.r);
          cost += Pathfinding.stepCost(f, u, path[i - 1], d, t, true);
        }
        if (cost > moveOf(u)) break;
        if (t.unit && t.unit !== u) { if (u.def.flying) continue; break; }
        dest = t;
      }
      if (dest && dest !== f.get(u.q, u.r)) return dest;
    }
    // Fallback: the reachable tile closest to any undead.
    let best = null, bd = Infinity;
    for (const t of reach.tiles) for (const p of Battle.alive(u.side === 'player' ? 'enemy' : 'player')) {
      const d = hexDistance(t.q, t.r, p.q, p.r);
      if (d < bd) { bd = d; best = t; }
    }
    return best;
  }
};

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const UI = {
  selectedNode: null,
  toastTimer: null,

  // kind: chronicle category ('info', 'world', 'battle'); false = do not log (pure UI feedback).
  toast(text, seconds = 3.5, kind = 'info') {

  },
  // World chronicle: every message that vanishes on its own is kept here (c.news, newest last).
  news(text, kind = 'info') {
    const c = game.campaign; if (!c || !text) return;

    if (last && last.t === text && last.d === c.dayCount && last.h === h) return;
    list.push({ d: c.dayCount, h, t: String(text), k: kind });
    if (list.length > 400) list.splice(0, list.length - 400);
    c.newsUnread = (c.newsUnread || 0) + 1;

  },
  newsBadge() {
    const c = game.campaign, b = $('btnNews'); if (!c || !b) return;

  },
  openNews(filter = 'all') {
    const c = game.campaign, list = (c.news || []).map((n, i) => ({ ...n, i })), unreadFrom = list.length - (c.newsUnread || 0);
    const ICON = { info: '✉', battle: '⚔', story: '❦', world: '⚑' };
    const show = list.filter(n => filter === 'all' || n.k === filter).reverse();
    let html = '', day = null;
    for (const n of show) {
      if (n.d !== day) { day = n.d; html += `<div class="newsDay">Tag ${n.d + 1} · ${Campaign.dateString(n.d)}</div>`; }
      html += `<div class="newsItem ${n.i >= unreadFrom ? 'unread' : ''}"><span class="h">${n.h} Uhr</span><span>${ICON[n.k] || '✉'}</span><span>${esc(n.t)}</span></div>`;
    }
    const F = [['all', 'Alles'], ['world', 'Welt'], ['battle', 'Kämpfe'], ['story', 'Erzählung'], ['info', 'Sonstiges']];
    this.modal(`<h2>Chronik</h2><div class="newsFilter">${F.map(([k, n]) => `<button data-nf="${k}" class="${k === filter ? 'on' : ''}">${n}</button>`).join('')}</div>
      ${html || '<p class="small">Noch nichts verzeichnet.</p>'}`, [{ label: 'Schließen', primary: true, action: () => {} }]);
    document.querySelectorAll('[data-nf]').forEach(b => b.onclick = () => this.openNews(b.dataset.nf));
    c.newsUnread = 0; this.newsBadge();
  },
  modal(html, buttons) {
    $('modalBody').classList.remove('wide','hb-build-modal','hb-recruit-modal','hb-inventory-modal');
    $('modalBody').innerHTML = html + '<div class="buttons"></div>';
    const box = $('modalBody').querySelector('.buttons');
    for (const b of buttons) {
      const el = document.createElement('button');
      el.textContent = b.label; if (b.primary) el.className = 'primary';

      box.appendChild(el);
    }
    // A close cross at the top as well (same as the cancel/close button, or the only button).
    const cancel = buttons.find(b => /^(Schließen|Abbrechen|Weiterkämpfen|Nein|Zurück)/.test(b.label)) || (buttons.length === 1 ? buttons[0] : null);
    if (cancel) {
      const x = document.createElement('button'); x.className = 'modalClose'; x.textContent = '×'; x.title = cancel.label;
      x.onclick = () => { if (!cancel.keepOpen) this.closeModal(); cancel.action && cancel.action(); };
      $('modalBody').prepend(x);

    this.show('modal', true);
  },
  closeModal() { this.show('modal', false); },

  // ---- World map ----------------------------------------------------------
  enterWorld() {
    Sfx.ambience('world');
    ['header', 'info', 'sidebar', 'minimap', 'worldButtons', 'armyPanel'].forEach(id => this.show(id, true));
    ['initBar', 'roundInfo', 'unitCard', 'hoverCard', 'battleLog', 'battleButtons', 'battleBar', 'edgeTip', 'hint'].forEach(id => this.show(id, false));
    this.lastHours = null;
    this.updateHeader();
    this.renderInfo();
  },
  updateHeader() {
    const c = game.campaign, h = Campaign.hour(), T = TIMES[Campaign.timeIndex(h)];
    // Time: days since the awakening first, the calendar date only small.
    const day = c.dayCount + 1, weeks = Math.floor(c.dayCount / 7), rest = c.dayCount % 7;
    const phaseStarts = [[22, 'Nacht'], [4, 'Morgen'], [10, 'Tag'], [16, 'Abend']];
    const next = phaseStarts.map(([t, n]) => [n, (t - h + 24) % 24 || 24]).sort((x, y) => x[1] - y[1])[0];
    $('dial').innerHTML = this.dialSvg(h);
    $('dayNo').textContent = `Tag ${day}`;
    $('dayNo').title = `Seit dem Erwachen: ${weeks ? `${weeks} ${weeks === 1 ? 'Woche' : 'Wochen'}${rest ? ', ' : ''}` : ''}${rest || !weeks ? `${rest} ${rest === 1 ? 'Tag' : 'Tage'}` : ''}.`;
    $('clock').innerHTML = `${h} Uhr · <b>${T.name}</b> <span class="small">· ${next[0]} in ${next[1]} Std.</span>`;
    $('date').textContent = Campaign.dateString(c.dayCount);
    $('status').title = `${T.name}. Kämpfe beginnen zur aktuellen Tageszeit: nachts sind die Toten stärker und schwerer zu sehen, morgens liegt Nebel.`;
    this.flashTime(c.dayCount * 24 + h);
    const r = c.resources;
    const tip = k => esc(this.resourceTip(k)).replace(/\n/g, '&#10;');
    const used = Campaign.commandUsed(), lim = Campaign.commandLimit();
    const chip = (k, v, lbl, cls = '') => `<span class="chip ${cls}" title="${tip(k)}">${resIcon(k, 18)}<b>${v}</b> <span class="lbl">${lbl}</span></span>`;
    $('resources').innerHTML = chip('corpses', r.corpses, 'Leichen') + chip('bones', r.bones, 'Knochen') + chip('souls', r.souls, 'Seelen')
      + chip('knowledge', r.knowledge, 'Wissen') + chip('command', `${used}/${lim}`, 'Kommando', used >= lim ? 'full' : '');
    this.buildBadge(); this.newsBadge();
    this.updateRecruitDestination();
    const localRecruit = $('btnRecruitLocal');
    if (localRecruit) { const can = game.mode === 'world' && Recruitment.canRecruitAt(Campaign.armyNode()); localRecruit.disabled = !can; localRecruit.title = can ? `In ${Campaign.armyNode().name} rekrutieren` : 'Nur an eroberten Rekrutierungsorten möglich; Karte: » Grabstätte'; }
    // Threat: one chip (mini bars + the highest faction), the full list on click.
    const list = ENEMY_FACTIONS.map(f => ({ f, v: Math.round(c.threat[f] || 0), living: Campaign.isLiving(f) })).sort((x, y) => (y.living - x.living) || (y.v - x.v));
    const top = list.find(x => x.living), warned = list.filter(x => x.living && x.v >= 50);
    $('threatChip').classList.toggle('warn', warned.length > 0);
    $('threatChip').innerHTML = `<span class="mini">${list.filter(x => x.living).map(x => `<i style="height:${Math.max(2, x.v / 5)}px;background:${DATA.factions[x.f].color}"></i>`).join('')}</span>
      ${warned.length ? `⚠ ${warned.length} alarmiert` : top ? `Fraktionen · ${top.v} %` : 'Fraktionen'}`;
    if (!$('threatPop').classList.contains('hidden')) this.renderThreats();
  },
  // Threat list: threat bar and a strength bar (living troops in all places and war parties of the faction).
  renderThreats() {
    const c = game.campaign, troops = {}, full = {};
    for (const n of DATA.nodes) {
      if (!n.faction || n.type === 'PHYLACTERY') continue;
      const base = Object.values(n.garrison || {}).reduce((a, x) => a + x, 0);
      full[n.faction] = (full[n.faction] || 0) + base;
      // Original strength only: threat reinforcements and pantheon bonuses do not count above it.
      const o = Campaign.owner(n);
      if (o !== 'UNDEAD') troops[o] = (troops[o] || 0) + Math.min(base, Campaign.garrisonFor(n).length);
    }
    for (const r of Raids.list()) troops[r.faction] = (troops[r.faction] || 0) + Object.values(r.garrison).reduce((a, x) => a + x, 0);
    const list = ENEMY_FACTIONS.map(f => ({ f, v: Math.round(c.threat[f] || 0), living: Campaign.isLiving(f) })).sort((x, y) => (y.living - x.living) || (y.v - x.v));
    $('threats').innerHTML = list.map(({ f, v, living }) => {
      const t = troops[f] || 0, m = full[f] || 1, pct = Math.min(100, Math.round(t / m * 100));
      return `<div class="threat ${living ? '' : 'dead'} ${living && v >= 50 ? 'hot' : ''}" data-fac="${f}">
        <span class="threatName" style="--faction:${DATA.factions[f].color}">${esc(DATA.factions[f].name)}</span>
        <span class="threatRisk" title="Bedrohung"><strong>${living ? v + ' %' : '†'}</strong> <em>${!living ? 'Besiegt' : v >= 50 ? 'Alarmiert' : v >= 25 ? 'Wachsam' : 'Ruhig'}</em></span>
        <span class="threatSoldiers" title="Verbliebene Truppen">⚔ ${t.toLocaleString('de-DE')} / ${m.toLocaleString('de-DE')} Truppen</span>
        </div>`;
    }).join('');
    // Hover: all places (and war parties) of the faction blink on the minimap.
    $('threats').querySelectorAll('[data-fac]').forEach(el => {

  // 24-hour dial: the four times of day as coloured arcs, a hand for the hour.
  dialSvg(h) {
    const R = 17, C = 20, pt = (hr, r) => { const a = (hr / 24) * 2 * Math.PI - Math.PI / 2; return [C + r * Math.cos(a), C + r * Math.sin(a)]; };
    const arc = (h0, h1, col) => { const [x0, y0] = pt(h0, R), [x1, y1] = pt(h1, R), large = ((h1 - h0 + 24) % 24) > 12 ? 1 : 0;
      return `<path d="M${C},${C} L${x0.toFixed(1)},${y0.toFixed(1)} A${R},${R} 0 ${large} 1 ${x1.toFixed(1)},${y1.toFixed(1)} Z" fill="${col}"/>`; };
    const [hx, hy] = pt(h, R - 2);
    return `<svg width="40" height="40" viewBox="0 0 40 40">${arc(22, 4, '#2c3458')}${arc(4, 10, '#c8b8a0')}${arc(10, 16, '#e8c860')}${arc(16, 22, '#c07848')}
      <circle cx="${C}" cy="${C}" r="${R}" fill="none" stroke="#2b2116" stroke-width="1.2"/><line x1="${C}" y1="${C}" x2="${hx.toFixed(1)}" y2="${hy.toFixed(1)}" stroke="#2b2116" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="${C}" cy="${C}" r="2.4" fill="#2b2116"/></svg>`;
  },
  // Shows how much time an action took ("+2 T. 5 Std.") next to the clock.
  flashTime(total) {

    const D = Math.floor(this.deltaHours / 24), H = this.deltaHours % 24, el = $('timeDelta');
    el.textContent = `+${D ? D + ' T.' : ''}${D && H ? ' ' : ''}${H || !D ? H + ' Std.' : ''}`;
    el.classList.add('on'); clearTimeout(this.deltaTimer);

  },
  togglePop(id) {

    else $(id).style.left = Math.max(8, a.left) + 'px';
  },
  openHelp() {
    const row = (k, t) => `<tr><td><kbd>${k}</kbd></td><td>${t}</td></tr>`;
    this.modal(`<h2>Steuerung</h2><h3>Weltkarte</h3><table>${row('W A S D', 'Kamera bewegen (oder Maus an den Rand)')}${row('Q E / rechte Maus', 'drehen und neigen')}${row('Mausrad', 'Zoom')}
      ${row('Klick', 'Ort, Trupp oder Gelände auswählen')}${row('H', 'Hügelgrab')}${row('R', 'nächster Ort zum Rekrutieren')}${row('B', 'Bauen')}${row('I', 'Inventar')}${row('N', 'Chronik der Weltereignisse')}${row('G', 'Los (Befehle mehrerer Armeen)')}${row('Leertaste halten', 'Reise beschleunigen')}</table>
      <h3>Kampf</h3><table>${row('Klick', 'bewegen, angreifen, auswählen')}${row('1–4', 'Fähigkeiten')}${row('Leertaste', 'Zug beenden')}${row('R', 'Rückzug')}${row('T', 'Feldkanten')}${row('K', 'Token-Modus')}</table>
      <h3>Allgemein</h3><table>${row('Esc', 'Fenster schließen, Auswahl aufheben')}${row('M', 'Ton an/aus')}${row('F3', 'Debug-Fenster')}</table>`, [{ label: 'Schließen', primary: true, action: () => {} }]);
  },
  // Build button: a running construction shows its days left, otherwise a dot when something can be started.
  buildBadge() {
    const c = game.campaign, btn = $('btnBuild'); if (!c || !btn) return;

          ${atNode ? '' : (() => { const risk = Campaign.travelRisk(here, node);
            return `<tr><td>Hinterhalt</td><td>${Math.round(risk.chance * 100)} % <span class="small">(${risk.places.length} unbesiegte Orte am Weg)</span></td></tr>`; })()}
          <tr><td>Besatzung</td><td>${garrison}${enemy && Campaign.recovery(node) < 1 ? `<br><span class="small">${(c.weakened || {})[node.id] && !(c.retaken || {})[node.id] ? 'Ein Trupp ist ausgezogen, die Besatzung füllt sich auf' : 'Zurückerobert, erholt sich'}: ${Math.round(Campaign.recovery(node) * 100)} % (voll in ${Math.ceil((1 - Campaign.recovery(node)) / (1 - DATA.recovery.startShare) * Campaign.recoveryDays(node))} Tagen)</span>` : ''}${enemy && (c.plundered || {})[node.id] && Object.keys(node.garrison).some(t => DATA.units[t].rank === 'UNIQUE') ? '<br><span class="small">Der Anführer ist gefallen und kehrt nicht zurück.</span>' : ''}</td></tr>
          ${enemy ? `<tr><td>Beute</td><td>${this.rewardText(node)}</td></tr>` : ''}
          ${node.special ? `<tr><td>Besonderheit</td><td>${this.specialText(node)}</td></tr>` : ''}
          ${Pantheons.infoRow(node)}
          ${Garrisons.infoRow(node)}
          ${Stranded.of(node).length ? `<tr><td>Verwaist</td><td><b>${Stranded.of(node).length} Untote</b> warten hier auf den Lich</td></tr>` : ''}
        </table>
        <details ${this.infoDetails ? 'open' : ''}><summary>Mehr zum Ort</summary><table>
          <tr><td>Kampffeld</td><td>${node.size} × ${node.size} Felder</td></tr>
          ${enemy ? `<tr><td>Bedrohung</td><td>${thr} % <span class="small">(ab 50 % gewarnt)</span></td></tr>` : ''}
        </table>${node.desc ? `<p class="small">${esc(node.desc)}</p>` : ''}</details>`;
    } else if (node) {
      html += `<h2>Unbekannter Ort</h2><p class="small">Zu weit entfernt. Orte werden sichtbar, wenn die Armee, das Hügelgrab oder ein eroberter Ort höchstens ${REVEAL_DISTANCE} Felder entfernt ist.</p>`;
    } else if (this.selectedTile) {
      const [q, r] = this.selectedTile, w = game.world;
      html += `<h2>Gelände</h2><table>
        <tr><td>Feld</td><td>${q}, ${r}</td></tr>
        <tr><td>Boden</td><td>${DATA.floorTypes[w.floorKeyAt(q, r)].name}</td></tr>
        <tr><td>Höhe</td><td>${w.metersAt(q, r).toFixed(0)} m (Stufe ${w.levelAt(q, r)})</td></tr></table>`;
    }
    // Nothing selected: no panel. A selection gets a close button.
    this.show('info', !!html);
    if (!html) { el.innerHTML = ''; return; }
    el.innerHTML = '<button class="close" title="Schließen (Esc)">×</button>' + html;
    el.querySelector('.close').onclick = () => this.clearSelection();
    const det = el.querySelector('details'); if (det) det.ontoggle = () => { this.infoDetails = det.open; };
    const rb = $('raidButtons');
    if (rb && raid) {
      const b = document.createElement('button'); b.textContent = 'Abfangen'; b.className = 'primary';
      b.disabled = game.mode !== 'world'; b.onclick = () => { this.selectedRaid = null; Raids.intercept(raid); }; rb.appendChild(b);
    }
    const bx = $('nodeButtons');
    if (bx && node) {
      const add = (label, fn, primary, disabled) => {
        const b = document.createElement('button');
        b.textContent = label; if (primary) b.className = 'primary'; b.disabled = !!disabled || game.mode !== 'world';
        b.onclick = fn; bx.appendChild(b);
      };
      const exps = Expeditions.list(), act = Expeditions.active();
      if (!exps.length) {
        if (here.id !== node.id) add('Hierher ziehen', () => startTravel(node), true);
        else if (Campaign.isEnemy(node)) add('Angreifen', () => Battle.start(node), true);
      } else {
        // Several armies: orders first, then "Los".
        if (act.node.id !== node.id) add(act.order === node.id ? `Befehl aufheben (${act.label})` : `Befehl: ${act.label} hierher (${Expeditions.days(act.army, act.node, node)} T.)`,
          () => Expeditions.setOrder(act.id, act.order === node.id ? null : node), true);
        if (Campaign.isEnemy(node)) {
          if (here.id === node.id) add('Angreifen (Lich)', () => Battle.start(node), true);
          for (const e of exps) if (e.nodeId === node.id) add(`Angreifen (${Expeditions.name(e)})`, () => Battle.start(node, e), true);
        }
        for (const e of exps) if (e.nodeId === node.id && here.id === node.id) add(`${Expeditions.name(e)} vereinen`, () => Expeditions.merge(e), false);
      }
      if (here.id === node.id && Recruitment.canRecruitAt(node) && (Base.level('deadHall') >= 1 || game.campaign.army.some(u => DATA.units[u.type].ancestor))) add('Expedition aufstellen', () => Expeditions.openCreate(), false, !!Expeditions.canCreate());
      if (here.id === node.id && Recruitment.canRecruitAt(node)) add('Rekrutieren', () => this.openRecruit(), true);
      if (here.id === node.id && Pantheons.isLeyNode(node)) add('Ley-Sprung', () => Pantheons.openJump(), false);
      if (Garrisons.canGarrison(node)) add('Besatzung zurücklassen', () => Garrisons.openLeave(node), false);
      if (Garrisons.canGarrison(node) && Garrisons.of(node).length) add('Besatzung aufnehmen', () => Garrisons.takeBack(node), false);
      if (here.id === node.id && Pantheons.portalPossible(node)) add(`Portal errichten (${Object.entries(LEY.portalCost).map(([k, v]) => v + ' ' + RESOURCE_NAMES[k]).join(', ')}, ${LEY.portalDays} Tage)`, () => Pantheons.buildPortal(node), true, !!Pantheons.portalBlocker());
      if (here.id === node.id && node === PHYLACTERY) add('Bauen', () => Base.open(), true);
      if (here.id === node.id && Stranded.of(node).length) add(`Verwaiste aufnehmen (${Stranded.of(node).length})`, () => Stranded.pickUp(node), true);
    }
  },
  openRecruit() {
    const c = game.campaign, place = Recruitment.site();
    const allow = RECRUIT_AT[place.type];
    const siege = (t,u) => u.role === 'SIEGE' || u.size >= 4 || t === 'huenenkoenig';
    const category = (t,u) => siege(t,u) ? 'siege' : (u.range > 1 ? 'ranged' : 'melee');
    const CATS = [['melee','⚔ Nahkampf'],['ranged','⌖ Fernkampf'],['siege','♜ Belagerung']];
    this.recruitCat = CATS.some(([k])=>k===this.recruitCat) ? this.recruitCat : 'melee';
    const all = Object.entries(DATA.units).filter(([t,u])=>u.side==='undead' && t!=='lich' && !u.ancestor && (!allow || allow.includes(t)));
    const entries = all.filter(([t,u])=>category(t,u)===this.recruitCat);
    const requirement = (t,u) => {
      if(u.requiresPantheon && !Pantheons.assimilated(u.requiresPantheon)) return 'Pantheon stürzen: '+DATA.pantheons[u.requiresPantheon].name;
      if(!Knowledge.known(t)) return 'Wissen: '+(u.requiresKnowledge||0)+' erforderlich';
      const p=Base.producer(t);
      if(p && Base.level(p.k)<p.level) return DATA.baseBuildings[p.k].name+' Stufe '+p.level+' erforderlich';
      if(u.requiresPantheon && !Base.level('knowledgeAltar')) return 'Wissensaltar erforderlich';
      return Recruitment.blocker(t) || '';
    };
    if(!entries.some(([t])=>t===this.recruitSelected)) this.recruitSelected = (entries.find(([t])=>Knowledge.known(t))||entries[0]||[])[0];
    const selected = entries.find(([t])=>t===this.recruitSelected) || entries[0];
    const tabs = CATS.map(([k,title])=>`<button data-rcat="${k}" class="${this.recruitCat===k?'active':''}">${title} <span>${all.filter(([t,u])=>category(t,u)===k).length}</span></button>`).join('');
    const cards = entries.map(([t,u])=>{
      const need=requirement(t,u),unknown=!Knowledge.known(t),ready=!need,visible=!!u;
      return `<button class="unitTile ${t===this.recruitSelected?'selected':''} ${unknown?'unknown':need?'unavailable':'ready'}" data-unit="${t}" title="${esc(u.name)}${need?' · '+esc(need):''}" aria-pressed="${t===this.recruitSelected}">
        ${portraitHtml(t,u)}<span class="unitTileName">${esc(u.name)}</span>
        ${need ? `<small>♙ ${esc(need)}</small>`: '<small class="unitReady">Bereit</small>'}</button>`;
    }).join('');
    let detail = '<p>In dieser Gattung sind an diesem Ort keine Einheiten vorhanden.</p>';
    if(selected){
      const [t,u]=selected,need=requirement(t,u),unknown=!Knowledge.known(t),max=Recruitment.maxAffordable(t);
      const stat = (ico,label,v)=>`<div class="recruitStat" title="${label}">${window.HARMBRINGER_UI_ART ? HARMBRINGER_UI_ART.stat(ico) : '◆'}<span>${label}</span><b>${esc(String(v))}</b></div>`;
      detail = `<div class="recruitSelectedHead">${portraitHtml(t,u)}<div><h3>${esc(u.name)}</h3><small>${u.range>1?'Fernkampf':'Nahkampf'} · ${u.commandPoints<0?'Anführer':'Kommando '+u.commandPoints}</small><p>${esc(u.desc||'')}</p></div></div>
      <div class="recruitStats">${stat('hp','Lebenspunkte',u.hp)}${stat('damage','Schaden',u.damage+' '+POWER_NAMES[u.power])}
      ${stat('initiative','Initiative',u.initiative)}${stat('move','Bewegung',u.move)}
      ${stat('range','Reichweite',u.range)}${stat('armor','Rüstung',DEFENSE_NAMES[u.defense])}</div>
      <div class="recruitCost"><b>Kosten je Einheit</b><span>${costHtml(u.cost,c.resources)}</span></div>
      ${need ? `<div class="recruitRequirement">${unknown?'Noch nicht entdeckt. ':''}${esc(need)}</div>` : ''}
      <div class="recruitPurchase"><label>Anzahl <input data-recruit-qty type="number" min="1" max="${Math.max(1,max)}" value="1" ${need?'disabled':''}></label>
      <button data-qty="1" ${need?'disabled':''}>+1</button><button data-qty="10" ${need?'disabled':''}>+10</button>
      <button data-recruit="${t}" class="primary" ${need?'disabled':''}>Rekrutieren</button><small>Maximal ${max}</small></div>`;
    }
    this.modal(`<div class="screenTitle"><span>☠</span><h2>${esc(place.name)} – Rekrutieren</h2><span>☠</span></div>
      <div class="stickyRes">${resSummary(c.resources)} <span class="cost">${resIcon('command')}${Campaign.commandUsed()} / ${Campaign.commandLimit()}</span></div>
      <nav class="recruitTabs" aria-label="Truppengattung">${tabs}</nav>
      <div class="recruitScreen"><section class="unitGrid" aria-label="Einheiten">${cards||'<p>Keine Einheiten in dieser Gattung.</p>'}</section>
      <section class="recruitInspector" aria-label="Einheitendetails">${detail}</section></div>
      <p class="screenFoot">Ausgegraute Truppen können durch Wissen, Gebäude oder Pantheons freigeschaltet werden.</p>`,
      [{label:'Schließen',primary:true,action:()=>{Recruitment.remote=false;this.renderInfo();this.updateHeader();}}]);
    $('modalBody').classList.add('wide','hb-recruit-modal');
    $('modalBody').querySelectorAll('[data-rcat]').forEach(b=>b.onclick=()=>{this.recruitCat=b.dataset.rcat;this.recruitSelected=null;this.openRecruit();});
    $('modalBody').querySelectorAll('[data-unit]').forEach(b=>b.onclick=()=>{this.recruitSelected=b.dataset.unit;this.openRecruit();});
    const qty=$('modalBody').querySelector('[data-recruit-qty]');
    $('modalBody').querySelectorAll('[data-qty]').forEach(b=>b.onclick=()=>{if(qty) qty.value=Math.min(Math.max(1,+qty.value||1)+Number(b.dataset.qty),Math.max(1,Recruitment.maxAffordable(this.recruitSelected)));});
    const recruitBtn=$('modalBody').querySelector('[data-recruit]');
    if(recruitBtn) recruitBtn.onclick=()=>{
      const t=recruitBtn.dataset.recruit,max=Recruitment.maxAffordable(t),want=Math.min(max,Math.max(1,Math.floor(Number(qty.value)||1)));
      const n=Recruitment.recruitMany(t,want);
      if(n){this.toast(n===1?DATA.units[t].name+' erhebt sich.':n+' × '+DATA.units[t].name+' erhoben.');
        this.updateHeader();this.renderInfo();this.openRecruit();}
    };
  },
  showEnd() {
    const c = game.campaign;
    const conquered = DATA.nodes.filter(n => Campaign.isConquered(n)).length;
    game.mode = 'end';
    this.modal(`<h2>Der Brocken ist gefallen</h2>
      <p>Auf dem mächtigsten Ley-Knoten Norddeutschlands schweigt der Hexensabbat. Der Lich trinkt die Kraft der Walpurgisnacht, und über das Land legt sich ein langer Schatten.</p>
      <table><tr><td>Vergangene Tage</td><td>${c.dayCount}</td></tr><tr><td>Kämpfe</td><td>${c.battles}</td></tr>
      <tr><td>Eroberte Orte</td><td>${conquered} von ${DATA.nodes.length - 1}</td></tr><tr><td>Datum</td><td>${Campaign.dateString(c.dayCount)}</td></tr></table>`,
      [{ label: 'Neues Spiel', primary: true, action: () => newGame() }, { label: 'Weiter umherziehen', action: () => { game.mode = 'world'; } }]);
  },

  // ---- Battle -------------------------------------------------------------
  enterBattle() {
    Sfx.ambience('battle');
    ['header', 'info', 'sidebar', 'threatPop', 'menuPop'].forEach(id => this.show(id, false));
    ['initBar', 'roundInfo', 'unitCard', 'battleLog', 'battleButtons', 'battleBar'].forEach(id => this.show(id, true));
    $('battleLog').innerHTML = ''; $('battleLog').classList.remove('open');
    $('btnEdges').classList.toggle('on', !!game.showEdges);
  },
  appendLog(text, cls) {
    const p = document.createElement('p');
    if (cls) p.className = cls;
    p.textContent = text;
    $('battleLog').appendChild(p);
    $('battleLog').scrollTop = 1e9;
  },
  updateBattle() {
    const b = game.battle;
    if (!b) return;
    const fr = Battle.forecastRounds(12), list = fr.map(x => x.u);
    $('initBar').innerHTML = fr.map(({ u, round }, i) => {
      const sep = i > 0 && round !== fr[i - 1].round ? `<div class="initRound" title="Ab hier beginnt Runde ${round}">Runde<br><b>${round}</b></div>` : '';
      return sep + (() => {
      const border = u.side === 'player' ? DATA.factions.UNDEAD.color : DATA.factions[u.faction].color, pic = PORTRAITS[u.type];
      const st = Object.keys(u.status || {}).map(k => STATUS_ICONS[k] || '').join('');
      return `<div class="initSlot ${i === 0 ? 'current' : ''} ${u.side === 'player' ? 'player' : 'enemy'}" data-uid="${u.id}" style="opacity:${Math.max(0.45, 1 - i * 0.06)}">
        <div class="pic" style="border-color:${border};background-color:${pic ? '#3a332a' : u.def.color};${pic ? `background-image:url(${pic})` : ''}">${stackCount(u) > 1 ? `<span class="cnt">${stackCount(u)}</span>` : ''}</div>
        <div class="nm">${esc(u.def.name)}</div><div class="st">${st}</div><div class="hpbar ${u.side === 'player' ? 'player' : ''}"><div style="width:${100 * u.hp / u.maxHp}%"></div></div>
        ${i === 0 && u.def.energy ? `<div class="en" title="Energie ${u.energy}/${u.def.energy}"><div style="width:${100 * u.energy / u.def.energy}%"></div></div>` : ''}</div>`;
      })();
    }).join('');
    // Hover over a portrait highlights the unit on the field (ring) and shows its card.
    $('initBar').querySelectorAll('[data-uid]').forEach(el => {
      const u = b.units.find(x => x.id === +el.dataset.uid); if (!u) return;
      el.onmouseenter = () => { if (!u.view) return; BattleView.hoverRing(u); this.renderHoverCard(u); };
      el.onmouseleave = () => { BattleView.hoverRing(null); this.renderHoverCard(null); };
      el.onclick = () => { if (u.view) game.view.cam.lookAtTile(u.q, u.r, false); };
    });
    const cur = b.current;
    const who = !cur ? '' : cur.side === 'player' ? `Am Zug: ${cur.def.name}` : `Gegner am Zug: ${cur.def.name}`;
    const T = TIMES[b.time], left = ROUNDS_PER_TIME - ((b.round - 1) % ROUNDS_PER_TIME);
    const myNext = fr.findIndex((x, i) => i > 0 && x.u.side === 'player');
    $('roundInfo').innerHTML = `Runde ${b.round} · <span title="${T.name}: Untote ${Math.round((T.undead - 1) * 100)} %, Lebende ${Math.round((T.living - 1) * 100)} % Schaden, Sicht der Gegner ${T.sight >= 0 ? '+' : ''}${T.sight}${T.foggy ? ', Nebel: Fernkampf −1 Reichweite' : ''}. Wechsel in ${left} ${left === 1 ? 'Runde' : 'Runden'}.">${T.name}${T.foggy ? ' (Nebel)' : ''}</span> · <span title="Gegen den Wind riechen die Lebenden die Toten weiter, mit dem Wind kaum.">Wind aus ${DIR_NAMES[(b.wind + 3) % 6]}</span> · ${b.state === 'stealth' ? 'Schleich-Modus · ' : ''}<b>${esc(who)}</b>${cur && cur.side !== 'player' && myNext > 0 ? ` · deine nächste Einheit in ${myNext} ${myNext === 1 ? 'Zug' : 'Zügen'}` : ''}${b.retreatPending ? ' · Rückzug befohlen' : ''}`;
    this.renderUnitCard(b.selected || cur);
    const myTurn = cur && cur.side === 'player' && !b.busy && !b.over;
    $('btnEndTurn').disabled = !myTurn;
    const bar = $('abilityBar');
    if (myTurn) {
      bar.innerHTML = Abilities.actives(cur).map(([id, a], i) => {
        const block = Abilities.blocker(cur, id);
        return `<button data-ab="${id}" class="${b.abilityMode === id ? 'active' : ''}" ${block ? 'disabled' : ''} title="${esc(a.name)} (Taste ${i + 1}): ${esc(a.desc || '')}${a.energy ? ` · Energie ${a.energy}` : ''}${a.cooldown ? ` · Abklingzeit ${a.cooldown}` : ''}${block ? ' – ' + block : ''}">${esc(a.name)}${a.energy ? ` <span class="small">(${a.energy})</span>` : ''}</button>`;
      }).join('');
      bar.querySelectorAll('[data-ab]').forEach(x => x.onclick = () => Battle.chooseAbility(x.dataset.ab));
    } else bar.innerHTML = '';
    $('btnRetreat').disabled = b.retreatPending || b.over || b.auto;
    const wd = this.canWithdrawCached !== undefined && this.cwRound === b.round && this.cwContact === !!b.contact ? this.canWithdrawCached : (this.cwRound = b.round, this.cwContact = !!b.contact, this.canWithdrawCached = Battle.canWithdraw());
    $('btnRetreat').innerHTML = (wd ? 'Abziehen' : 'Rückzug') + '<kbd>R</kbd>';
    $('btnRetreat').title = wd ? 'Abziehen (R): Die ganze Armee verlässt das Feld ohne Verluste – möglich, solange nicht gekämpft wurde oder kein Gegner erreichbar ist. Keine Beute.'
      : 'Rückzug (R): Zu Beginn des nächsten Lich-Zugs löst sich die Armee vom Feind und bleibt vor dem Ort stehen. Ein Viertel jeder Truppe fällt als Nachhut, Lich und Kommandeure entkommen. Keine Beute, der Ort bleibt in Feindeshand. Bis dahin wird weiter gekämpft.';
    // The chronicle takes the space left of the action buttons.
    document.body.style.setProperty('--logRight', ($('battleButtons').offsetWidth + 26) + 'px');
    if (cur && cur.alive) {
      BattleView.ring.visible = true;
      BattleView.ring.position.copy(cur.view.group.position).add(new THREE.Vector3(0, 0.45, 0));
    }
  },
  // Card of the hovered unit, above the card of the own/selected unit (more room than next to the cursor).
  renderHoverCard(u) {
    const el = $('hoverCard'), b = game.battle;
    if (!u || !b || u === (b.selected || b.current)) { el.classList.add('hidden'); this.hoverUnit = null; return; }
    if (this.hoverUnit === u && !el.classList.contains('hidden') && this.hoverHp === u.hp) return;
    this.hoverUnit = u; this.hoverHp = u.hp;
    this.renderUnitCard(u, 'hoverCard');
    el.insertAdjacentHTML('afterbegin', '<div class="hcTag">Unter der Maus</div>');
    const uc = $('unitCard').getBoundingClientRect();
    el.style.bottom = Math.round(window.innerHeight - uc.top + 8) + 'px';
    el.classList.remove('hidden');
  },
  renderUnitCard(u, target = 'unitCard') {
    if (!u) return;
    const d = u.def, b = game.battle, t = b.field.get(u.q, u.r);
    const flags = [d.flying && 'fliegt', d.spectral && 'spektral', d.counter && 'Konter'].filter(Boolean).join(', ');
    const n = stackCount(u);
    const st = (ic, v, tip) => `<span class="st" title="${tip}">${ic} ${v}</span>`;
    const mark = u.side === 'enemy' && u.alert ? { unaware: ' · <i>ahnungslos</i>', suspicious: ' · <b style="color:#a07a00">misstrauisch</b>', alarmed: ' · <b style="color:var(--blood)">alarmiert</b>' }[u.alert] : '';
    $(target).innerHTML = `${portraitHtml(u.type, d)}<h3 style="margin:0">${n > 1 ? n + '× ' : ''}${esc(d.name)}</h3>
      <div class="small">${u.side === 'player' ? 'Untote' : DATA.factions[u.faction].name}${n !== u.startCount ? ` · ${n} von ${u.startCount}` : ''}${mark}</div>
      <div class="hpbar ${u.side === 'player' ? 'player' : ''}" style="margin-top:4px" title="Lebenspunkte gesamt"><div style="width:${100 * u.hp / u.maxHp}%"></div></div>
      <div class="small">LP ${Math.max(0, u.hp)} / ${u.maxHp}${n > 1 ? ` · vorderste ${n ? topHp(u) : 0} / ${d.hp}` : ''}${d.energy ? ` · Energie ${u.energy} / ${d.energy}` : ''}</div>
      <div class="ucStats">${st('⚔', d.damage + (n > 1 ? ` ×${n}` : ''), `Schaden ${d.damage}${n > 1 ? ` × ${n} = ${d.damage * n}` : ''}, ${POWER_NAMES[d.power]}`)}${st(d.range > 1 ? '➶' : '✊', d.range, 'Reichweite')}${st('👣', d.move, 'Bewegung')}${st('⚡', d.initiative, 'Initiative')}
        ${st('🛡', DEFENSE_NAMES[d.defense], 'Rüstung')}${d.magicResist ? st('✧', d.magicResist, 'Magieresistenz (5 % je Punkt)') : ''}${d.soulShield ? st('⛨', `${u.shield ?? d.soulShield}/${d.soulShield * u.startCount}`, 'Seelenschild') : ''}</div>
      <div class="ucRow"><span>Sinne</span> 👁 ${d.sight} · 👂 ${d.hear} · 👃 ${d.smell}${flags ? ' · ' + flags : ''}</div>
      ${Abilities.statusHtml(u) ? `<div class="ucRow"><span>Zustand</span> ${Abilities.statusHtml(u)}</div>` : ''}
      ${(d.abilities || []).length ? `<div class="ucRow"><span>Fähigkeiten</span> ${d.abilities.map(id => DATA.abilities[id]).filter(Boolean).map(a => `<span title="${esc(a.desc || '')}" style="border-bottom:1px dotted">${esc(a.name)}</span>`).join(', ')}</div>` : ''}
      <div class="ucRow"><span>Feld</span> ${DATA.floorTypes[t.floor].name}, Stufe ${t.level}${t.building !== null ? ' · ' + b.field.buildings[t.building].name : ''}${(() => { const e = DATA.floorTypes[t.floor].effect || {};
        return u.def.flying ? '' : e.damageUndeadPerRound ? ` · Untote −${e.damageUndeadPerRound} LP/Runde` : e.healUndeadPerRound ? ` · Untote +${e.healUndeadPerRound} LP/Runde` : ''; })()}</div>`;
  }
};

// Input

function setMouse(ev) {
  game.input.mouse.set(ev.clientX / window.innerWidth * 2 - 1, -(ev.clientY / window.innerHeight) * 2 + 1);
  game.view.raycaster.setFromCamera(game.input.mouse, game.view.camera);
}
function pickUnit() {
  const b = game.battle;
  const meshes = [];
  for (const u of b.units) if (u.alive) u.view.group.traverse(o => { if (o.isMesh) meshes.push(o); });
  const hit = game.view.raycaster.intersectObjects(meshes, false)[0];
  return hit ? b.units.find(u => u.id === hit.object.userData.unitId) : null;
}
function onLeftClick(ev) {
  setMouse(ev);
  if (game.mode === 'world') {
    const pillars = Object.values(game.view.nodeViews).map(v => v.pillar);
    const hit = game.view.raycaster.intersectObjects(pillars, false)[0];
    if (hit) { UI.selectNode(hit.object.userData.nodeId); return; }
    const t = game.view.terrain.pick(game.view.raycaster);
    if (t) {
      const near = DATA.nodes.find(n => n.q === t.q && n.r === t.r);
      if (near) { UI.selectNode(near.id); return; }
      UI.selectedNode = null; UI.selectedTile = [t.q, t.r]; WorldView.refresh(); UI.renderInfo();
    }
    return;
  }
  if (game.mode !== 'battle') return;
  const b = game.battle;
  if (!b || b.over) return;
  const unit = pickUnit();
  if (b.debugKill && unit) {
    b.debugKill = false; Battle.log(`Debug: ${unit.def.name} getötet.`);
    Battle.applyDamage(unit, unit.hp + (unit.shield || 0) + 1, unit.side === 'enemy' ? b.units.find(x => x.side === 'player' && x.alive) : null, 'BLUNT');
    Debug.tools(true); if (!b.over && b.current && b.current.side === 'player' && !b.busy && b.current.alive) Battle.computeOptions();
    return;
  }
  // Breakable edge under the mouse (walls, gates, palisades) – when the current unit can hit it.
  const me = b.current;
  if (!unit && me && me.side === 'player' && !b.busy && !b.abilityMode) {
    const eh = game.view.raycaster.intersectObjects(BattleView.edgeMeshes.filter(m => m.parent && m.userData.edge.kind), false)[0];
    if (eh) {
      const e = eh.object.userData.edge, et = b.field.get(e.q, e.r), key = et && b.field.edgeKey(et, e.d);
      const x = (b.edgeTargets || []).find(y => y.key === key) || (b.edgeApproach && b.edgeApproach.get(key));
      if (x) { Battle.attackEdge(x); return; }
    }
  }
  let tile = null;
  if (unit) tile = b.field.get(unit.q, unit.r);
  else { const p = game.view.tiles.pick(game.view.raycaster); if (p) tile = b.field.get(p.q, p.r); }
  if (!tile) return;
  const cur = b.current, myTurn = cur && cur.side === 'player' && !b.busy;
  if (myTurn && b.abilityMode) {
    if (Abilities.validTiles(cur, b.abilityMode).includes(tile)) Battle.castAbility(b.abilityMode, tile);
    else { b.abilityMode = null; Battle.computeOptions(); }
    return;
  }
  if (myTurn && tile.unit && b.targets.includes(tile.unit)) { Battle.playerAttack(tile.unit); return; }
  if (myTurn && tile.unit && b.approach && b.approach.has(tile.unit)) { Battle.moveAndAttack(tile.unit); return; }
  if (myTurn && !tile.unit && b.reach && b.reach.tiles.includes(tile)) { Battle.playerMove(tile); return; }
  if (tile.unit) { b.selected = tile.unit; UI.renderUnitCard(tile.unit); }
}
// Tooltip near the mouse (edges and ground).
function showTip(ev, html) {
  const tip = $('edgeTip');
  tip.innerHTML = html;
  tip.style.left = ev.clientX + 16 + 'px'; tip.style.top = ev.clientY + 12 + 'px';
  tip.classList.remove('hidden');
}
// Ground description for the tooltip; `unit` (optional) is the active unit for movement costs.
function groundTip(floorKey, level, extra) {
  const ft = DATA.floorTypes[floorKey];
  const cost = ft.moveCost === null ? 'nicht begehbar' : `Bewegung kostet ${ft.moveCost}`;
  let html = `<b>${ft.name}</b> · ${cost} · Stufe ${level}`;
  if (ft.effect && ft.effect.damageUndeadPerRound) html += `<br>Untote verlieren ${ft.effect.damageUndeadPerRound} LP pro Runde`;
  if (ft.effect && ft.effect.healUndeadPerRound) html += `<br>Untote heilen ${ft.effect.healUndeadPerRound} LP pro Runde`;
  return html + (extra || '');
}
let lastWorldHover = 0;
function onHover(ev) {
  const tip = $('edgeTip');
  if (game.input.rmb || (game.mode !== 'battle' && game.mode !== 'world')) { tip.classList.add('hidden'); return; }
  setMouse(ev);
  if (game.mode === 'world') {
    // Throttled: ground info on the world map.
    const now = performance.now();
    if (now - lastWorldHover < 60) return;
    lastWorldHover = now;
    const p = game.view.terrain.pick(game.view.raycaster);
    if (game.debug) game.hoverNodeId = Debug.nodeUnderMouse(p);
    if (!p) { tip.classList.add('hidden'); return; }
    const w = game.world;
    showTip(ev, groundTip(w.floorKeyAt(p.q, p.r), w.levelAt(p.q, p.r), `<br><span class="small">${w.metersAt(p.q, p.r).toFixed(0)} m über dem Meer</span>`));
    return;
  }
  const b = game.battle;
  if (!b) { tip.classList.add('hidden'); return; }
  // Edge tooltip has priority.
  const visibleEdges = BattleView.edgeMeshes.filter(m => m.parent && (m.parent !== BattleView.optionalEdges || BattleView.optionalEdges.visible));
  const eh = game.view.raycaster.intersectObjects(visibleEdges, false)[0];
  const p = game.view.tiles.pick(game.view.raycaster);
  const t = p && b.field.get(p.q, p.r);
  const cur = b.current, myTurn = b.reach && !b.busy && cur && cur.side === 'player';
  if (eh) {
    const e = eh.object.userData.edge, et = b.field.get(e.q, e.r), info = et && b.field.edgeInfoOf(et, e.d);
    let html = `<b>${info ? SIEGE_EDGES[info.kind].name : EDGE_NAMES[e.type]}</b>`;
    if (info) {
      html += ` · ${Math.max(0, info.hp)} / ${info.max} LP`;
      const key = b.field.edgeKey(et, e.d), x = myTurn && ((b.edgeTargets || []).find(y => y.key === key) || (b.edgeApproach && b.edgeApproach.get(key)));
      if (x) html += `<br><b>${x.via ? 'Hinlaufen und angreifen' : 'Angreifen'}: ≈ ${Battle.edgeDamage(cur, x)}</b>${x.factor < 1 ? ` <span class="small">(ohne Belagerung nur ${Math.round(x.factor * 100)} %)</span>` : ''}`;
      else html += `<br><span class="small">${SIEGE_EDGES[info.kind].other ? 'Jede Einheit kann sie angreifen (Belagerung voll, sonst schwach).' : 'Nur Belagerung bricht sie: Balliste, Fleischriese, Knochendrache, Hünenkönig.'}</span>`;
    } else if (e.type === 'WALL_TRANSPARENT') html += '<br><span class="small">Hält auf, Sicht und Fernkampf gehen durch.</span>';
    showTip(ev, html);
  } else if (t) {
    let extra = '';
    if (t.building !== null) extra += `<br>${b.field.buildings[t.building].name}`;
    // Damage preview against a target.
    const via = myTurn && t.unit && b.approach && b.approach.get(t.unit);
    if (myTurn && t.unit && (b.targets.includes(t.unit) || via) && t.unit.side !== cur.side) {
      const from = via || b.field.get(cur.q, cur.r), chk = Combat.canAttack(b.field, cur, from, t.unit), x = t.unit;
      const dmg = Math.round(Combat.expected(b.field, cur, from, x, chk.cover) * Abilities.damageMul(cur, x));
      const through = Math.max(0, dmg - (x.shield || 0)), left = x.hp - through, dies = stackCount(x) - (left > 0 ? Math.ceil(left / x.def.hp) : 0);
      const eff = DATA.powerDefense[Combat.profile(cur, x).power][x.def.defense];
      extra += `<br><b>${via ? 'Hinlaufen und angreifen' : 'Angriff'}: ≈ ${dmg} Schaden</b>${x.shield ? ` (Schild ${Math.min(x.shield, dmg)})` : ''} · ${left <= 0 ? 'vernichtet den Stapel' : `~${dies} fallen`}<br><span class="small">${eff >= 125 ? '▲ sehr wirksam' : eff >= 100 ? '► wirksam' : eff > 0 ? '▼ schwach' : '✖ immun'} (${eff} %)${chk.cover ? ' · Deckung' : ''}${chk.window ? ' · durchs Fenster' : ''}${x.def.counter && chk.dist === 1 && !chk.window ? ' · Gegner kontert' : ''}</span>`;
    }
    UI.renderHoverCard(t.unit && t.unit.alive ? t.unit : null);
    if (myTurn && !t.unit) {
      const c = b.reach.cost.get(b.field.index(t));
      if (b.reach.tiles.includes(t)) extra += `<br>Weg: ${c} von ${cur.def.move} Bewegungspunkten`;
      else extra += '<br><i>außer Reichweite</i>';
      if (cur.def.flying) extra += ' <span class="small">(fliegt: jedes Feld kostet 1)</span>';
    }
    // With a unit on the tile its card shows everything (ground included); the cursor keeps only the attack preview.
    if (t.unit && t.unit.alive) { const k = extra.indexOf('<br><b>'); if (k >= 0 && /angreifen|Angriff/.test(extra)) showTip(ev, extra.slice(k + 4)); else tip.classList.add('hidden'); }
    else if (t.solid) showTip(ev, `<b>${b.field.buildings[t.building].name}</b><br>Massiv: unbegehbar, versperrt die Sicht.`);
    else showTip(ev, groundTip(t.floor, t.level, extra));
  } else if (p) {
    showTip(ev, groundTip(game.world.floorKeyAt(p.q, p.r), game.world.levelAt(p.q, p.r), '<br><i>außerhalb des Kampffelds</i>'));
  } else tip.classList.add('hidden');
  if (!t || !t.unit) UI.renderHoverCard(null);
  // Path preview.
  if (!myTurn) { BattleView.setOverlay(BattleView.pathOverlay, []); return; }
  const dest = t && b.reach.tiles.includes(t) && !t.unit ? t : t && t.unit && b.approach && b.approach.get(t.unit);
  if (dest) {
    const path = Pathfinding.path(b.field, b.reach, dest) || [];
    // Tiles on which a defender who is not yet alarmed would notice this unit: red.
    const watchers = Alarm.enemies().filter(e => e.alert !== 'alarmed'), oq = cur.q, or = cur.r, om = cur.movedThisTurn;
    const seen = x => { cur.q = x.q; cur.r = x.r; cur.movedThisTurn = true; const r = watchers.some(e => Stealth.detects(b.field, e, cur)); cur.q = oq; cur.r = or; cur.movedThisTurn = om; return r; };
    BattleView.setOverlay(BattleView.pathOverlay, path.slice(1).map(x => ({ t: x, color: watchers.length && seen(x) ? '#e02828' : '#f0d870', lift: 0.03 })));
  } else BattleView.setOverlay(BattleView.pathOverlay, []);
}
function initInput() {
  const canvas = game.view.renderer.domElement, inp = game.input;
  // Releasing the right button outside the window used to leave rotation and pressed keys stuck:
  // the release and the context menu went elsewhere and the keyup events were lost. Pointer capture
  // keeps the release in the canvas, and every path that loses track of the input resets it.
  const releaseAll = () => { inp.rmb = false; inp.keys.clear(); };
  window.addEventListener('contextmenu', e => { e.preventDefault(); if (e.target !== canvas) releaseAll(); });
  canvas.addEventListener('pointerdown', e => {
    inp.downX = e.clientX; inp.downY = e.clientY;
    if (e.button === 2) { inp.rmb = true; inp.lastX = e.clientX; inp.lastY = e.clientY; canvas.setPointerCapture(e.pointerId); }
  });
  canvas.addEventListener('lostpointercapture', () => { inp.rmb = false; });
  window.addEventListener('pointercancel', releaseAll);
  document.addEventListener('visibilitychange', () => { if (document.hidden) releaseAll(); });
  document.addEventListener('mouseleave', () => { inp.overCanvas = false; });
  window.addEventListener('pointerup', e => {
    if (e.button === 2) inp.rmb = false;
    if (e.button === 0 && e.target === canvas && Math.hypot(e.clientX - inp.downX, e.clientY - inp.downY) < 6) onLeftClick(e);
  });
  window.addEventListener('pointermove', e => {
    if (inp.rmb && !(e.buttons & 2)) inp.rmb = false;      // release was missed
    if (inp.rmb) {
      // Horizontal drag rotates, vertical drag tilts (flat views show relief better).
      const cam = game.view.cam;
      cam.yaw -= (e.clientX - inp.lastX) * 0.006;
      cam.pitch = Math.min(CAM.maxPitchDegrees, Math.max(CAM.minPitchDegrees, cam.pitch * 180 / Math.PI + (e.clientY - inp.lastY) * 0.25)) * Math.PI / 180;
      inp.lastX = e.clientX; inp.lastY = e.clientY;
    }
    inp.mx = e.clientX; inp.my = e.clientY; inp.overCanvas = e.target === canvas;
    if (e.target === canvas) onHover(e); else { $('edgeTip').classList.add('hidden'); if (game.mode === 'battle' && !(e.target.closest && e.target.closest('#initBar'))) UI.renderHoverCard(null); }
  });
  canvas.addEventListener('wheel', e => { e.preventDefault(); game.view.cam.zoom(e.deltaY); }, { passive: false });
  window.addEventListener('keydown', e => { if (e.code === 'KeyB' && game.mode === 'world' && !(e.target && e.target.tagName === 'INPUT') && $('modal').classList.contains('hidden')) Base.open(); });
  window.addEventListener('keydown', e => { if (e.code === 'KeyM' && !(e.target && e.target.tagName === 'INPUT')) Sfx.toggle(); });
  window.addEventListener('keydown', e => { if (e.code === 'KeyG' && game.mode === 'world' && !(e.target && e.target.tagName === 'INPUT')) Expeditions.go(); });
  // Space during a journey: hurry (4x).
  window.addEventListener('keydown', e => { if (e.code === 'Space' && game.mode === 'travel') { game.hurry = true; e.preventDefault(); } });
  window.addEventListener('keyup', e => { if (e.code === 'Space') game.hurry = false; });
  window.addEventListener('blur', () => { game.hurry = false; });
  window.addEventListener('keydown', e => {
    if (e.code === 'F3') { e.preventDefault(); game.debug = !game.debug; UI.show('debug', game.debug); Debug.tools(game.debug); return; }
    if (e.target && e.target.tagName === 'INPUT') return;
    if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
    inp.keys.add(e.code);
    if (game.mode === 'battle') {
      if (e.code === 'Space') { const b = game.battle; if (b && b.current && b.current.side === 'player') Battle.endTurn(); }
      if (e.code === 'KeyR') Battle.retreat();
      if (e.code === 'Escape' && game.battle && game.battle.abilityMode) { game.battle.abilityMode = null; Battle.computeOptions(); }
      if (/^Digit[1-4]$/.test(e.code) && game.battle && game.battle.current) { const ab = Abilities.actives(game.battle.current)[+e.code.slice(5) - 1]; if (ab) Battle.chooseAbility(ab[0]); }
      if (e.code === 'KeyT') toggleEdges();
      if (e.code === 'KeyK') { game.tokenMode = game.tokenMode === 'auto' || !game.tokenMode ? 'on' : game.tokenMode === 'on' ? 'off' : 'auto'; UI.toast(`Token-Modus: ${{ auto: 'automatisch (weit herausgezoomt)', on: 'an', off: 'aus' }[game.tokenMode]}`); }
    }
    if (e.code === 'KeyI' && game.mode === 'world') UI.openInventory();
    if (e.code === 'KeyR' && game.mode === 'world') UI.findRecruitSite();
    if (e.code === 'KeyH' && game.mode === 'world') UI.focusNode(PHYLACTERY);
    if (e.code === 'Escape' && game.mode === 'world' && $('modal').classList.contains('hidden')) { ['menuPop', 'threatPop'].forEach(id => UI.show(id, false)); UI.clearSelection(); }
  });
  window.addEventListener('keyup', e => inp.keys.delete(e.code));
  window.addEventListener('blur', releaseAll);
  $('btnEndTurn').onclick = () => { const b = game.battle; if (b && b.current && b.current.side === 'player') Battle.endTurn(); };
  $('btnRetreat').onclick = () => Battle.retreat();
  $('btnEdges').onclick = () => toggleEdges();
  $('btnMenu').onclick = e => { e.stopPropagation(); UI.togglePop('menuPop'); };
  $('threatChip').onclick = e => { e.stopPropagation(); UI.togglePop('threatPop'); };
  ['menuPop', 'threatPop'].forEach(id => $(id).addEventListener('click', e => e.stopPropagation()));
  window.addEventListener('click', () => { ['menuPop', 'threatPop'].forEach(id => UI.show(id, false)); Minimap.highlight = null; });
  $('btnHelp').onclick = () => { UI.show('menuPop', false); UI.openHelp(); };
  $('btnNews').onclick = () => UI.openNews();
  // Esc closes the open window (same as its × / Schließen), before any other Esc use.
  window.addEventListener('keydown', e => {
    if (e.code !== 'Escape') return;
    if (!$('modal').classList.contains('hidden')) { const x = $('modalBody').querySelector('.modalClose'); if (x) x.click(); e.stopImmediatePropagation(); e.preventDefault(); return; }
    if (!$('menuPop').classList.contains('hidden') || !$('threatPop').classList.contains('hidden')) { ['menuPop', 'threatPop'].forEach(id => UI.show(id, false)); Minimap.highlight = null; e.stopImmediatePropagation(); }
  }, true);
  window.addEventListener('keydown', e => { if (e.code === 'KeyN' && game.mode === 'world' && !(e.target && e.target.tagName === 'INPUT') && $('modal').classList.contains('hidden')) UI.openNews(); });
  $('btnBattleHelp').onclick = () => UI.openHelp();
  $('btnDebugMenu').onclick = () => { UI.show('menuPop', false); game.debug = !game.debug; UI.show('debug', game.debug); Debug.tools(game.debug); };
  $('btnTokens').onclick = () => { game.tokenMode = game.tokenMode === 'auto' || !game.tokenMode ? 'on' : game.tokenMode === 'on' ? 'off' : 'auto'; UI.toast(`Token-Modus: ${{ auto: 'automatisch (weit herausgezoomt)', on: 'an', off: 'aus' }[game.tokenMode]}`); };
  $('battleLog').onclick = () => { const l = $('battleLog'); l.classList.toggle('open'); l.scrollTop = 1e9; };
  $('btnRecruitSite').onclick = () => UI.findRecruitSite();
  $('btnRecruitLocal').onclick = () => { if (game.mode !== 'world') return; if (Recruitment.canRecruitAt(Campaign.armyNode())) UI.openRecruit(); else UI.toast('Hier können keine Untoten rekrutiert werden. Wähle eine Grabstätte auf der Karte.', 4, false); };
  $('btnHome').onclick = () => UI.focusNode(PHYLACTERY);
  $('btnGo').onclick = () => Expeditions.go();
  $('btnRest').onclick = () => UI.openRest();
  $('btnBuild').onclick = () => { if (game.mode === 'world') Base.open(); };
  $('btnInventory').onclick = () => { if (game.mode === 'world') UI.openInventory(); };
  $('btnSound').onclick = () => Sfx.toggle();
  $('btnSound').textContent = Sfx.muted ? 'Ton: aus (M)' : 'Ton: an (M)';
  $('btnSaves').onclick = () => { if (game.mode === 'world') SaveGame.open(); else UI.toast('Spielstände gibt es auf der Weltkarte.', 3.5, false); };
  $('btnNewGame').onclick = () => UI.modal('<h2>Neues Spiel?</h2><p>Der gespeicherte Stand wird gelöscht.</p>',
    [{ label: 'Abbrechen' }, { label: 'Neues Spiel', primary: true, action: () => newGame() }]);
}
function toggleEdges() {
  game.showEdges = !game.showEdges;
  if (BattleView.optionalEdges) BattleView.optionalEdges.visible = game.showEdges;
  $('btnEdges').classList.toggle('on', !!game.showEdges);
}

const Debug = {
  // Place under the mouse: pillar hit first, otherwise the nearest place within 3 tiles of the ground point.
  nodeUnderMouse(p) {
    const pillars = Object.values(game.view.nodeViews).map(v => v.pillar);
    const hit = game.view.raycaster.intersectObjects(pillars, false)[0];
    if (hit) return hit.object.userData.nodeId;
    if (!p) return null;
    let best = null, bd = 4;
    for (const n of DATA.nodes) { const d = hexDistance(n.q, n.r, p.q, p.r); if (d < bd) { bd = d; best = n.id; } }
    return best;
  },
  nodeLine() {
    const id = game.battle ? game.battle.node.id : game.hoverNodeId, n = id && NODE_BY_ID[id];
    if (!n) return '–';
    const g = Object.entries(n.garrison || {}).map(([t, c]) => `${c}× ${DATA.units[t].name}`).join(', ');
    return `${n.name} [${n.id}]\n           ${NODE_TYPE_NAMES[n.type] || n.type} · ${DATA.factions[Campaign.owner(n)]?.name || Campaign.owner(n)} · (${n.q}, ${n.r})` +
      `${Campaign.isRevealed(n) ? '' : ' · unentdeckt'}${g ? `\n           ${g}` : ''}`;
