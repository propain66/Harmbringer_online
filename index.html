    // Doors: spread over different tiles where possible.
    const doors = [];
    for (let i = 0; i < tpl.doors; i++) {
      const pool = candidates.filter(c => !doors.includes(c) && !doors.some(d => d.t === c.t));
      const from = pool.length ? pool : candidates.filter(c => !doors.includes(c));
      doors.push(from[Math.floor(this.rng() * from.length)]);
    }
    const id = this.buildings.length;
    for (const t of parts) { t.building = id; t.floor = tpl.floor; }
    const wall = tpl.wall || 'WALL';
    for (const o of outward) if (!doors.includes(o)) { this.setEdge(o.t, o.e, wall); this.setEdgeInfo(o.t, o.e, 'house'); }
    for (const d of doors) { this.setEdge(d.t, d.e, 'OPEN'); this.setEdgeInfo(d.t, d.e, null); }
    // Windows: some outer walls become transparent.
    const walls = outward.filter(o => !doors.includes(o) && o.n && o.t.edges[o.e] === 'WALL');
    for (let i = 0; i < (tpl.windows || 0) && walls.length; i++) {
      const w = walls.splice(Math.floor(this.rng() * walls.length), 1)[0];
      this.setEdge(w.t, w.e, 'WALL_TRANSPARENT');
    }
    this.buildings.push({ id, key, name: tpl.name, tiles: parts, doors });
    // Closed blocks (no door) are solid: nobody can enter, nobody can see through.
    if (!doors.length) for (const t of parts) { t.solid = true; for (let e = 0; e < 6; e++) this.setEdgeInfo(t, e, null); }
    return true;
  }

  placeBuildings(set, count, innerRadius) {
    // The "first" building (the church) is tried close to the center first.
    if (set.first) {
      let ok = false;
      for (let a = 0; a < 120 && !ok; a++) ok = this.tryBuilding(set.first, a < 60 ? 3 : innerRadius);
    }
    let fails = 0;
    while (this.buildings.length < count && fails < 30) {
      const key = this.pickWeighted(set.mix);
      let ok = false;
      for (let a = 0; a < 25 && !ok; a++) ok = this.tryBuilding(key, innerRadius);
      if (!ok) fails++;
    }
  }

  // Christian places: holy ground around the church, graveyard next to it.
  consecrate(set) {
    const church = this.buildings.find(b => b.key === set.first);
    if (!church) return;
    const c0 = church.tiles[0], holy = new Set();
    for (const t of this.tilesWithin(c0.q, c0.r, set.holyRadius)) {
      if (this.isWater(t) || (t.building !== null && t.building !== church.id)) continue;
      t.floor = 'HOLY_GROUND'; holy.add(t);
    }
    let best = null, bestScore = -1;
    for (const c of this.tilesWithin(c0.q, c0.r, set.holyRadius + set.graveyardRadius + 2)) {
      if (hexDistance(c.q, c.r, c0.q, c0.r) < set.holyRadius + set.graveyardRadius) continue;
      const area = this.tilesWithin(c.q, c.r, set.graveyardRadius);
      const score = area.filter(t => !this.isWater(t) && t.building === null && !holy.has(t)).length + this.rng() * 0.5;
      if (score > bestScore) { bestScore = score; best = c; }
    }
    if (best) for (const t of this.tilesWithin(best.q, best.r, set.graveyardRadius))
      if (!this.isWater(t) && t.building === null && !holy.has(t)) t.floor = 'GRAVEYARD_GROUND';
  }

  // Angle of a tile around the field center (for rings).
  angleOf(t) { const c = hexToWorld(this.cq, this.cr), p = hexToWorld(t.q, t.r); return Math.atan2(p.x - c.x, p.z - c.z); }
  // Tiles of the ring at `radius` sorted by angle, and which of them lie in one of `gates` gaps.
  ring(radius, gates, halfWidth) {
    const offset = this.rng() * Math.PI * 2;
    const tiles = this.tiles.filter(t => t && hexDistance(t.q, t.r, this.cq, this.cr) === radius).sort((x, y) => this.angleOf(x) - this.angleOf(y));
    const inGap = t => { for (let g = 0; g < gates; g++) { const ga = offset + g * Math.PI * 2 / gates, a = this.angleOf(t);
      if (Math.abs(Math.atan2(Math.sin(a - ga), Math.cos(a - ga))) < halfWidth) return true; } return false; };
    return { tiles, inGap };
  }
  // City wall: a stone ring with a raised walkway (+2 levels) behind the battlements, towers (+3) every few
  // tiles and beside the gates, stairs up from the inside, and closed gates that can be rammed.
  // Defenders on the walkway see and shoot over the wall (with cover); everybody else's sight is blocked.
  placeCityWall(radius, gates) {
    const { tiles, inGap } = this.ring(radius, gates, 1.6 / radius);
    const out = (t, d) => { const n = this.neighborTile(t, d); return n && hexDistance(n.q, n.r, this.cq, this.cr) === radius + 1 ? n : null; };
    let k = 0;
    const walk = [];
    for (const t of tiles) {
      if (this.isWater(t)) continue;
      const gap = inGap(t);
      for (let d = 0; d < 6; d++) {
        const n = out(t, d); if (!n || this.isWater(n)) continue;
        this.setEdge(t, d, gap ? 'GATE' : 'WALL'); this.setEdgeInfo(t, d, gap ? 'gate' : 'city');
      }
      if (gap) { t.floor = 'COBBLESTONE'; t.gate = true; continue; }
      t.ground = t.y; t.y += 2; t.level = Math.round(t.y); t.floor = 'STONE_FLOOR'; t.walkway = true; walk.push(t);
    }
    // Towers: every 6th walkway tile and the ones beside a gate.
    walk.forEach((t, i) => {
      const nextToGate = [0, 1, 2, 3, 4, 5].some(d => { const n = this.neighborTile(t, d); return n && n.gate; });
      if (i % 6 !== 0 && !nextToGate) return;
      t.y += 1; t.level = Math.round(t.y); t.tower = true;
      const id = this.buildings.length; t.building = id;
      this.buildings.push({ id, key: 'walltower', name: 'Mauerturm', tiles: [t], doors: [] });
    });
    // Stairs: an inner tile one level below the walkway, every 5th walkway tile (not at towers).
    walk.forEach((t, i) => {
      if (t.tower || i % 5 !== 2) return;
      for (let d = 0; d < 6; d++) {
        const n = this.neighborTile(t, d);
        if (!n || n.walkway || n.gate || n.building !== null || this.isWater(n) || hexDistance(n.q, n.r, this.cq, this.cr) !== radius - 1) continue;
        n.y = t.y - 1; n.level = Math.round(n.y); n.floor = 'STONE_FLOOR'; n.stair = true; break;
      }
    });
    this.cityWall = radius;
  }
  // Palisade: a wooden ring with a few open gaps; any unit can hack it down.
  placePalisade(radius, gaps) {
    const { tiles, inGap } = this.ring(radius, gaps, 1.3 / radius);
    for (const t of tiles) {
      if (this.isWater(t) || inGap(t) || t.building !== null) continue;
      for (let d = 0; d < 6; d++) {
        const n = this.neighborTile(t, d);
        if (!n || this.isWater(n) || n.building !== null || hexDistance(n.q, n.r, this.cq, this.cr) !== radius + 1 || t.edges[d] !== 'OPEN') continue;
        this.setEdge(t, d, 'WALL_DESTRUCTIBLE'); this.setEdgeInfo(t, d, 'palisade');
      }
    }
  }
  // A breakable edge falls: it opens (rubble gives cover); a walkway behind a breached city wall
  // collapses into a ramp so the breach can be climbed.
  breach(t, d) {
    const info = this.edgeInfoOf(t, d), n = this.neighborTile(t, d);
    this.setEdgeInfo(t, d, null);
    this.setEdge(t, d, info && (info.kind === 'city' || info.kind === 'house') ? 'COVER' : 'OPEN');
    if (info && info.kind === 'city') for (const x of [t, n]) {
      if (!x || !(x.walkway || x.tower)) continue;
      // The wall section (or tower) collapses into a ramp of rubble.
      x.y = (x.ground ?? x.y - 2) + 1; x.level = Math.round(x.y); x.walkway = false; x.tower = false; x.floor = 'GRAVEL'; x.rubble = true;
    }
  }

  // Fences: lines of 4-6 tiles in direction d; edge (d+1)%6 becomes cover on both sides.
  placeFences(count) {
    for (let f = 0; f < count; f++) {
      let t = this.randomTileWithin(this.size / 2 - 2);
      const d = Math.floor(this.rng() * 6), len = 4 + Math.floor(this.rng() * 3), e = (d + 1) % 6;
      for (let i = 0; i < len && t; i++) {
        if (t.building !== null) break;
        const n = this.neighborTile(t, e);
        if (n && n.building === null && t.edges[e] === 'OPEN' && !this.isWater(t)) this.setEdge(t, e, 'COVER');
        t = this.neighborTile(t, d);
      }
    }
  }
}

// =============================================================================
// Pathfinding
// Dijkstra over the battlefield with the movement rules of PROMPT 8.4.
// =============================================================================
class MinHeap {
  constructor() { this.a = []; }
  push(cost, item) {
    const a = this.a; a.push([cost, item]);
    let i = a.length - 1;
    while (i > 0) { const p = (i - 1) >> 1; if (a[p][0] <= a[i][0]) break; [a[p], a[i]] = [a[i], a[p]]; i = p; }
  }
  pop() {
    const a = this.a, top = a[0], last = a.pop();
    if (a.length) {
      a[0] = last; let i = 0;
      for (;;) {
        const l = 2 * i + 1, r = l + 1; let m = i;
        if (l < a.length && a[l][0] < a[m][0]) m = l;
        if (r < a.length && a[r][0] < a[m][0]) m = r;
        if (m === i) break; [a[m], a[i]] = [a[i], a[m]]; i = m;
      }
    }
    return top;
  }
  get size() { return this.a.length; }
}

// Creatures of the sea and the drowned: water (also deep) costs them 1.
const SWIMMERS = new Set(['wasserleiche', 'wassermann', 'ertrunkener', 'wattjungfrau', 'klabautermann', 'blanker_hans']);
const Pathfinding = {
  // Cost to step from A to B in direction d, or null if not allowed.
  stepCost(field, unit, A, d, B, ignoreUnits = false) {
    if (!B || B.solid) return null;
    const def = unit.def;
    if (!def.spectral && (A.edges[d] !== 'OPEN' || B.edges[opposite(d)] !== 'OPEN')) {
      // Flyers cross city walls, gates and palisades (not house walls: roofs).
      const info = def.flying && field.edgeInfoOf(A, d);
      if (!(info && info.kind !== 'house') && !(field.passBreakable && field.edgeInfoOf(A, d) && field.passBreakable(field.edgeInfoOf(A, d)))) return null;
    }
    if (!def.flying && Math.abs(A.level - B.level) >= 2) return null;
    if (B.unit && B.unit !== unit && !def.flying && !ignoreUnits) return null;     // flyers may pass over units
    if (def.flying) return 1;
    if (SWIMMERS.has(unit.type) && DATA.floorTypes[B.floor].water) return 1;   // creatures of the sea swim fast, even in deep water
    const base = DATA.floorTypes[B.floor].moveCost;                  // null = impassable
    if (base === null || base === undefined) return base;
    // Mass: tiles next to an enemy giant (size 4) cost one more movement point.
    for (let k = 0; k < 6; k++) { const n = field.neighborTile(B, k); if (n && n.unit && n.unit !== unit && n.unit.side !== unit.side && n.unit.def.size >= 4) return base + 1; }
    return base;
  },
  // Returns { cost: Map(index -> cost), prev: Map(index -> index) } up to maxCost.
  // ignoreUnits: plan through occupied tiles (used by the AI to queue behind allies).
  search(field, unit, maxCost, ignoreUnits = false) {
    const start = field.get(unit.q, unit.r);
    const cost = new Map(), prev = new Map(), heap = new MinHeap();
    const si = field.index(start);
    cost.set(si, 0); heap.push(0, start);
    while (heap.size) {
      const [c, t] = heap.pop();
      if (c > cost.get(field.index(t))) continue;
      for (let d = 0; d < 6; d++) {
        const n = field.neighborTile(t, d);
        const sc = this.stepCost(field, unit, t, d, n, ignoreUnits);
        if (sc === null || sc === undefined) continue;
        // One step is always possible: the first step from the start costs at most the whole budget
        // (a ballista with 1 movement can still cross mud).
        const nc = t === start && maxCost >= 1 ? Math.min(c + sc, maxCost) : c + sc;
        if (nc > maxCost) continue;
        const ni = field.index(n);
        if (!cost.has(ni) || nc < cost.get(ni)) { cost.set(ni, nc); prev.set(ni, field.index(t)); heap.push(nc, n); }
      }
    }
    return { cost, prev, start: si };
  },
  // Tiles the unit may end its move on (free tiles within its move points), incl. its own.
  reachable(field, unit, budget = moveOf(unit)) {
    const s = this.search(field, unit, budget);
    const tiles = [];
    for (const [i] of s.cost) { const t = field.tiles[i]; if (!t.unit || t.unit === unit) tiles.push(t); }
    return { ...s, tiles };
  },
  path(field, search, target) {
    const out = [];
    let i = field.index(target);
    if (!search.cost.has(i)) return null;
    while (i !== undefined) { out.push(field.tiles[i]); if (i === search.start) break; i = search.prev.get(i); }
    return out.reverse();
  }
};

// =============================================================================
// Combat rules (pure functions on data objects)
// =============================================================================
const Combat = {
  // Damage formula, PROMPT 8.4 (exact order of operations).
  damage(att, tgt, attLevel, tgtLevel, targetInCover) {
    const pd = DATA.powerDefense;
    let dmg = att.damage * pd[att.power][tgt.defense] / 100;
    if (attLevel > tgtLevel) dmg *= 1.25;      // high ground
    if (attLevel < tgtLevel) dmg *= 0.85;
    if (targetInCover) dmg *= 0.5;
    // Magic resist reduces magic power types by a percentage (rules block in world_data.js).
    // soulShield is no longer subtracted here: it is a pool consumed in Battle.applyDamage.
    if (RULES.magicPowers.includes(att.power)) dmg *= 1 - Math.min(RULES.mrCap, tgt.magicResist * RULES.mrPerPoint);
    dmg = Math.round(dmg);
    dmg = (pd[att.power][tgt.defense] === 0) ? 0 : Math.max(1, dmg);
    return dmg;
  },
  // Attack profile: what a unit does against a given target.
  profile(unit, target) {
    const def = unit.def;
    // A stack hits with the damage of all its creatures.
    const n = Math.max(1, stackCount(unit));
    if (def.power === 'HEAL') return target.side === unit.side ? { power: 'HEAL', damage: def.damage * n } : { power: PRIEST_ATTACK.power, damage: PRIEST_ATTACK.damage * n };
    return { power: def.power, damage: def.damage * n };
  },
  edgeBetween(field, a, b) {
    const d = directionTo(a.q, a.r, b.q, b.r);
    if (d < 0) return null;
    return [a.edges[d], b.edges[opposite(d)]];
  },
  // Line of sight from tile A to tile B (walls block, high ground in between blocks).
  lineOfSight(field, A, B) {
    const line = hexLine(A.q, A.r, B.q, B.r);
    const maxLevel = Math.max(A.level, B.level) + 1;
    let cover = false;
    for (let i = 1; i < line.length; i++) {
      const p = field.get(line[i - 1][0], line[i - 1][1]), c = field.get(line[i][0], line[i][1]);
      if (!p || !c) continue;
      const e = this.edgeBetween(field, p, c);
      if (e && (BLOCKS_SIGHT.has(e[0]) || BLOCKS_SIGHT.has(e[1]))) {
        // Battlements: whoever stands on the walkway (or a wall tower) right behind the city wall sees over it.
        const info = e[0] === 'WALL' && field.edgeInfoOf(p, directionTo(p.q, p.r, c.q, c.r));
        const high = x => x.walkway || x.tower;
        if (info && info.kind === 'city' && ((i === 1 && high(A)) || (i === line.length - 1 && high(B)))) { if (i === line.length - 1) cover = true; continue; }
        return { clear: false };
      }
      if (i < line.length - 1 && (c.level > maxLevel || c.solid)) return { clear: false };
      if (i === line.length - 1 && e && (e[0] === 'COVER' || e[1] === 'COVER')) cover = true;
    }
    return { clear: true, cover };
  },
  // Can `unit`, standing on tile `from`, attack (or heal) `target`? Returns { ok, cover, dist }.
  canAttack(field, unit, from, target) {
    const tt = field.get(target.q, target.r);
    if (!target.alive || target === unit) return { ok: false };
    const healing = unit.def.power === 'HEAL' && target.side === unit.side;
    if (target.side === unit.side && !healing) return { ok: false };
    if (healing && topHp(target) >= target.def.hp) return { ok: false };     // healing only mends the top creature
    const dist = hexDistance(from.q, from.r, tt.q, tt.r);
    let range = unit.def.range;
    if (range > 1 && from.level - tt.level >= 2) range += 1;        // ranged high ground bonus
    if (range > 2 && game.battle && TIMES[game.battle.time].foggy) range -= 1;   // fog
    if (dist > range || dist < 1) return { ok: false };
    if (game.battle && game.battle.debugNoLos && unit.side === 'player') return { ok: true, cover: false, dist, range, window: true };   // debug: through walls
    if (dist === 1) {
      const e = this.edgeBetween(field, from, tt);
      if (e && (BLOCKS_MELEE.has(e[0]) || BLOCKS_MELEE.has(e[1]))) {
        // A window blocks melee, but archers can still shoot through it (with cover, no counter).
        if (unit.def.range > 1 && !BLOCKS_SIGHT.has(e[0]) && !BLOCKS_SIGHT.has(e[1])) return { ok: true, cover: true, dist, range, window: true };
        return { ok: false };
      }
      return { ok: true, cover: !!e && (e[0] === 'COVER' || e[1] === 'COVER'), dist, range };
    }
    const los = this.lineOfSight(field, from, tt);
    if (!los.clear) return { ok: false };
    return { ok: true, cover: los.cover, dist, range };
  },
  expected(field, unit, from, target, cover) {
    const prof = this.profile(unit, target);
    if (prof.power === 'HEAL') return Math.min(prof.damage, target.def.hp - topHp(target));
    return this.damage(prof, target.def, from.level, field.get(target.q, target.r).level, cover);
  }
};

// =============================================================================
// Battle view helpers (three.js objects for units, overlays and edges)
// =============================================================================
const BattleView = {
  shapeGeometry(shape) {
    let g;
    switch (shape) {
      case 'cone': g = new THREE.ConeGeometry(0.9, 2.4, 8); break;
      case 'capsule': g = new THREE.CapsuleGeometry(0.7, 1.2, 4, 8); break;
      case 'box': g = new THREE.BoxGeometry(1.5, 1.9, 1.5); break;
      case 'sphere': g = new THREE.SphereGeometry(0.9, 14, 10); break;
      case 'cylinder': g = new THREE.CylinderGeometry(0.7, 0.7, 2.2, 10); break;
      default: g = new THREE.OctahedronGeometry(1.1); g.scale(1, 1.6, 1);
    }
    g.computeBoundingBox();
    g.translate(0, -g.boundingBox.min.y, 0);      // stand on y = 0
    return g;
  },
  init(field) {
    const root = game.view.battleRoot;
    // Overlays: flat hexagons (reach / targets / path / sight cones).
    const geo = new THREE.CylinderGeometry(R * 0.86, R * 0.86, 0.1, 6);
    geo.rotateY(Math.PI / 6);
    const cap = field.size * field.size;
    const mk = (opacity) => {
      const m = new THREE.InstancedMesh(geo, new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity, depthWrite: false }), cap);
      m.setColorAt(0, new THREE.Color(1, 1, 1)); m.count = 0; m.frustumCulled = false; m.renderOrder = 2;
      root.add(m); return m;
    };
    this.overlay = mk(0.5);
    this.pathOverlay = mk(0.75);
    this.coneOverlay = mk(0.22);
    // Active unit ring.
    this.ring = new THREE.Mesh(new THREE.TorusGeometry(2.1, 0.16, 6, 24), new THREE.MeshBasicMaterial({ color: 0xd8b030 }));
    this.ring.rotation.x = Math.PI / 2; this.ring.visible = false;
    root.add(this.ring);
    this.buildEdges(field);
    this.buildSolids(field);
  },
  // Closed buildings (keep, stone tower) as massive stone blocks the full size of their tiles.
  buildSolids(field) {
    const geo = new THREE.CylinderGeometry(R * 0.97, R * 1.0, 1, 6); geo.rotateY(Math.PI / 6); geo.translate(0, 0.5, 0);
    const cap = new THREE.CylinderGeometry(R * 1.05, R * 1.05, 0.5, 6); cap.rotateY(Math.PI / 6); cap.translate(0, 0.25, 0);
    const stone = new THREE.MeshStandardMaterial({ color: 0x8a8378, roughness: 0.95, flatShading: true });
    const dark = new THREE.MeshStandardMaterial({ color: 0x5e584e, roughness: 0.95, flatShading: true });
    for (const bld of field.buildings) {
      if (bld.doors.length || bld.key === 'walltower') continue;
      const h = bld.key === 'stonetower' ? 7 : 5;
      for (const t of bld.tiles) {
        const p = hexToWorld(t.q, t.r);
        const body = new THREE.Mesh(geo, stone); body.scale.y = h; body.position.set(p.x, t.y, p.z);
        const top = new THREE.Mesh(cap, dark); top.position.set(p.x, t.y + h, p.z);
        body.castShadow = top.castShadow = true;
        game.view.battleRoot.add(body, top);
      }
    }
  },
  setOverlay(mesh, list) {
    const m = mesh.instanceMatrix.array, c = mesh.instanceColor.array, col = new THREE.Color();
    list.forEach((it, i) => {
      const p = hexToWorld(it.t.q, it.t.r), o = i * 16;
      m.fill(0, o, o + 16); m[o] = 1; m[o + 5] = 1; m[o + 10] = 1; m[o + 15] = 1;
      m[o + 12] = p.x; m[o + 13] = surfaceY(it.t) + 0.08 + (it.lift || 0); m[o + 14] = p.z;
      col.set(it.color); c[i * 3] = col.r; c[i * 3 + 1] = col.g; c[i * 3 + 2] = col.b;
    });
    mesh.count = list.length;
    mesh.instanceMatrix.needsUpdate = true; mesh.instanceColor.needsUpdate = true;
  },
  buildEdges(field) {
    const root = game.view.battleRoot;
    this.edgeMeshes = [];
    this.optionalEdges = new THREE.Group();
    root.add(this.optionalEdges);
    const wallGeo = new THREE.BoxGeometry(R, 1.5, 0.3); wallGeo.translate(0, 0.75, 0);
    const tri = new THREE.Shape([new THREE.Vector2(-0.35, 0), new THREE.Vector2(0.35, 0), new THREE.Vector2(0, 0.8)]);
    const coverGeo = new THREE.ExtrudeGeometry(tri, { depth: R * 0.9, bevelEnabled: false });
    coverGeo.translate(0, 0, -R * 0.45); coverGeo.rotateY(Math.PI / 2);
    const mats = {
      WALL: new THREE.MeshStandardMaterial({ color: 0x9a2a22, roughness: 0.8 }),
      COVER: new THREE.MeshStandardMaterial({ color: 0xd8b830, roughness: 0.8 }),
      WALL_DESTRUCTIBLE: new THREE.MeshStandardMaterial({ color: 0xd8742a, roughness: 0.8 }),
      WALL_TRANSPARENT: new THREE.MeshStandardMaterial({ color: 0x4a7ad0, transparent: true, opacity: 0.45 }),
      GATE: new THREE.MeshStandardMaterial({ color: 0x6a4424, roughness: 0.9 }),
      city: new THREE.MeshStandardMaterial({ color: 0x8c877c, roughness: 0.95, flatShading: true }),
      palisade: new THREE.MeshStandardMaterial({ color: 0x7a5a32, roughness: 0.95 })
    };
    for (const t of field.tiles) {
      if (!t) continue;
      for (let d = 0; d < 6; d++) {
        const type = t.edges[d];
        if (type === 'OPEN') continue;
        const n = field.neighborTile(t, d);
        if (n && n.edges[opposite(d)] === type && field.index(n) < field.index(t)) continue;   // draw shared edges once
        const info = field.edgeInfoOf(t, d), kind = info && info.kind;
        const mat = kind === 'city' ? mats.city : kind === 'palisade' ? mats.palisade : mats[type];
        // Per-mesh material so breakable targets can glow; walls span from the lower to the higher tile.
        const mesh = new THREE.Mesh(type === 'COVER' ? coverGeo : wallGeo, info ? mat.clone() : mat);
        const ed = edgeDirection(d), p = hexToWorld(t.q, t.r);
        const lo = Math.min(t.y, n ? n.y : t.y), hi = Math.max(t.y, n ? n.y : t.y);
        mesh.position.set(p.x + ed.x * INRADIUS, type === 'COVER' ? hi : lo, p.z + ed.z * INRADIUS);
        if (type !== 'COVER') mesh.scale.y = (hi - lo + (kind === 'city' ? 1.3 : kind === 'gate' ? 2.2 : 1.5)) / 1.5;
        if (kind === 'city' || kind === 'gate') mesh.scale.z = 2.2;
        mesh.rotation.y = -d * Math.PI / 3;
        mesh.userData.edge = { type, q: t.q, r: t.r, d, kind };
        // Walls (buildings, city wall) are always shown; fences and stones only with the edge display.
        const alwaysShown = type !== 'COVER' || t.building !== null || (n && n.building !== null);
        (alwaysShown ? game.view.battleRoot : this.optionalEdges).add(mesh);
        this.edgeMeshes.push(mesh);
      }
    }
    this.optionalEdges.visible = game.showEdges;
  },
  rebuildEdges(field) {
    for (const m of this.edgeMeshes) if (m.parent) m.parent.remove(m);
    if (this.optionalEdges && this.optionalEdges.parent) this.optionalEdges.parent.remove(this.optionalEdges);
    this.buildEdges(field);
  },
  // Breakable edges the current unit can hit glow red.
  markEdges(list) {
    const keys = new Set((list || []).map(x => x.key));
    for (const m of this.edgeMeshes) {
      if (!m.material.emissive || !m.userData.edge.kind) continue;
      const f = game.battle.field, t = f.get(m.userData.edge.q, m.userData.edge.r);
      m.material.emissive.setHex(t && keys.has(f.edgeKey(t, m.userData.edge.d)) ? 0x7a1010 : 0x000000);
    }
  },
  hoverRing(u) {
    if (!this.hring) {
      this.hring = new THREE.Mesh(new THREE.TorusGeometry(2.1, 0.12, 6, 24), new THREE.MeshBasicMaterial({ color: 0x7ad0ff, depthTest: false, transparent: true, opacity: 0.9 }));
      this.hring.rotation.x = Math.PI / 2; this.hring.renderOrder = 10;
    }
    if (!u || !u.alive) { if (this.hring.parent) this.hring.parent.remove(this.hring); return; }
    game.view.battleRoot.add(this.hring);
    this.hring.position.copy(u.view.group.position).add(new THREE.Vector3(0, 0.5, 0));
  },
  starGeometry() {
    if (this._star) return this._star;
    const sh = new THREE.Shape(), n = 12;
    for (let i = 0; i <= 2 * n; i++) { const a = i / (2 * n) * Math.PI * 2, r = i % 2 ? 1.55 : 2.0; i ? sh.lineTo(Math.cos(a) * r, Math.sin(a) * r) : sh.moveTo(r, 0); }
    const g = new THREE.ExtrudeGeometry(sh, { depth: 0.35, bevelEnabled: false });
    g.rotateX(-Math.PI / 2); g.translate(0, -0.17, 0);
    return (this._star = g);
  },
  // Hit effect: a short burst in the color of the power type.
  burst(u, power) {
    if (!u.view) return;
    const col = POWER_COLORS[power] || 0xffffff, g = new THREE.Group(), p = u.view.group.position;
    const mat = new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: 0.9, depthWrite: false });
    const geo = new THREE.SphereGeometry(0.22, 6, 4), parts = [];
    for (let i = 0; i < 9; i++) { const m = new THREE.Mesh(geo, mat); const a = i / 9 * Math.PI * 2; m.userData.v = new THREE.Vector3(Math.cos(a) * 3, 2 + (i % 3), Math.sin(a) * 3); parts.push(m); g.add(m); }
    g.position.set(p.x, p.y + 2.2, p.z); game.view.battleRoot.add(g);
    tween(0.45, k => { for (const m of parts) m.position.copy(m.userData.v).multiplyScalar(k * 0.6); mat.opacity = 0.9 * (1 - k); }).then(() => { game.view.battleRoot.remove(g); mat.dispose(); });
  },
  // Corpses on the field: a small heap of bones per tile with fallen creatures.
  syncCorpses() {
    const b = game.battle; if (!b || !b.corpses) return;
    b.corpseViews = b.corpseViews || new Map();
    for (const [i, n] of b.corpses) {
      let v = b.corpseViews.get(i);
      if (n > 0 && !v) {
        const t = b.field.tiles[i], w = hexToWorld(t.q, t.r);
        v = new THREE.Group();
        const mat = new THREE.MeshStandardMaterial({ color: 0xb8ae94, roughness: 0.9, flatShading: true });
        for (let k = 0; k < 4; k++) { const m = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 1.1, 4), mat); m.rotation.z = Math.PI / 2; m.rotation.y = k * 0.9; m.position.set((k - 1.5) * 0.25, 0.12 + k * 0.03, (k % 2) * 0.3 - 0.15); v.add(m); }
        const sk = new THREE.Mesh(new THREE.DodecahedronGeometry(0.28, 0), mat); sk.position.set(0.5, 0.25, 0.3); v.add(sk);
        v.position.set(w.x + 1.1, surfaceY(t), w.z - 0.8);
        game.view.battleRoot.add(v); b.corpseViews.set(i, v);
      } else if (n <= 0 && v) { game.view.battleRoot.remove(v); b.corpseViews.delete(i); }
    }
  },
  createUnit(u) {
    const def = u.def, s = 1.0 + 0.35 * def.size;
    const group = new THREE.Group();
    const tpl = Figures.templates[u.type];
    let body;
    if (tpl) {
      // Figure: a human is 2.8 units tall; the model already carries its size, so `size` only adds a little.
      body = tpl.clone(true);
      body.scale.setScalar(2.8 * (1 + 0.1 * (def.size - 1)) * (FIGURE_SCALE[u.type] || 1));
      if (def.spectral) body.traverse(o => { if (o.isMesh) { o.material = o.material.clone(); o.material.transparent = true; o.material.opacity = 0.7; } });
    } else {
      body = new THREE.Mesh(this.shapeGeometry(def.shape),
        new THREE.MeshStandardMaterial({ color: def.color, roughness: 0.6, flatShading: true, transparent: def.spectral, opacity: def.spectral ? 0.75 : 1 }));
      body.scale.setScalar(s);
    }
    body.position.y = 0.35 + (def.flying ? 1.2 : 0);
    body.rotation.order = 'YXZ';                       // turn first, then lean forward/back (animations)
    body.userData.y0 = body.position.y; body.userData.s0 = body.scale.y;
    body.traverse(o => { if (o.isMesh) o.userData.unitId = u.id; });
    const pedColor = u.side === 'player' ? DATA.factions.UNDEAD.color : DATA.factions[u.faction].color;
    // Friend or foe is readable from the shape, not only the color: smooth hexagon vs. jagged star.
    const ped = new THREE.Mesh(u.side === 'player' ? new THREE.CylinderGeometry(1.7, 1.9, 0.35, 6) : BattleView.starGeometry(), new THREE.MeshStandardMaterial({ color: pedColor, roughness: 0.7 }));
    ped.rotation.y = Math.PI / 6; ped.position.y = 0.17;
    body.userData.unitId = ped.userData.unitId = u.id;
    // Token mode: a flat disc in the unit color instead of the figure.
    const token = new THREE.Mesh(new THREE.CylinderGeometry(1.25, 1.25, 0.3, 16), new THREE.MeshStandardMaterial({ color: def.color, roughness: 0.6 }));
    token.position.y = 0.5; token.visible = false; token.userData.unitId = u.id;
    group.add(ped, body, token);
    const el = document.createElement('div');
    el.className = 'unitLabel';
    el.innerHTML = `<span class="alertMark"></span><span class="tokName">${esc(def.name)}</span><span class="stIcons"></span><span class="stackCount"></span><div class="hpbar ${u.side === 'player' ? 'player' : ''}"><div></div></div>`;
    const label = new CSS2DObject(el);
    label.position.y = body.position.y + (tpl ? tpl.userData.height * body.scale.y + 0.5 : 3.2 * s);
    group.add(label);
    game.view.battleRoot.add(group);
    u.view = { group, body, el, label, token };
    this.placeUnit(u);
    // Initial facing: enemies look where their sight cone points, the undead towards the field center.
    if (u.side === 'enemy') { const d = edgeDirection(u.facing); this.face(u, group.position.x + d.x, group.position.z + d.z); }
    else { const c = hexToWorld(game.battle.field.cq, game.battle.field.cr); this.face(u, c.x, c.z); }
    this.updateHp(u);
  },
  placeUnit(u) {
    const t = game.battle.field.get(u.q, u.r), p = hexToWorld(u.q, u.r);
    u.view.group.position.set(p.x, surfaceY(t), p.z);
  },
  updateHp(u) {
    // Bar = health of the top creature; the badge shows how many creatures are left.
    const n = stackCount(u);
    u.view.el.querySelector('.hpbar > div').style.width = (n ? 100 * topHp(u) / u.def.hp : 0) + '%';
    u.view.el.querySelector('.stackCount').textContent = n > 1 ? '×' + n : '';
    const st = u.view.el.querySelector('.stIcons');
    if (st) st.textContent = Object.keys(u.status || {}).map(k => STATUS_ICONS[k] || '').join('');
    const al = u.view.el.querySelector('.alertMark');
    if (al) { al.textContent = u.side !== 'enemy' ? '' : u.alert === 'unaware' ? 'z' : u.alert === 'suspicious' ? '?' : '!'; al.className = 'alertMark ' + (u.alert || ''); }
  },
  floatText(u, text, heal) {
    const el = document.createElement('div');
    el.className = 'dmgText' + (heal ? ' heal' : '');
    el.textContent = text;
    const obj = new CSS2DObject(el);
    const base = u.view.group.position.clone();
    obj.position.copy(base).add(new THREE.Vector3(0, 4, 0));
    game.view.battleRoot.add(obj);
    tween(1.0, k => { obj.position.y = base.y + 4 + k * 3; el.style.opacity = String(1 - k * k); })
      .then(() => removeWithLabels(obj));
  },
  // Turns the figure towards a world position (figures look along +Z).
  face(u, x, z) {
    const p = u.view.group.position, dx = x - p.x, dz = z - p.z;
    if (dx * dx + dz * dz > 1e-6) u.view.body.rotation.y = Math.atan2(dx, dz);
  },
  // Melee lunge or projectile.
  async attackAnim(att, tgt, ranged) {
    const a = att.view.group.position.clone(), b = tgt.view.group.position.clone();
    this.face(att, b.x, b.z); this.face(tgt, a.x, a.z);
    const body = att.view.body;
    // Anticipation: lean back, then strike.
    await tween(0.16, k => { body.rotation.x = -0.28 * k; });
    if (!ranged) {
      await tween(0.22, k => { const f = Math.sin(k * Math.PI) * 0.45; att.view.group.position.lerpVectors(a, b, f); body.rotation.x = -0.28 + 0.6 * Math.sin(k * Math.PI); });
      att.view.group.position.copy(a); body.rotation.x = 0;
      return;
    }
    tween(0.18, k => { body.rotation.x = -0.28 * (1 - k); });
    const proj = new THREE.Mesh(new THREE.SphereGeometry(0.35, 8, 6), new THREE.MeshBasicMaterial({ color: att.def.color }));
    game.view.battleRoot.add(proj);
    const dist = a.distanceTo(b);
    await tween(Math.min(0.5, 0.15 + dist / 120), k => {
      proj.position.lerpVectors(a, b, k);
      proj.position.y += 2.5 + Math.sin(k * Math.PI) * dist * 0.15;
    });
    game.view.battleRoot.remove(proj);
  },
  removeUnit(u) {
    const g = u.view.group, body = u.view.body;
    u.view.label.visible = false; u.view.dying = true;
    // Fall over, sink into the ground, then vanish.
    tween(0.7, k => {
      body.rotation.x = Math.min(1, k * 1.6) * 1.45;
      body.position.y = body.userData.y0 - k * k * 1.2;
      if (k > 0.6) g.scale.setScalar(1 - (k - 0.6) / 0.4 * 0.95);
    }).then(() => removeWithLabels(g));
  },
  // Ability: an expanding ring in the power color at the caster's feet.
  castFlash(u, power) {
    if (!u.view) return;
    const mat = new THREE.MeshBasicMaterial({ color: POWER_COLORS[power] || 0xffffff, transparent: true, opacity: 0.8, depthWrite: false, side: THREE.DoubleSide });
    const m = new THREE.Mesh(new THREE.RingGeometry(0.6, 0.9, 24), mat); m.rotation.x = -Math.PI / 2;
    m.position.copy(u.view.group.position).add(new THREE.Vector3(0, 0.4, 0)); game.view.battleRoot.add(m);
    tween(0.6, k => { m.scale.setScalar(1 + k * 3); mat.opacity = 0.8 * (1 - k); }).then(() => { game.view.battleRoot.remove(m); mat.dispose(); });
  },
  // Flinch when hit.
  recoil(u) {
    if (!u.view || u.view.dying) return;
    const body = u.view.body, x0 = body.position.x;
    tween(0.24, k => { body.rotation.x = -0.32 * Math.sin(k * Math.PI); body.position.x = x0 + Math.sin(k * Math.PI * 5) * 0.08 * (1 - k); }).then(() => { body.position.x = x0; });
  },
  // Every frame: breathing / hovering idle; badly wounded stacks sway and slump.
  animate(now) {
    const b = game.battle; if (!b) return;
    const t = now / 1000;
    for (const u of b.units) {
      if (!u.alive || !u.view || u.view.dying) continue;
      const body = u.view.body, ph = u.id * 1.7, wounded = topHp(u) / u.def.hp < 0.35 || stackCount(u) <= u.startCount * 0.3;
      const speed = wounded ? 0.8 : 1.6, amp = u.def.flying ? 0.18 : 0.035;
      body.position.y = body.userData.y0 + Math.sin(t * speed + ph) * amp - (wounded ? 0.08 : 0);
      body.scale.y = body.userData.s0 * (1 + 0.012 * Math.sin(t * speed * 1.3 + ph));
      body.rotation.z = wounded ? 0.1 * Math.sin(t * 0.7 + ph) : 0;
      // Stench: rising, drifting puffs over strongly smelling units (scent 3+), blown by the wind.
      if ((u.def.scent || 0) >= 3) {
        if (!u.view.stink) {
          const mat = new THREE.MeshBasicMaterial({ color: 0x8a9a4a, transparent: true, opacity: 0.35, depthWrite: false });
          u.view.stink = Array.from({ length: 6 }, (_, i) => { const m = new THREE.Mesh(this.puffGeo || (this.puffGeo = new THREE.SphereGeometry(0.45, 6, 4)), mat.clone()); m.userData.ph = i / 6; u.view.group.add(m); return m; });
        }
        const wd = edgeDirection(b.wind), len = 1 + (u.def.scent - 2) * 0.8;
        for (const m of u.view.stink) {
          const k = (t * 0.35 + m.userData.ph) % 1;
          m.position.set(wd.x * k * 3 * len + Math.sin(t + m.userData.ph * 9) * 0.3, 1.6 + k * 3.2, wd.z * k * 3 * len);
          m.scale.setScalar(0.5 + k * 1.4); m.material.opacity = 0.32 * (1 - k) * Math.min(1, k * 5);
        }
      }
    }
  }
};

// Removes an object and makes sure CSS2D label elements inside it leave the DOM too.
function removeWithLabels(obj) {
  const labels = [];
  obj.traverse(o => { if (o.isCSS2DObject) labels.push(o); });
  for (const l of labels) { if (l.element.parentNode) l.element.parentNode.removeChild(l.element); }
  if (obj.parent) obj.parent.remove(obj);
}

// =============================================================================
// Stealth (PROMPT 9): facing, sight cones, hearing and smell.
// =============================================================================
const Stealth = {
  inCone(enemy, tq, tr) {
    const a = hexToWorld(enemy.q, enemy.r), b = hexToWorld(tq, tr);
    const dir = vectorToDirection(b.x - a.x, b.z - a.z);
    const diff = Math.min((dir - enemy.facing + 6) % 6, (enemy.facing - dir + 6) % 6);
    return diff <= 1;
  },
  sees(field, enemy, tq, tr) {
    const dist = hexDistance(enemy.q, enemy.r, tq, tr);
    if (dist > Weather.sightOf(game.battle, enemy) || dist === 0 || !this.inCone(enemy, tq, tr)) return false;
    return Combat.lineOfSight(field, field.get(enemy.q, enemy.r), field.get(tq, tr)).clear;
  },
  // Does `enemy` detect undead unit `u`? Returns the sense or null.
  detects(field, enemy, u) {
    const dist = hexDistance(enemy.q, enemy.r, u.q, u.r);
    if (this.sees(field, enemy, u.q, u.r)) return 'Sicht';
    const k = Alarm.sense(enemy);
    if (dist <= enemy.def.hear * k && u.def.size >= 2 && u.movedThisTurn) return 'Gehör';
    if (dist <= Weather.smellOf(game.battle, enemy, u) * k && !u.def.spectral) return 'Geruch';
    return null;
  },
  check(battle, units) {
    for (const e of battle.units) {
      if (e.side !== 'enemy' || !e.alive) continue;
      for (const u of units) {
        if (!u.alive) continue;
        const sense = this.detects(battle.field, e, u);
        if (sense) return { enemy: e, unit: u, sense };
      }
    }
    return null;
  },
  coneTiles(battle) {
    const set = new Map();
    for (const e of battle.units) {
      if (e.side !== 'enemy' || !e.alive || e.alert === 'alarmed') continue;
      for (const t of battle.field.tilesWithin(e.q, e.r, Weather.sightOf(battle, e))) {
        if (!this.sees(battle.field, e, t.q, t.r)) continue;
        const k = battle.field.index(t);
        if (!set.has(k) || e.alert === 'suspicious') set.set(k, Object.assign(t, { _alert: e.alert }));
      }
    }
    return [...set.values()];
  }
};

// =============================================================================
// Time of day, weather and arrival (design: Tageszeit-System, Gebietseffekte, Schlachtfeld-Ankunft)
// Four times of day, each lasting 3 rounds. Night favours the undead, day the living, morning
// brings fog. The wind decides whether the undead are smelled. The arrival state follows from
// the encounter, the alarm of the defenders, time, fog and how quiet the army is.
// =============================================================================
const TIMES = [
  { key: 'NIGHT', name: 'Nacht', sight: -2, undead: 1.15, living: 0.95, sun: [0x7080c0, 0.35], hemi: [0x5a6488, 0.55], fog: 0x2c3040 },
  { key: 'MORNING', name: 'Morgen', sight: -3, undead: 1.0, living: 1.0, sun: [0xffd8b0, 1.1], hemi: [0xc8c4c0, 0.95], fog: 0x9a968e, foggy: true },
  { key: 'DAY', name: 'Tag', sight: 1, undead: 0.95, living: 1.15, sun: [0xffe2b8, 1.9], hemi: [0xe8dcc0, 1.1], fog: BG_COLOR },
  { key: 'EVENING', name: 'Abend', sight: -1, undead: 1.05, living: 1.0, sun: [0xffa070, 1.2], hemi: [0xb89880, 0.85], fog: 0x5a4a44 }
];
const ROUNDS_PER_TIME = 3;
const BATTLE_HOURS_PER_ROUND = 2;       // 3 rounds = 6 hours = one time of day
const DIR_NAMES = ['Norden', 'Nordosten', 'Südosten', 'Süden', 'Südwesten', 'Nordwesten'];   // vectorToDirection: 0 = north, clockwise
const Weather = {
  time(b) { return TIMES[b.time]; },
  sightOf(b, u) { return Math.max(1, u.def.sight + (u.side === 'enemy' ? TIMES[b.time].sight : 0)); },
  damageMul(b, u) { const t = TIMES[b.time]; return u.side === 'player' ? t.undead : t.living; },
  // Smell is carried by the wind: downwind of the undead the radius grows, upwind it shrinks.
  smellOf(b, enemy, u) {
    const a = hexToWorld(u.q, u.r), e = hexToWorld(enemy.q, enemy.r);
    const dir = vectorToDirection(e.x - a.x, e.z - a.z);                       // from the undead to the enemy
    const diff = Math.min((dir - b.wind + 6) % 6, (b.wind - dir + 6) % 6);
    return enemy.def.smell * (diff <= 1 ? 1.5 : diff >= 2 ? 0.5 : 1);
  },
  apply(b) {
    const v = game.view, t = TIMES[b.time];
    v.sun.color.setHex(t.sun[0]); v.sun.intensity = t.sun[1];
    if (v.hemi) { v.hemi.color.setHex(t.hemi[0]); v.hemi.intensity = t.hemi[1]; }
    v.scene.fog.color.setHex(t.fog);
    if (v.scene.background && v.scene.background.setHex) v.scene.background.setHex(t.fog);
  },
  reset() {
    const v = game.view; v.sun.color.setHex(0xffe2b8); v.sun.intensity = 1.9;
    if (v.hemi) { v.hemi.color.setHex(0xe8dcc0); v.hemi.intensity = 1.1; }
    v.scene.fog.color.setHex(BG_COLOR); if (v.scene.background && v.scene.background.setHex) v.scene.background.setHex(BG_COLOR);
  },
  // Start time: rolls with the day and the place; the Wild Hunt only rides at night.
  startTime(node) {
    const c = game.campaign;
    if (Object.keys(node.garrison || {}).some(t => t === 'wode' || t === 'hackelberg' || t === 'wilder_jaeger')) return 0;
    return Campaign.timeIndex(Campaign.hour());
  },
  // How quiet is the army? 0 (ghosts) .. 4 (giants, machines).
  noise(b) {
    const pl = b.units.filter(u => u.side === 'player' && u.type !== 'lich');
    if (!pl.length) return 1;
    return Math.max(...pl.map(u => u.def.size + (u.def.spectral ? -2 : 0)));
  }
};

// =============================================================================
// Sound: everything synthesized with WebAudio (no files, works under file://).
// Short effects per power type, deaths, UI clicks, and a quiet wind / drone ambience.
// M or the speaker button mutes; the choice is remembered per browser.
// =============================================================================
const Sfx = {
  ctx: null, master: null, amb: null, muted: false,
  init() {
    // Off by default (sound is opt-in via M or the speaker button); the choice is remembered.
    this.muted = true;
    try { this.muted = localStorage.getItem('harmbringer_sound') !== 'on'; } catch (e) { /* ignore */ }
    const start = () => { this.ensure(); window.removeEventListener('pointerdown', start); window.removeEventListener('keydown', start); };
    window.addEventListener('pointerdown', start); window.addEventListener('keydown', start);
    // Hidden tab, minimized window or a closed panel: silence; back again: resume. Leaving the page closes the audio.
    const pause = () => { if (this.ctx && this.ctx.state === 'running') this.ctx.suspend(); };
    const resume = () => { if (this.ctx && this.ctx.state === 'suspended' && !document.hidden) this.ctx.resume(); };
    document.addEventListener('visibilitychange', () => (document.hidden ? pause() : resume()));
    window.addEventListener('blur', pause); window.addEventListener('focus', resume);
    window.addEventListener('pagehide', () => { if (this.ctx) { try { this.ctx.close(); } catch (e) { /* ignore */ } this.ctx = null; } });
  },
  ensure() {
    if (this.ctx) return this.ctx;
    if (this.muted) return null;                     // no audio context at all while the sound is off
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
    this.ctx = new AC(); this.master = this.ctx.createGain(); this.master.gain.value = this.muted ? 0 : 0.5; this.master.connect(this.ctx.destination);
    // White noise buffer for hits and wind.
    const n = this.ctx.sampleRate * 2, buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;

  },
  toggle() {

    if (this.muted && this.ctx) { try { this.ctx.close(); } catch (e) { /* ignore */ } this.ctx = null; this.amb = this.drone = null; }   // switched off: close it completely
    if (!this.muted) this.ensure();
    const b = document.getElementById('btnSound'); if (b) b.textContent = this.muted ? 'Ton: aus (M)' : 'Ton: an (M)';

  },
  env(g, t, a, peak, dur) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); },
  tone(freq, dur, type = 'sine', peak = 0.3, slide = 0) {

  },
  hit(power) {
    if (!this.ensure()) return;

      case 'SOUL': this.tone(520, 0.5, 'sine', 0.18, 0.4); this.tone(780, 0.4, 'triangle', 0.08, 0.5); break;
      case 'HOLY': this.tone(880, 0.9, 'sine', 0.15); this.tone(1320, 0.7, 'sine', 0.08); break;
      case 'ARCANE': case 'CHAOS': this.tone(300, 0.35, 'sawtooth', 0.07, 2.2); this.hiss(0.25, 3000, 4, 0.08); break;
      case 'FIRE': this.hiss(0.5, 900, 0.7, 0.25); break;
      case 'POISON': this.hiss(0.35, 1800, 6, 0.12); break;
      case 'PIERCE': this.hiss(0.12, 2500, 2, 0.3); this.tone(220, 0.08, 'square', 0.05); break;
      case 'SIEGE': this.tone(70, 0.5, 'sine', 0.45, 0.5); this.hiss(0.3, 300, 1, 0.3); break;
      case 'HEAL': this.tone(660, 0.4, 'sine', 0.12, 1.5); break;
      default: this.tone(110, 0.18, 'sine', 0.4, 0.5); this.hiss(0.12, 700, 1, 0.25);   // blunt, rend
    }
  },
  death() { if (this.ensure()) { this.tone(90, 0.6, 'sine', 0.35, 0.4); this.hiss(0.4, 400, 1, 0.15); } },
  click() { if (this.ensure()) this.tone(1200, 0.05, 'square', 0.03); },
  ability() { if (this.ensure()) { this.tone(440, 0.5, 'triangle', 0.12, 1.8); this.hiss(0.4, 5000, 3, 0.05); } },
  // Quiet looping ambience: wind on the map, a low drone in battle.
  ambience(kind) {

    if (this.amb) { try { this.amb.stop(); this.drone && this.drone.stop(); } catch (e) { /* ignore */ } this.amb = this.drone = null; }
    const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.noise; s.loop = true; f.type = 'lowpass'; f.frequency.value = kind === 'battle' ? 260 : 420; g.gain.value = kind === 'battle' ? 0.05 : 0.07;
    s.connect(f).connect(g).connect(this.master); s.start(); this.amb = s;
    if (kind === 'battle') { const o = c.createOscillator(), og = c.createGain(); o.type = 'sine'; o.frequency.value = 55; og.gain.value = 0.04; o.connect(og).connect(this.master); o.start(); this.drone = o; }
  }
};

// =============================================================================
// Alarm: defenders are unaware (z), suspicious (?) or alarmed (!). Only suspicious and alarmed
// stacks take turns. Whoever spots the undead is alarmed alone; on his next turn he shouts and
// wakes everyone within twice his hearing; then the alarm spreads 4 tiles per round. An alarmed
// defender on or next to a church or watch tower rings the bell: the whole field is awake.
// Unaware targets take +25 % damage and cannot strike back. Priests, witches and druids sense
// the dead: double hearing and smell, they start suspicious and shout twice as far.
// =============================================================================
const SENSE_TYPES = new Set(['hexe', 'brockenhexe', 'druidin', 'druide', 'heidekoenigin', 'zwergenkoenig', 'priester', 'moench', 'kleriker', 'heideschwester']);
const ALARM = { spreadPerRound: 4, surpriseBonus: 1.25, restlessAfterRounds: 3, combatNoise: 3 };
const Alarm = {
  enemies(state) { return Battle.alive('enemy').filter(e => !state || e.alert === state); },
  sense(e) { return SENSE_TYPES.has(e.type) ? 2 : 1; },
  awake(e) { return e.alert === 'alarmed'; },
  set(e, state, why) {
    const b = game.battle; if (!e.alive || e.alert === 'alarmed' || e.alert === state) return;
    const was = e.alert; e.alert = state;
    if (was === 'unaware') e.nextTick = Math.max(e.nextTick, (b.lastTick || 0) + Math.round(turnTicks(e.def) * 0.5));
    if (state === 'alarmed') { e.shouted = false; BattleView.floatText(e, '!'); }
    else BattleView.floatText(e, '?');
    BattleView.updateHp(e);
    if (why) Battle.log(why, 'hit');
    if (state === 'alarmed' && b.state === 'stealth') { b.state = 'fight'; UI.toast('Alarm! Die Verteidiger sind aufgeschreckt.'); }
  },
  // After a move or an attack: does any defender notice one of these undead?
  check(units) {
    const b = game.battle;
    for (const e of this.enemies()) {
      if (e.alert === 'alarmed') continue;
      for (const u of units) {
        if (!u.alive) continue;
        const sense = Stealth.detects(b.field, e, u);
        if (!sense) continue;
        if (sense === 'Sicht' || e.alert === 'suspicious') this.set(e, 'alarmed', `${e.def.name} entdeckt ${u.def.name} (${sense})!`);
        else this.set(e, 'suspicious', `${e.def.name} wird misstrauisch (${sense}).`);
        break;
      }
    }
    Battle.refreshCones();
  },
  // Fighting is loud: defenders within earshot of a fight grow suspicious.
  noise(at) {
    for (const e of this.enemies('unaware')) if (hexDistance(e.q, e.r, at.q, at.r) <= Math.max(ALARM.combatNoise, e.def.hear * this.sense(e))) this.set(e, 'suspicious', `${e.def.name} hört Kampflärm.`);
  },
  // An alarmed defender's first turn: shout, maybe ring the bell.
  shout(e) {
    const b = game.battle; if (e.shouted) return; e.shouted = true;
    const r = Math.max(2, e.def.hear * 2 * this.sense(e)); let woke = 0;
    for (const o of this.enemies()) if (o !== e && o.alert !== 'alarmed' && hexDistance(o.q, o.r, e.q, e.r) <= r) { this.set(o, 'alarmed'); woke++; }
    Battle.log(`${e.def.name} schlägt Alarm${woke ? ` – ${woke} ${woke === 1 ? 'Gruppe wacht' : 'Gruppen wachen'} auf` : ''}.`, 'hit');
    const f = b.field, here = f.get(e.q, e.r);
    const bellTile = [here, ...[0, 1, 2, 3, 4, 5].map(d => f.neighborTile(here, d))].find(t => t && t.building !== null && ['church', 'tower'].includes(f.buildings[t.building].key));
    if (bellTile && this.enemies().some(o => o.alert !== 'alarmed')) {
      for (const o of this.enemies()) this.set(o, 'alarmed');
      Battle.log(`Die Glocke im ${f.buildings[bellTile.building].name} läutet – das ganze Feld ist wach!`, 'hit'); UI.toast('Die Glocke läutet!');
      Sfx.ensure() && Sfx.tone(660, 1.5, 'sine', 0.2);
    }
  },
  roundEnd() {
    const b = game.battle;
    const awake = this.enemies('alarmed');
    for (const e of this.enemies()) if (e.alert !== 'alarmed' && awake.some(a => a.shouted && hexDistance(a.q, a.r, e.q, e.r) <= ALARM.spreadPerRound * Math.max(1, b.round - (a.alarmRound || b.round))))
      this.set(e, 'alarmed');
    for (const a of awake) a.alarmRound = a.alarmRound || b.round;
    if (!awake.length && b.round > ALARM.restlessAfterRounds && !b.restless) {
      b.restless = true;
      for (const e of this.enemies('unaware')) this.set(e, 'suspicious');
      Battle.log('Die Wachen werden unruhig – etwas stimmt nicht.', 'hit');
    }
  },
  // Suspicious defenders look around and walk towards what they heard.
  async investigate(e) {
    const b = game.battle, f = b.field, pl = Battle.alive('player');
    const near = pl.sort((x, y) => hexDistance(x.q, x.r, e.q, e.r) - hexDistance(y.q, y.r, e.q, e.r))[0];
    if (!near) return;
    const pa = hexToWorld(near.q, near.r), pe = hexToWorld(e.q, e.r);
    e.facing = vectorToDirection(pa.x - pe.x, pa.z - pe.z); BattleView.face(e, pa.x, pa.z);
    const reach = Pathfinding.reachable(f, e, Math.min(2, moveOf(e)));
    const dest = reach.tiles.filter(t => !t.unit || t.unit === e).sort((x, y) => hexDistance(x.q, x.r, near.q, near.r) - hexDistance(y.q, y.r, near.q, near.r))[0];
    if (dest && dest !== f.get(e.q, e.r)) await Battle.moveAlong(e, Pathfinding.path(f, reach, dest));
    for (const u of pl) { const s = Stealth.detects(f, e, u); if (s) { this.set(e, 'alarmed', `${e.def.name} findet ${u.def.name} (${s})!`); break; } }
    Battle.refreshCones();
  }
};

// =============================================================================
// Battle
// Initiative, turns, movement, attacks, round effects, victory and defeat.
// Rules work on plain data objects; BattleView only mirrors them.
// =============================================================================
let unitIdCounter = 1;
const Battle = {
  // Safety net: if setting up a battle fails, go back to the world map instead of a half-built field.
  async start(node, exp = null) {
    try { return await this.startBattle(node, exp); }
    catch (e) {
      console.error(e);
      if (this.saved) { const c = game.campaign, sv = this.saved; c.army = sv.army; c.nodeId = sv.nodeId; c.prevNodeId = sv.prevNodeId; c.travel = sv.travel; this.saved = null; }
      try { this.exit(); } catch (e2) { console.error(e2); game.mode = 'world'; UI.enterWorld(); WorldView.setVisible(true); }
      UI.toast(`Der Kampf konnte nicht beginnen (${e.message}). Bitte melden.`, 8, false);
    }
  },
  async startBattle(node, exp = null) {
    const c = game.campaign;
    if (this.starting) return;
    // An expedition fights with its own army: swap it in as the campaign army for the battle.
    this.saved = null;
    if (exp) {
      this.saved = { army: c.army, nodeId: c.nodeId, prevNodeId: c.prevNodeId, travel: c.travel };
      c.army = exp.army; c.nodeId = exp.nodeId; c.prevNodeId = exp.prevNodeId; c.travel = null;
    }
    // Load the figures of everyone taking part first (scripts, on demand).
    this.starting = true;
    UI.toast('Die Toten erheben sich …');
    await Figures.ensure([...c.army.map(a => a.type), ...Campaign.garrisonFor(node), ...Object.values(SUMMON_TYPE)]);
    this.starting = false;
    if (!node.encounter) Campaign.registerAttack(node);
    const field = new Battlefield(node);
    const origin = NODE_BY_ID[c.prevNodeId] && c.prevNodeId !== node.id ? NODE_BY_ID[c.prevNodeId] : PHYLACTERY;
    const cpos = hexToWorld(node.q, node.r), opos = hexToWorld(origin.q, origin.r);
    let dx = opos.x - cpos.x, dz = opos.z - cpos.z;
    if (Math.hypot(dx, dz) < 1e-3) { dx = 0; dz = 1; }
    const len = Math.hypot(dx, dz), dir = { x: dx / len, z: dz / len };
    const b = game.battle = {
      node, field, dir, units: [], log: [], round: 1, lastTick: null, current: null,
      state: 'fight', busy: false, retreatPending: false, kills: [], reach: null, targets: [],
      selected: null, hover: null, over: false, corpses: new Map(), abilityMode: null,
      time: Weather.startTime(node), wind: Math.floor(hash2(node.q, node.r, c.dayCount * 7 + 3) * 6), arrival: 'STANDARD',
      expedition: exp, leader: exp ? exp.leader : 'lich'
    };
    // Player army.
    for (const g of groupByType(c.army)) b.units.push(this.makeStack(g.type, 'player', 'UNDEAD', g.hps));
    this.applyArmyEffects(b);
    this.applyLichBonus(b); this.applyCommanderBonus(b);
    const garrison = Campaign.garrisonFor(node).map(type => ({ type, hp: DATA.units[type].hp }));
    for (const g of splitStacks(groupByType(garrison))) b.units.push(this.makeStack(g.type, 'enemy', node.faction, g.hps));
    // Ley-Bund: a pantheon leader is shielded by every living member of its pantheon.
    const pidB = Pantheons.memberOf(node);
    if (pidB && DATA.pantheons[pidB].seat === node.id) {
      for (const u of b.units) if (u.side === 'enemy') u.shield += LEY.homeShield * stackCount(u);
      this.log(`Heimvorteil: Am Sitz des ${DATA.pantheons[pidB].name}s schützt der Ley-Knoten die Verteidiger (+${LEY.homeShield} Seelenschild je Kreatur).`, 'hit');
    }
    if (pidB) for (const u of b.units) if (u.side === 'enemy' && (u.def.abilities || []).includes('HeathQueenLeyBond')) {
      const add = Math.min(20, (Pantheons.living(pidB).length - 1) * DATA.abilities.HeathQueenLeyBond.value);
      if (add > 0) { u.shield += add; this.log(`Ley-Bund: ${u.def.name} +${add} Seelenschild (${Pantheons.living(pidB).length - 1} Mitglieder leben).`, 'hit'); }
    }
    this.deploy(b);

    // View: lock the tile window on the node, dim everything outside the field.
    const tr = game.view.tiles;
    tr.floorOverride = (q, r) => { const t = field.get(q, r); return t ? FLOOR_INDEX[t.floor] : -1; };
    tr.heightOverride = (q, r) => { const t = field.get(q, r); return t ? t.y : null; };
    tr.dimOutside = (q, r) => !field.contains(q, r);
    tr.locked = true;
    tr.center = [node.q, node.r];
    tr.rebuild();
    WorldView.setVisible(false);
    BattleView.init(field);
    b.units.forEach(u => BattleView.createUnit(u));
    const cam = game.view.cam;
    cam.setFieldBounds(field.q0, field.r0, field.size);
    const pl = b.units.filter(u => u.side === 'player');
    const mq = Math.round((node.q + pl.reduce((s, u) => s + u.q, 0) / pl.length) / 2);
    const mr = Math.round((node.r + pl.reduce((s, u) => s + u.r, 0) / pl.length) / 2);
    cam.lookAtTile(mq, mr);
    cam.yaw = Math.atan2(dir.x, dir.z);
    cam.distance = Math.min(CAM.maxZoom, 25 + node.size * 1.4);
    game.mode = 'battle';
    UI.enterBattle();
    this.log(`${node.encounter ? node.name + '!' : 'Angriff auf ' + node.name + '!'} (${b.units.filter(u => u.side === 'enemy').reduce((n, u) => n + stackCount(u), 0)} Verteidiger in ${b.units.filter(u => u.side === 'enemy').length} Gruppen)`, 'hit');

    // Stealth phase (PROMPT 9).
    const base = vectorToDirection(dir.x, dir.z), rng = makeRng(field.seed + 17);
    for (const u of b.units) if (u.side === 'enemy') u.facing = (base + Math.floor(rng() * 3) - 1 + 6) % 6;
    Weather.apply(b);
    for (const u of b.units) if (u.side === 'enemy' && BOSS_LINES[u.type]) { Narrator.speak(u.type, BOSS_LINES[u.type], 'boss_' + u.type, u.faction); break; }
    const T = TIMES[b.time], windTxt = `Wind aus ${DIR_NAMES[(b.wind + 3) % 6]}`;
    this.log(`${T.name}${T.foggy ? ', Nebel' : ''} · ${windTxt}. ${b.time === 0 ? 'Die Toten sind in ihrem Element.' : b.time === 2 ? 'Das Tageslicht stärkt die Lebenden.' : ''}`);
    const alarm = !node.encounter && ((game.campaign.threat[node.faction] || 0) >= 50 || Raids.list().some(r => r.faction === node.faction));
    const senses = Object.keys(node.garrison || {}).some(t => ['hexe', 'brockenhexe', 'druidin', 'heidekoenigin', 'zwergenkoenig', 'priester'].includes(t));
    const quiet = Weather.noise(b) <= 2 && (b.time === 0 || T.foggy);
    const enemies = b.units.filter(u => u.side === 'enemy');
    if (node.encounter) {
      // Ambush on the road (or an intercepted war party): everyone is awake.
      b.arrival = node.raidId ? 'STANDARD' : 'AMBUSH'; b.state = 'fight';
      for (const u of enemies) { u.alert = 'alarmed'; u.shouted = true; }
      if (!node.raidId) {
        for (const u of b.units) if (u.side === 'enemy') u.nextTick -= roundFrac(4); else Abilities.addStatus(u, 'SLOWED', 1, 0, true);
        UI.toast('Hinterhalt! Der Feind ist zuerst am Zug, eure Reihen sind ungeordnet.', 5);
        this.log('Hinterhalt: Gegner handeln zuerst, eure Einheiten sind im ersten Zug verlangsamt.', 'hit');
      }
    } else if (alarm) {
      b.arrival = 'WARNED'; b.state = 'fight';
      for (const u of enemies) { u.alert = 'alarmed'; u.shouted = true; u.nextTick -= roundFrac(2); Abilities.addStatus(u, 'SHIELDED', 1, 2 * stackCount(u), true); }
      UI.toast('Vorwarnung! Die Verteidiger sind gewarnt und stehen in Stellung.', 5);
      this.log('Vorwarnung: Gegner in Stellung, etwas geschützt und früher am Zug.', 'hit');
    } else {
      // Normal arrival: everyone unaware, those who sense the dead suspicious; then who notices whom.
      b.arrival = 'SURPRISE'; b.state = 'stealth';
      for (const u of enemies) u.alert = SENSE_TYPES.has(u.type) ? 'suspicious' : 'unaware';
      if (!quiet) Alarm.check(b.units.filter(u => u.side === 'player'));
      const awake = enemies.filter(u => u.alert === 'alarmed').length, wary = enemies.filter(u => u.alert === 'suspicious').length;
      if (awake) UI.toast(`Entdeckt! ${awake} ${awake === 1 ? 'Gruppe ist' : 'Gruppen sind'} alarmiert – die übrigen ahnen noch nichts.`, 5);
      else UI.toast(`${quiet ? (b.time === 0 ? 'Die Nacht deckt euch.' : 'Der Nebel deckt euch.') : 'Unbemerkt.'} Die Wachen ahnen nichts${wary ? `, ${wary} sind misstrauisch` : ''}.`, 5);
      this.log(`Schleichen: ${enemies.length - awake - wary} ahnungslos (z), ${wary} misstrauisch (?), ${awake} alarmiert (!). Ahnungslose handeln nicht; Treffer auf sie sind Überraschungstreffer (+25 %, kein Konter). Wer Alarm schlägt, weckt die anderen.`, 'good');
    }
    this.refreshCones();
    if (!exp) SaveGame.save();
    UI.roundBanner(1, `${node.name} · ${TIMES[b.time].name}`);
    Narrator.hint('Kampf: Die Einheit mit dem goldenen Ring ist am Zug. Blaue Felder = Bewegung, rote = angreifbare Gegner, über einem Gegner siehst du den erwarteten Schaden. Fähigkeiten unten rechts (Tasten 1–4), Leertaste beendet den Zug.', 'battle');
    Narrator.hint('Solange die Gegner euch nicht bemerkt haben (Schleich-Modus), ist der erste Angriff ein Überraschungsangriff. Der Wind trägt den Geruch der Toten.', 'stealth');
    if (b.field.cityWall) this.log('Die Stadt ist ummauert: Schützen stehen auf dem Wehrgang und in den Türmen. Tore lassen sich rammen (jede Einheit, langsam), die Mauer brechen nur Belagerungswaffen und Riesen (Balliste, Fleischriese, Knochendrache, Hünenkönig). Flieger fliegen hinüber, Geister gehen hindurch.', 'hit');
    else if (b.field.edgeInfo && [...b.field.edgeInfo.values()].some(x => x.kind === 'palisade')) this.log('Eine Palisade umgibt den Ort: Lücken lassen sich nutzen, das Holz lässt sich einschlagen.', 'hit');
    // Some places need special troops (flyers, ghosts, swimmers). Say so at once – withdrawal costs nothing yet.
    const cut = this.unreachableEnemies();
    if (cut.length) {
      const all = cut.length === b.units.filter(u => u.side === 'enemy' && u.alive).length;
      const msg = `${all ? 'Kein Gegner ist' : `${cut.length} ${cut.length === 1 ? 'Gegnergruppe ist' : 'Gegnergruppen sind'}`} für eure Einheiten erreichbar (${[...new Set(cut.map(u => u.def.name))].join(', ')}). Hier braucht es Flieger, Geister oder Fernkämpfer. „Abziehen“ ist ohne Verluste möglich, solange nicht gekämpft wurde.`;
      this.log(msg, 'hit');
      this.offerWithdraw(all ? 'Unerreichbar' : 'Nicht alle Gegner erreichbar', msg);
    } else if (b.field.cityWall && !b.units.some(u => u.side === 'player' && (isSiege(u) || u.def.flying || u.def.spectral))) {
      this.offerWithdraw('Ummauerte Stadt', 'Euch fehlen Belagerungswaffen und Riesen (Balliste, Fleischriese, Knochendrache, Hünenkönig), Flieger und Geister. Die Mauer bleibt zu, nur die Tore lassen sich langsam rammen – unter Beschuss vom Wehrgang.');

  },
  // A stack of `hps.length` creatures. Wounds are pooled so only the top creature is wounded
  // (never fewer creatures than came in).
  makeStack(type, side, faction, hps) {

    const u = this.makeUnit(type, side, faction, total);

  },
  // The Lich grows with his army (economy.lichArmyBonus per command point in use). His def is
  // copied so the bonus stays in this battle; wounds keep their share of the boosted HP.
  applyLichBonus(b) {
    const lich = b.units.find(u => u.type === 'lich'), B = ECON.lichArmyBonus;
    if (!lich || !B) return;

    for (const u of this.alive(who === 'enemy' ? 'enemy' : 'player')) u.nextTick += roundFrac(bonus);
    UI.toast(msg);
    this.log(msg, who === 'enemy' ? 'hit' : 'good');
    this.refreshCones();
    UI.updateBattle();
  },
  async playerAttack(target) {
    const b = game.battle, u = b.current;
    b.busy = true;
    this.clearOptions();
    const surprise = target.side === 'enemy' && target.alert !== 'alarmed';
    await this.performAttack(u, target, surprise);
    u.hasAttacked = true;
    b.busy = false;
    if (b.over) return;
    if (target.alive) Alarm.set(target, 'alarmed', surprise ? `${target.def.name} schreckt auf!` : '');
    Alarm.noise(b.field.get(target.q, target.r)); Alarm.check([u]);
    // Attack first, move afterwards: the unit keeps its turn while it still has its move.
    if (u.alive && !u.hasMoved && b.current === u) {
      this.computeOptions();
      if (b.reach && b.reach.tiles.some(t => !t.unit)) return;
    }
    this.endTurn();
  },
  applyDamage(target, dmg, killer, power) {
    if (game.battle) game.battle.contact = true;
    // Soul shield pool absorbs any damage first and does not regenerate during the battle.
    const absorbed = Math.min(target.shield || 0, dmg);
    target.shield = (target.shield || 0) - absorbed;
    const before = stackCount(target);
    target.hp -= dmg - absorbed;
    let deaths = before - stackCount(target);
    if (deaths) { const i = game.battle.field.index(game.battle.field.get(target.q, target.r)); game.battle.corpses.set(i, (game.battle.corpses.get(i) || 0) + deaths); }
    if (target.hp <= 0 && Abilities.beforeDeath(target, power)) deaths = before - stackCount(target);
    BattleView.updateHp(target);
    if (dmg > 0 && power) { BattleView.burst(target, power); Sfx.hit(power); if (target.hp > 0) BattleView.recoil(target); }
    BattleView.syncCorpses();
    BattleView.floatText(target, dmg === 0 ? 'immun' : (absorbed ? `−${dmg - absorbed} (Schild ${absorbed})` : '−' + dmg) + (deaths && target.hp > 0 ? ` · ${deaths} †` : ''));
    // Every fallen creature leaves loot (corpse quality depends on the killing blow).
    if (target.side === 'enemy' && killer && killer.side === 'player')
      for (let i = 0; i < deaths; i++) game.battle.kills.push({ quality: DATA.corpseQuality[power] ?? 0, soul: power === 'SOUL' });
    if (deaths && target.hp > 0) this.log(`${deaths}× ${target.def.name} ${deaths > 1 ? 'fallen' : 'fällt'}, ${stackCount(target)} übrig.`, target.side === 'player' ? 'hit' : 'good');
    if (target.hp <= 0) this.kill(target, killer, power);
  },
  async performAttack(att, target, surprise = false) {
    const b = game.battle, f = b.field;
    const from = f.get(att.q, att.r), tt = f.get(target.q, target.r);
    const chk = Combat.canAttack(f, att, from, target);
    if (!chk.ok) return;
    const prof = Combat.profile(att, target);
    await BattleView.attackAnim(att, target, chk.dist > 1);
    if (game.battle !== b || b.over) return;
    if (prof.power === 'HEAL') {
      const h = Math.min(prof.damage, target.def.hp - topHp(target));
      target.hp += h; BattleView.updateHp(target); BattleView.floatText(target, '+' + h, true);
      this.log(`${att.def.name} heilt ${target.def.name} (+${h}).`);
      return;
    }
    const dmg = Math.round(Combat.damage(prof, target.def, from.level, tt.level, chk.cover) * Abilities.damageMul(att, target) * (surprise ? ALARM.surpriseBonus : 1));
    if (dmg === 0) this.log(`${target.def.name} ist immun gegen ${POWER_NAMES[prof.power]}-Schaden.`, 'hit');
    else this.log(`${att.def.name} trifft ${target.def.name}: ${dmg} Schaden${chk.cover ? ' (Deckung)' : ''}${surprise ? ' – Überraschung!' : ''}.`, att.side === 'player' ? 'good' : 'hit');
    this.applyDamage(target, dmg, att, prof.power);
    if (b.over) return;
    Abilities.afterHit(att, target, dmg);
    // Counter: surviving melee targets with counter strike back once at 50 %.
    if (target.alive && chk.dist === 1 && !chk.window && target.def.counter && !surprise && !(target.status && target.status.LEADERLESS)) {
      const back = Combat.canAttack(f, target, tt, att);
      if (back.ok) {
        await wait(0.15);
        const cprof = Combat.profile(target, att);
        const full = Combat.damage(cprof, att.def, tt.level, from.level, back.cover);
        const cd = full === 0 ? 0 : Math.max(1, Math.round(full * 0.5 * Abilities.damageMul(target, att)));
        await BattleView.attackAnim(target, att, false);
        this.log(`${target.def.name} kontert: ${cd} Schaden.`, target.side === 'player' ? 'good' : 'hit');
        this.applyDamage(att, cd, target, cprof.power);
      }
    }
  },
  kill(u, killer, power) {
    const b = game.battle;
    if (!u.alive) return;
    Sfx.death();
    // A fallen leader alarms the living.
    if (u.side === 'enemy' && u.def.rank === 'UNIQUE') {
      const c = game.campaign;
      for (const f of ENEMY_FACTIONS) if (Campaign.isLiving(f)) c.threat[f] = Math.min(100, c.threat[f] + (f === u.faction ? 15 : 5));
      this.log(`Der Tod von ${u.def.name} erschüttert die Lebenden (Bedrohung steigt).`, 'hit');
      if (BOSS_LINES[u.type]) Narrator.speak('lich', LICH_LINES.bossDown, 'bossDown');
    }
    u.alive = false;
    b.field.get(u.q, u.r).unit = null;
    BattleView.removeUnit(u);
    this.log(u.startCount > 1 ? `Die letzten ${u.def.name} fallen.` : `${u.def.name} fällt.`, u.side === 'player' ? 'hit' : 'good');
    if (u.side === 'player' && !this.alive('player').length) { this.finish('defeat'); return; }
    if (u.side === 'player' && u.type === b.leader) {
      // The leader is gone: his servants fight on by themselves (leaderless); survivors wait on the spot.
      b.leaderFallen = true; b.auto = true; b.retreatPending = false;
      for (const x of this.alive('player')) { x.status = x.status || {}; x.status.LEADERLESS = { turns: 999, value: 2 }; BattleView.updateHp(x); }
      const who = u.type === 'lich' ? 'Der Lich' : u.def.name;
      this.log(`${who} ist gefallen! Die Diener kämpfen führerlos allein weiter. Überleben sie, warten sie hier auf ${u.type === 'lich' ? 'den Lich' : 'Abholung'}.`, 'hit');
      UI.toast(`${who} ist gefallen – die Untoten kämpfen allein weiter.`, 5, false);
      this.clearOptions(); UI.updateBattle();
      // Fell while it was his own turn and nothing else is running: hand on to the next unit.
      if (b.current === u && !b.busy) setTimeout(() => { if (game.battle === b && !b.over && b.current === u) this.endTurn(); }, 300);
    }
    Abilities.afterDeath(u);
    if (u.side === 'player' && (u.def.commandPoints || 0) < 0) this.checkLeaderless(u);
    if (!this.alive('enemy').length) this.finish('victory');
  },
  // Player picks an ability: immediate ones fire at once, others wait for a target tile.
  async chooseAbility(id) {
    const b = game.battle, u = b && b.current;
    if (!u || u.side !== 'player' || b.busy || b.over || Abilities.blocker(u, id)) return;
    if (b.abilityMode === id) { b.abilityMode = null; this.computeOptions(); return; }
    const a = DATA.abilities[id];
    if (['SELF', 'ALL_ALLIES', 'ALL_ENEMIES'].includes(a.target)) { await this.castAbility(id, b.field.get(u.q, u.r)); return; }
    b.abilityMode = id;
    BattleView.setOverlay(BattleView.overlay, Abilities.validTiles(u, id).map(t => ({ t, color: '#a050e0', lift: 0.02 })));
    UI.updateBattle();
  },
  async castAbility(id, tile) {
    const b = game.battle, u = b.current;
    b.busy = true; b.abilityMode = null; this.clearOptions();
    await Abilities.use(u, id, tile);
    b.busy = false;
    if (b.over || game.battle !== b) return;
    for (const e of Alarm.enemies()) if (e.alert !== 'alarmed' && hexDistance(e.q, e.r, tile.q, tile.r) <= 2) Alarm.set(e, 'alarmed');
    Alarm.noise(tile); Alarm.check([u]);
    if (u.alive && !u.hasMoved && b.current === u) {
      this.computeOptions();
      if (b.reach && b.reach.tiles.some(t => !t.unit)) return;
    }
    this.endTurn();
  },
  // A commander fell: stacks over the command budget lose their leadership (the last ones first).
  checkLeaderless(fallen) {
    const b = game.battle, alive = this.alive('player');
    const budget = (b.expedition ? EXPEDITION.commandLimit : Campaign.commandLimit());
    let used = alive.reduce((s, x) => s + Math.max(0, x.def.commandPoints || 0) * stackCount(x), 0)
      - alive.reduce((s, x) => s + Math.max(0, -(x.def.commandPoints || 0)) * stackCount(x), 0) * (b.expedition ? 0 : 1);
    const lost = [];
    for (const x of [...alive].reverse()) {
      if (used <= budget) break;
      if (x.type === 'lich' || (x.def.commandPoints || 0) <= 0 || x.status.LEADERLESS) continue;
      x.status.LEADERLESS = { turns: 999, value: 2 }; BattleView.updateHp(x); lost.push(x.def.name);
      used -= x.def.commandPoints * stackCount(x);
    }
    if (lost.length) this.log(`${fallen.def.name} ist gefallen – führerlos: ${lost.join(', ')} (−2 Initiative, kein Konter, Zerfall).`, 'hit');
  },
  // Living player stacks back to campaign units; `loss` share of each stack (not Lich or commanders)
  // stays behind. Remembers how many of each stack got away (b.kept, for the losses list).
  survivors(loss) {
    const b = game.battle; b.kept = new Map();
    return this.alive('player').flatMap(u => {
      if (u.type === 'lich') { b.kept.set(u, 1); return [{ type: 'lich', hp: this.lichCampaignHp(u) }]; }
      const n0 = stackCount(u), lost = COMMANDER_TYPES.includes(u.type) || u.type === b.leader ? 0 : Math.round(n0 * loss), n = n0 - lost;
      b.kept.set(u, n);
      if (n <= 0) return [];
      // The wounded front creature is the one that stays behind first.
      const baseHp = DATA.units[u.type].hp, back = x => Math.max(1, Math.round(x / u.def.hp * baseHp));
      const top = lost ? u.def.hp : u.hp - (n0 - 1) * u.def.hp;
      return Array.from({ length: n }, (_, i) => ({ type: u.type, hp: back(i < n - 1 ? u.def.hp : top) }));
    });
  },
  // At the start: explain the problem and offer the lossless withdrawal right there.
  offerWithdraw(title, text) {
    const b = game.battle;
    if (b.node.encounter) return;
    setTimeout(() => { if (game.battle !== b || b.over || b.contact) return;
      UI.modal(`<h2>${esc(title)}</h2><p>${esc(text)}</p><p class="small">Jetzt abziehen kostet nichts: Die ganze Armee verlässt das Feld und bleibt vor ${esc(b.node.name)} stehen. Sobald gekämpft wurde, kostet ein Rückzug ein Viertel der Truppen.</p>`,
        [{ label: 'Abziehen (ohne Verluste)', primary: true, action: () => this.finish('withdraw') }, { label: 'Weiterkämpfen', action: () => {} }]); }, 900);
  },
  // Enemies that no player unit can ever reach or shoot (water, cliffs), ignoring other units.
  unreachableEnemies() {
    const b = game.battle, f = b.field, en = b.units.filter(u => u.side === 'enemy' && u.alive);
    // Gates and palisades can be broken by anybody, walls by siege units: count them as passable.
    const siege = b.units.some(u => u.side === 'player' && u.alive && isSiege(u));
    f.passBreakable = info => info.kind === 'gate' || info.kind === 'palisade' || siege;
    let reach;
    try { reach = b.units.filter(u => u.side === 'player' && u.alive).map(u => ({ u, tiles: [...Pathfinding.search(f, u, 9999, true).cost.keys()].map(i => f.tiles[i]) })); }
    finally { f.passBreakable = null; }
    return en.filter(e => !reach.some(({ u, tiles }) => tiles.some(t => hexDistance(t.q, t.r, e.q, e.r) <= Math.max(1, u.def.range))));
  },
  // Withdrawal without losses: before any blow was struck, or when no enemy can be reached at all.
  canWithdraw() {
    const b = game.battle; if (!b || b.over || b.node.encounter) return false;
    if (!b.contact) return true;
    const en = b.units.filter(u => u.side === 'enemy' && u.alive);
    return en.length > 0 && this.unreachableEnemies().length === en.length;
  },
  retreat() {
    const b = game.battle;
    if (!b || b.over || b.retreatPending) return;
    if (this.canWithdraw()) {
      UI.modal(`<h2>Abziehen?</h2><p>${b.contact ? 'Kein Gegner ist erreichbar.' : 'Noch wurde kein Schlag geführt.'} Die ganze Armee zieht geordnet ab und bleibt vor ${esc(b.node.name)} stehen. Keine Verluste, keine Beute; die Zeit des Kampfes vergeht.</p>`,
        [{ label: 'Abziehen', primary: true, action: () => this.finish('withdraw') }, { label: 'Weiterkämpfen', action: () => {} }]);
      return;
    }
    b.retreatPending = true;
    this.log('Rückzug befohlen. Er gelingt zu Beginn des nächsten Zugs des Lichs.', 'hit');
    UI.toast('Rückzug befohlen – zu Beginn des nächsten Lich-Zugs.');
  },

  finish(result) {
    const b = game.battle, c = game.campaign, node = b.node;
    if (b.over) return;
    b.over = true;
    c.battles++;
    UI.news(`${result === 'victory' ? 'Sieg' : result === 'retreat' ? 'Rückzug' : result === 'withdraw' ? 'Abzug' : 'Niederlage'}: ${node.name}${node.encounter ? ' (unterwegs)' : ''} nach ${b.round} ${b.round === 1 ? 'Runde' : 'Runden'}.`, 'battle');
    let html = '', endNow = false;

    if (result === 'victory') {
      const fx = Campaign.effects();
      const corpses = Math.floor(b.kills.reduce((s, k) => s + ECON.corpsesPerKill * k.quality, 0) * (1 + (fx.lootCorpsesPct || 0)));
      const bones = Math.floor(b.kills.length * ECON.bonesPerKill * (1 + (fx.lootBonesPct || 0)));
      const souls = b.kills.filter(k => k.soul).length * ECON.soulsPerSoulKill + (fx.soulsPerVictory || 0);
      const knowledgeBonus = fx.knowledgePerVictory || 0;
      // Burnt earth: a place plundered before yields only half of its fixed reward each time.
      const plundered = (c.plundered = c.plundered || {})[node.id] || 0;

        const lostN = u.startCount - (u.alive ? stackCount(u) : 0);

        const cost = DATA.units[u.type].cost || {};
        for (const k of ['corpses', 'bones']) if (cost[k]) { const v = Math.floor(cost[k] * lostN * 0.5); loot[k] = (loot[k] || 0) + v; recycled[k] = (recycled[k] || 0) + v; }

      html = node.raidId
